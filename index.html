<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Chonky Wonton Cafe" />
<title>Chonky Wonton Cafe — Prototype</title>
<style>
  html, body { margin: 0; padding: 0; background: #FAF4EA; height: 100%; overflow: hidden; }
  #game { width: 100vw; height: 100vh; }
  * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
</style>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
<div id="game"></div>
<script>
"use strict";

const W = 390, H = 844;
const COL = {
  cream:    0xFAF4EA,
  floor:    0xF3E7D3,
  floorAlt: 0xEEE0CA,
  wall:     0xC9B79A,
  counter:  0xB98B5E,
  card:     0xFFFFFF,
  red:      0xD64545,
  tan:      0xE8C39E,
  pink:     0xF2A6B3,
  green:    0x8FBF6F,
  brown:    0x5A453B,
  dim:      0xB6A488,
  amber:    0xE0913B,
  btn:      0x7BA86B,
  btnOff:   0xC4BBA8,
};
const hex = c => '#' + c.toString(16).padStart(6, '0');

const ORDERS = {
  dumpling: { emoji:'🥟', value:5, cookMs:2500 },
  boba:     { emoji:'🧋', value:7, cookMs:3000 },
  noodle:   { emoji:'🍜', value:9, cookMs:3500 },
};
const ACCENT = { dumpling: COL.red, boba: COL.pink, noodle: COL.amber };

const COST = { dumpling:20, boba:30, noodle:50, pet:50 };
const LOCKED_TYPES = ['noodle'];   // visible but not buildable yet — reserved for a future update

// Shared pantry: ingredient types that recipes draw from. One stall per type today,
// but the pantry is global so future same-type stalls would share stock.
const INGREDIENTS = {
  dough: { emoji:'🌾', label:'Dough' },   // 🥟 dumplings
  tea:   { emoji:'🍵', label:'Tea'   },   // 🧋 boba
  broth: { emoji:'🍲', label:'Broth' },   // 🍜 noodles (future)
};
const RECIPE_ING     = { dumpling:'dough', boba:'tea', noodle:'broth' };
const START_STOCK    = 100;   // each ingredient's starting count (a full restock's worth in the bank)
const GRAND_OPENING_BONUS = 40;  // cushion granted when the tutorial completes, before wages begin
const RESTOCK_AMOUNT = 100;   // units added per restock purchase (a big, deliberate buy)
const RESTOCK_COST   = 100;   // coins per restock (1 / unit, below dish value)
const WAGE_PER_SEC   = 0.5;   // coins each employee costs per second (only once tutorial is done)
const BROKE_RECOVER  = 5;     // balance needed to clear the unpaid/"broke" state

// Stations hold multiple worker slots (capacity 1, upgradable) and offer upgrades.
const MAX_SLOTS    = 3;       // worker slots a station can reach via the Capacity upgrade
const UPGRADE_MAX  = 3;       // max level for speed / price / efficiency
const UPGRADE_GROW = 1.7;     // each level multiplies an upgrade's cost
const UPGRADES = {
  cap:   { emoji:'👥', label:'Capacity',   effect:'+1 worker slot (cook in parallel)', base:120 },
  speed: { emoji:'⚡', label:'Cook Speed',  effect:'each level ~18% faster',            base:60  },
  price: { emoji:'💲', label:'Dish Price',  effect:'+3 💰 per dish served',              base:80  },
  eff:   { emoji:'🌿', label:'Efficiency',  effect:'chance to use no ingredient',        base:70  },
};
const WORKER_EMOJIS = ['🐱', '🐶', '🐰', '🐻', '🦊', '🐼', '🐯', '🐸'];
const START_COINS = 50;   // enough to build 🥟, then 🧋 + hire across the tutorial
const PATIENCE_MS  = 12000;
const SPAWN_MS     = 2600;
const WALK_MS      = 1300;

// fixed station slots along the back, and customer waiting spots
const SLOT_Y = 210;
const SLOT_X = [78, 195, 312];
const PANTRY_Y = 123;   // ingredient chips sit here, directly above each station column
const SLOT_TYPES = ['dumpling', 'boba', 'noodle'];  // each slot is locked to one recipe
const ORDERABLE_TYPES = SLOT_TYPES.filter(t => !LOCKED_TYPES.includes(t));  // what customers may ask for
const WAIT_Y = 510;
const WAIT_X = [65, 130, 195, 260, 325];   // up to 5 table positions
const START_TABLES = 2;
const MAX_TABLES   = 5;
const TABLE_COST   = 50;
const DOOR   = { x: W/2, y: 826 };

class Cafe extends Phaser.Scene {
  constructor() { super('cafe'); }

  create() {
    this.coins = START_COINS;
    this.served = 0;
    this.lost = 0;
    this.stepHint = '';           // the standing instruction shown in the hint pill

    // Economy: a shared ingredient pantry, and a continuous wage drain.
    this.pantry = { dough: START_STOCK, tea: START_STOCK, broth: START_STOCK };
    this.wageBucket = 0;          // fractional wages owed, paid out in whole coins
    this.broke = false;           // true while you can't make payroll → staff idle
    this.lowSeen = {};            // first-time "out of X" hints, shown once each

    // Workers are distinct helpers you move between stalls. One to start, idle.
    this.workers = [];
    this.workerSeq = 0;
    this.picker = null;           // open worker-picker overlay, if any
    this.menu = null;             // open station-menu overlay, if any
    this.confirm = null;          // open confirmation dialog, if any
    this.addWorker();             // helper #1 — the greeter

    // Onboarding phases:
    //  intro    greeting; tap to continue
    //  d-build  customer #1 (dumpling) waits, build the 🥟 stall
    //  d-run    customers #2-3 (dumpling) stream in and get served
    //  b-build  customer #4 (boba) waits, build the 🧋 stall
    //  b-move   boba stall built; move your one helper over to make boba
    //  h-earn   normal play; serving up to a 50 💰 balance
    //  h-hire   reached 50 💰 — advised to hire a second helper
    //  done     normal play (tutorial complete)
    this.tutPhase = 'intro';
    this.spawnCount = 0;          // how many customers have spawned
    this.spawnStarted = false;    // is the recurring spawn loop running yet
    this.firstStation = null;     // the dumpling station (our speaking employee)

    this.tableCount = START_TABLES;   // active tables; customers only enter if one is free
    this.customers = [];
    this.stations = [];
    this.waitSpots = WAIT_X.map(x => ({ x, y: WAIT_Y, taken: null }));
    this.slots = SLOT_X.map((x, i) => ({ x, y: SLOT_Y, type: SLOT_TYPES[i], station: null, pad: null }));

    this.drawRoom();
    this.buildHud();
    this.buildToolbar();
    this.buildPantry();

    // Onboarding: one employee, no stations. Tap the greeting to begin; the first
    // customer arrives and the employee asks you to build their stall.
    this.makeTutorialEmployee();

    this.input.on('pointerdown', (p) => this.handleTap(p.x, p.y));
  }

  // ---------------- Workers ----------------
  addWorker() {
    const emoji = WORKER_EMOJIS[this.workers.length % WORKER_EMOJIS.length];
    const w = { id: ++this.workerSeq, emoji, speed: 1, station: null, slot: null };
    this.workers.push(w);
    return w;
  }

  freeWorkers() { return this.workers.filter(w => !w.station); }

  // Place worker w into a specific station slot. If the slot was filled, that worker
  // swaps into w's old slot (or goes idle if w was idle).
  assignToSlot(w, station, slot) {
    if (w.slot === slot) return;
    const prevW = slot.pet;                      // who's in the target slot now
    const fromSt = w.station, fromSlot = w.slot; // where w came from (or null = idle)
    if (fromSlot) fromSlot.pet = null;
    w.station = station; w.slot = slot; slot.pet = w;
    if (prevW && prevW !== w) {                  // displaced worker swaps into w's old slot (or idle)
      prevW.station = fromSlot ? fromSt : null;
      prevW.slot = fromSlot || null;
      if (fromSlot) fromSlot.pet = prevW;
    }
    this.refreshSlot(slot);
    if (fromSlot && fromSlot !== slot) this.refreshSlot(fromSlot);
    if (fromSt && fromSt !== station) this.refreshStationStatus(fromSt);
    this.refreshStationStatus(station);
    this.refreshHud();
  }

  // Send the worker in this slot back to the idle pool.
  clearSlot(slot) {
    const w = slot.pet;
    if (w) { w.station = null; w.slot = null; }
    slot.pet = null;
    this.refreshSlot(slot);
    this.refreshHud();
  }

  // ---------------- Onboarding ----------------
  scriptedType(n) {
    if (n <= 3) return 'dumpling';   // customers 1-3
    if (n <= 6) return 'boba';       // customers 4-6
    return null;                     // 7+ random
  }

  setPhase(p) { this.tutPhase = p; this.refreshBuildPads(); this.refreshToolbar(); }

  setStepHint(msg) { this.stepHint = msg || ''; this.setHint(this.stepHint); }

  // Which recipe (if any) the player may build right now.
  isLocked(type) { return LOCKED_TYPES.includes(type); }

  canBuildPhase(type) {
    if (this.isLocked(type)) return false;
    switch (this.tutPhase) {
      case 'done':
      case 'h-earn':
      case 'h-hire':  return true;     // free play once the boba step is done
      case 'd-build': return type === 'dumpling';
      case 'b-build': return type === 'boba';
      default:        return false;   // intro, d-run, b-move
    }
  }

  // tutorial phases that behave like normal play for building/managing helpers
  inFreePlay() { return this.tutPhase === 'done' || this.tutPhase === 'h-earn' || this.tutPhase === 'h-hire'; }

  // hint shown when a gated control is tapped before its phase
  tutHint() {
    return {
      'd-build':'Build the 🥟 stall first',
      'd-run'  :'Let your helper serve these first…',
      'b-build':'Build the 🧋 stall first',
      'b-move' :'Move your helper to the 🧋 stall',
      'h-earn' :'Keep serving to save up ' + COST.pet + ' 💰',
      'h-hire' :'Hire your new helper first 🐾',
    }[this.tutPhase] || '';
  }

  makeTutorialEmployee() {
    const x = W/2, y = 250;
    const cont = this.add.container(x, y).setDepth(30);
    cont.add(this.add.circle(0, 0, 27, COL.tan).setStrokeStyle(3, COL.brown));
    cont.add(this.add.text(0, 0, '🐱', { fontSize:'29px' }).setOrigin(0.5));
    const w = this.workers[0];
    cont.list[1].setText(w.emoji);
    this.tutEmployee = { cont, x, y, worker: w };
    this.setStepHint('Hi! I’m your helper ' + w.emoji + '\nTap anywhere to start');
  }

  // First tap dismisses the greeting and brings in customer #1.
  beginTutorial() {
    this.setStepHint('');
    this.setPhase('d-build');
    this.trySpawn();   // customer #1
  }

  startSpawnLoop() {
    if (this.spawnStarted) return;
    this.spawnStarted = true;
    this.time.addEvent({ delay: SPAWN_MS, loop: true, callback: this.trySpawn, callbackScope: this });
    this.time.delayedCall(SPAWN_MS, this.trySpawn, [], this);
  }

  // Phase A: the free employee walks to the new dumpling station, mans it, opens the shop.
  walkEmployeeToStation(st) {
    const emp = this.tutEmployee; this.tutEmployee = null;
    this.firstStation = st;
    this.setStepHint('');
    const openShop = () => {
      if (emp) emp.cont.destroy();
      const empty = this.firstEmptySlot(st);
      if (emp && emp.worker && empty) this.assignToSlot(emp.worker, st, empty);
      this.setPhase('d-run');   // dumpling rush (#2-3) begins; patience now ticks
      this.startSpawnLoop();
    };
    if (emp) this.tweens.add({ targets: emp.cont, x: st.x, y: st.y + 30, duration: 550, ease:'Sine.InOut', onComplete: openShop });
    else openShop();
  }

  // Phase C: the 6th customer (boba) has arrived; ask the player to build the boba stall.
  startBobaBuildStep() {
    this.setStepHint('A 🧋 order — your 🥟 helper can’t make that.\nTap the 🧋 slot to build it.');
  }

  // Phase D: boba stall built but empty; you only have one helper — move them over.
  startBobaMoveStep(st) {
    this.bobaStation = st;
    this.setPhase('b-move');
    this.setStepHint('You only have one helper!\nTap the 🧋 stall and move them over.');
  }

  // Phase E: boba helper assigned — free play; now save toward hiring a 2nd helper.
  finishBobaStep() {
    this.setPhase('h-earn');
    this.setStepHint('');
  }

  // Triggered when the player first saves up enough to hire: nudge them to do it.
  maybeAdviseHire() {
    if (this.tutPhase !== 'h-earn' || this.coins < COST.pet) return;
    this.setPhase('h-hire');
    this.setStepHint('You’ve saved ' + COST.pet + ' 💰! One helper can’t run both stalls —\ntap Hire 🐾 to bring on a second.');
  }

  // ---------------- Room ----------------
  drawRoom() {
    const g = this.add.graphics().setDepth(0);
    const t = 38;
    for (let yy = 96; yy < H; yy += t)
      for (let xx = 0; xx < W; xx += t) {
        const alt = (Math.floor(xx/t) + Math.floor(yy/t)) % 2 === 0;
        g.fillStyle(alt ? COL.floor : COL.floorAlt, 1).fillRect(xx, yy, t, t);
      }
    g.fillStyle(COL.wall, 1);
    g.fillRect(0, 96, W, 10);
    g.fillRect(0, 96, 10, H-96);
    g.fillRect(W-10, 96, 10, H-96);
    g.fillRect(0, H-10, W, 10);
    g.fillStyle(COL.floor, 1).fillRect(DOOR.x-38, H-10, 76, 10);     // doorway
    g.fillStyle(COL.tan, 0.55).fillRoundedRect(DOOR.x-40, H-54, 80, 42, 8); // mat
    g.fillStyle(COL.counter, 1).fillRoundedRect(24, 300, W-48, 26, 8); // counter band

    // each empty slot shows a tappable "Build <recipe> <cost>" pad
    this.slots.forEach(s => this.makeBuildPad(s));
    this.add.text(W/2, 590, 'waiting area', { fontFamily:'system-ui,sans-serif', fontSize:'12px', color:hex(COL.dim) }).setOrigin(0.5);

    // little tables under each waiting spot; faint ones are not open yet
    this.tableMarks = this.waitSpots.map(() => this.add.graphics().setDepth(1));
    this.refreshTables();
  }

  // Draw active tables solid and unopened ones as faint outlines.
  refreshTables() {
    this.waitSpots.forEach((s, i) => {
      const g = this.tableMarks[i];
      const open = i < this.tableCount;
      const tx = s.x - 22, ty = s.y + 26, tw = 44, th = 24;
      g.clear();
      if (open) {
        g.fillStyle(COL.tan, 1).fillRoundedRect(tx, ty, tw, th, 7);
        g.lineStyle(2, COL.brown, 1).strokeRoundedRect(tx, ty, tw, th, 7);
      } else {
        g.lineStyle(2, COL.dim, 0.45).strokeRoundedRect(tx, ty, tw, th, 7);
      }
    });
  }

  // ---------------- Pantry (shared ingredients) ----------------
  // Each ingredient is shown as a tappable chip directly above the station that uses it.
  buildPantry() {
    this.pantryChips = {};
    ['dough','tea','broth'].forEach(ing => {
      const cont = this.add.container(0, PANTRY_Y).setDepth(51).setVisible(false);
      const box  = this.add.rectangle(0, 0, 78, 32, COL.card).setStrokeStyle(2, COL.dim);
      const txt  = this.add.text(0, -5, '', { fontFamily:'system-ui,sans-serif', fontSize:'15px', color:hex(COL.brown), fontStyle:'700' }).setOrigin(0.5);
      const cap  = this.add.text(0, 10, '', { fontFamily:'system-ui,sans-serif', fontSize:'9px', color:hex(COL.dim), fontStyle:'700' }).setOrigin(0.5);
      cont.add([box, txt, cap]);
      this.pantryChips[ing] = { ing, cont, box, txt, cap, x:0, y:PANTRY_Y, halfW:39, halfH:16 };
    });
    this.pantryActive = [];
    this.refreshPantry();
  }

  // Ingredients worth showing: those a built stall actually uses.
  activePantry() {
    const set = new Set(this.stations.map(st => RECIPE_ING[st.type]));
    return ['dough','tea','broth'].filter(k => set.has(k));
  }

  refreshPantry() {
    if (!this.pantryChips) return;
    Object.values(this.pantryChips).forEach(ch => ch.cont.setVisible(false));
    this.pantryActive = [];
    this.activePantry().forEach(ing => {
      const st = this.stations.find(s => RECIPE_ING[s.type] === ing);
      if (!st) return;
      const ch = this.pantryChips[ing];
      ch.cont.setVisible(true).setPosition(st.x, PANTRY_Y);
      ch.x = st.x; ch.y = PANTRY_Y;
      const stock = this.pantry[ing];
      let col = COL.brown; if (stock === 0) col = COL.red; else if (stock <= 2) col = COL.amber;
      ch.txt.setText(INGREDIENTS[ing].emoji + ' ' + stock).setColor(hex(col));
      ch.cap.setText('↺ ' + RESTOCK_COST + '💰');
      ch.box.setStrokeStyle(2, stock === 0 ? COL.red : COL.dim);
      this.pantryActive.push(ch);
    });
  }

  // Tapping a chip opens a confirmation before the big spend.
  openRestockConfirm(ing) {
    this.closePicker(); this.closeMenu(); this.closeConfirm();
    if (this.coins < RESTOCK_COST) { this.flashHint('Need ' + RESTOCK_COST + ' 💰 to restock'); return; }
    const ig = INGREDIENTS[ing];
    const cx = W/2, panelW = 286, panelH = 170, top = 340;
    const cont = this.add.container(0, 0).setDepth(95);
    cont.add(this.add.rectangle(W/2, H/2, W, H, 0x2A211B, 0.55));   // backdrop
    const panel = this.add.graphics();
    panel.fillStyle(COL.card, 1).fillRoundedRect(cx-panelW/2, top, panelW, panelH, 16);
    panel.lineStyle(3, COL.brown, 1).strokeRoundedRect(cx-panelW/2, top, panelW, panelH, 16);
    cont.add(panel);
    cont.add(this.add.text(cx, top+30, 'Restock ' + ig.emoji + ' ' + ig.label + '?',
      { fontFamily:'system-ui,sans-serif', fontSize:'17px', color:hex(COL.brown), fontStyle:'700' }).setOrigin(0.5));
    cont.add(this.add.text(cx, top+64, 'Buy ' + RESTOCK_AMOUNT + ' ' + ig.emoji + ' for ' + RESTOCK_COST + ' 💰',
      { fontFamily:'system-ui,sans-serif', fontSize:'15px', color:hex(COL.brown) }).setOrigin(0.5));
    cont.add(this.add.text(cx, top+88, 'Balance ' + this.coins + ' 💰  →  ' + (this.coins - RESTOCK_COST) + ' 💰',
      { fontFamily:'system-ui,sans-serif', fontSize:'12px', color:hex(COL.dim), fontStyle:'700' }).setOrigin(0.5));

    const by = top + panelH - 36, bw = 120, bh = 42, gap = 14;
    const buyX = cx - bw/2 - gap/2, cancelX = cx + bw/2 + gap/2;
    cont.add(this.add.rectangle(buyX, by, bw, bh, COL.btn).setStrokeStyle(2, COL.brown));
    cont.add(this.add.text(buyX, by, 'Buy  ' + RESTOCK_COST + ' 💰',
      { fontFamily:'system-ui,sans-serif', fontSize:'15px', color:'#FFFFFF', fontStyle:'700' }).setOrigin(0.5));
    cont.add(this.add.rectangle(cancelX, by, bw, bh, COL.btnOff).setStrokeStyle(2, COL.brown));
    cont.add(this.add.text(cancelX, by, 'Cancel',
      { fontFamily:'system-ui,sans-serif', fontSize:'15px', color:hex(COL.brown), fontStyle:'700' }).setOrigin(0.5));
    this.confirm = { ing, cont, by, bh, buyX, cancelX, bw };
  }

  confirmTap(px, py) {
    const c = this.confirm;
    const onBtn = (bx) => Math.abs(px - bx) <= c.bw/2 && Math.abs(py - c.by) <= c.bh/2;
    if (onBtn(c.buyX))    { const ing = c.ing; this.closeConfirm(); this.doRestock(ing); return; }
    this.closeConfirm();   // Cancel button or tap outside
  }

  closeConfirm() {
    if (!this.confirm) return;
    this.confirm.cont.destroy();
    this.confirm = null;
  }

  doRestock(ing) {
    if (this.coins < RESTOCK_COST) { this.flashHint('Need ' + RESTOCK_COST + ' 💰 to restock'); return; }
    this.coins -= RESTOCK_COST;
    this.pantry[ing] += RESTOCK_AMOUNT;
    this.refreshHud(); this.refreshPantry(); this.refreshToolbar();
    this.flashHint('Restocked ' + INGREDIENTS[ing].emoji + ' +' + RESTOCK_AMOUNT);
  }

  // ---------------- Build pads (per-slot) ----------------
  makeBuildPad(slot) {
    const type = slot.type, accent = ACCENT[type];
    const cont = this.add.container(slot.x, slot.y).setDepth(2);
    const bg = this.add.graphics();
    bg.fillStyle(accent, 0.10).fillRoundedRect(-50, -62, 100, 132, 14);
    bg.lineStyle(2, accent, 0.7).strokeRoundedRect(-50, -62, 100, 132, 14);
    cont.add(bg);
    cont.add(this.add.text(0, -30, ORDERS[type].emoji, { fontSize:'34px' }).setOrigin(0.5).setAlpha(0.9));
    cont.add(this.add.text(0, 12, 'Build', { fontFamily:'system-ui,sans-serif', fontSize:'14px', color:hex(accent), fontStyle:'700' }).setOrigin(0.5));
    const costTxt = this.add.text(0, 36, '', { fontFamily:'system-ui,sans-serif', fontSize:'14px', color:hex(COL.brown), fontStyle:'700' }).setOrigin(0.5);
    cont.add(costTxt);
    const lock = this.add.text(36, -46, '🔒', { fontSize:'16px' }).setOrigin(0.5).setVisible(false);
    cont.add(lock);
    slot.pad = { cont, costTxt, lock, type };
  }

  refreshBuildPads() {
    if (!this.slots) return;
    this.slots.forEach(s => {
      const pad = s.pad; if (!pad) return;
      if (s.station) { pad.cont.setVisible(false); return; }
      if (this.isLocked(pad.type)) {   // reserved for a future update: shown, dimmed, locked
        pad.cont.setVisible(true).setAlpha(0.4);
        pad.costTxt.setText('Coming soon').setColor(hex(COL.dim));
        pad.lock.setVisible(true);
        return;
      }
      const affordable = this.coins >= COST[pad.type];
      const active = this.canBuildPhase(pad.type);
      pad.cont.setVisible(true).setAlpha(active ? 1 : 0.35);
      pad.costTxt.setText(COST[pad.type] + ' 💰').setColor(affordable ? hex(COL.brown) : hex(COL.red));
      pad.lock.setVisible(!active);
    });
  }

  // ---------------- HUD + toolbar ----------------
  buildHud() {
    this.add.rectangle(W/2, 24, W, 48, COL.brown).setDepth(50);
    this.coinLabel = this.add.text(12, 24, '', { fontFamily:'system-ui,sans-serif', fontSize:'21px', color:'#FAF4EA', fontStyle:'700' }).setOrigin(0,0.5).setDepth(51);
    this.statLabel = this.add.text(W-12, 24, '', { fontFamily:'system-ui,sans-serif', fontSize:'13px', color:'#FAF4EA' }).setOrigin(1,0.5).setDepth(51);

    // Hint shown as a floating pill in the open floor, where it's easy to read on mobile.
    this.hintBg = this.add.graphics().setDepth(59);
    this.hint = this.add.text(W/2, 405, '', {
      fontFamily:'system-ui,sans-serif', fontSize:'16px', color:hex(COL.brown), fontStyle:'700',
      align:'center', wordWrap:{ width: 300 }
    }).setOrigin(0.5).setDepth(60);
    this.refreshHud();
  }

  buildToolbar() {
    this.add.rectangle(W/2, 72, W, 48, COL.cream).setDepth(50);
    // Stations are built on their slots; the toolbar hires helpers and adds tables.
    this.buttons = [
      { id:'table', x:102, y:72, w:178, h:38 },
      { id:'pet',   x:288, y:72, w:178, h:38 },
    ];
    this.buttons.forEach(b => {
      b.rect = this.add.rectangle(b.x, b.y, b.w, b.h, COL.btn).setStrokeStyle(2, COL.brown).setDepth(51);
      b.txt  = this.add.text(b.x, b.y, '', { fontFamily:'system-ui,sans-serif', fontSize:'15px', color:'#FFFFFF', fontStyle:'700' }).setOrigin(0.5).setDepth(52);
    });
    this.refreshToolbar();
  }

  refreshHud() {
    this.coinLabel.setText('💰 ' + this.coins + (this.broke ? '  ⚠️' : ''));
    const wage = this.workers.length * WAGE_PER_SEC;
    const wageStr = (this.tutPhase === 'done' && this.workers.length > 0)
      ? '  💸-' + (Number.isInteger(wage) ? wage : wage.toFixed(1)) + '/s' : '';
    this.statLabel.setText('Served ' + this.served + '  Lost ' + this.lost +
      '  🐾' + this.workers.length + ' 🪑' + this.tableCount + '/' + MAX_TABLES + wageStr);
    this.refreshBuildPads();
  }

  canHireNow() { return this.tutPhase === 'h-hire' || this.tutPhase === 'done'; }
  canManageStaff() { return this.inFreePlay() || this.tutPhase === 'b-move'; }

  refreshToolbar() {
    if (!this.buttons) return;
    this.buttons.forEach(b => {
      let label, usable;
      if (b.id === 'pet') {
        label = 'Hire 🐾 ' + COST.pet + ' 💰';
        usable = this.canHireNow() && this.coins >= COST.pet;
      } else { // table — unlocks only once the tutorial is fully done
        if (this.tableCount >= MAX_TABLES) { label = '🪑 Tables full'; usable = false; }
        else { label = 'Add 🪑 ' + TABLE_COST + ' 💰'; usable = this.tutPhase === 'done' && this.coins >= TABLE_COST; }
      }
      b.txt.setText(label);
      b.rect.setFillStyle(usable ? COL.btn : COL.btnOff);
    });
  }

  setHint(msg) {
    this.hint.setText(msg || '');
    this.hintBg.clear();
    if (msg) {
      const w = this.hint.width + 26, h = this.hint.height + 16;
      this.hintBg.fillStyle(COL.card, 0.94).fillRoundedRect(W/2-w/2, 405-h/2, w, h, 12);
      this.hintBg.lineStyle(2, COL.dim, 1).strokeRoundedRect(W/2-w/2, 405-h/2, w, h, 12);
    }
  }

  // ---------------- Input ----------------
  inBox(px, py, o, halfW, halfH) {
    return px >= o.x-halfW && px <= o.x+halfW && py >= o.y-halfH && py <= o.y+halfH;
  }

  handleTap(px, py) {
    // an open overlay (confirm dialog, worker picker, or station menu) swallows all taps
    if (this.confirm) { this.confirmTap(px, py); return; }
    if (this.picker)  { this.pickerTap(px, py); return; }
    if (this.menu)    { this.menuTap(px, py); return; }
    // intro greeting: any tap continues
    if (this.tutPhase === 'intro') { this.beginTutorial(); return; }
    // toolbar (hire) button
    for (const b of this.buttons) {
      if (this.inBox(px, py, b, b.w/2, b.h/2)) { this.onButton(b); return; }
    }
    // pantry chips: tap to restock that ingredient
    for (const ch of this.pantryActive) {
      if (this.inBox(px, py, ch, ch.halfW, ch.halfH)) { this.openRestockConfirm(ch.ing); return; }
    }
    // a station slot: empty -> build its locked-in stall; built -> manage workers / menu
    for (const s of this.slots) {
      if (!this.inBox(px, py, s, 50, 70)) continue;
      if (!s.station) { this.tryBuildSlot(this.slots.indexOf(s)); return; }
      const st = s.station;
      // tap a worker slot dot -> staff/swap that slot
      if (this.canManageStaff()) {
        for (const sl of this.activeSlots(st)) {
          if (Math.abs(px - sl.sx) <= 17 && Math.abs(py - sl.sy) <= 17) { this.openWorkerPicker(st, sl); return; }
        }
      }
      // tutorial 'move them over' step: any boba-stall tap assigns the helper
      if (this.tutPhase === 'b-move') { const e = this.firstEmptySlot(st); if (e) { this.openWorkerPicker(st, e); return; } }
      // tap the stall body (upper area) -> Station Menu (upgrades + stats), in free play
      if (this.inFreePlay() && py <= st.y) { this.openStationMenu(st); return; }
      return;
    }
  }

  onButton(b) {
    if (b.id === 'table') {
      if (this.tutPhase !== 'done') { const m = this.tutHint(); if (m) this.flashHint(m); return; }
      this.tryAddTable(); return;
    }
    // hire
    if (!this.canHireNow()) { const m = this.tutHint(); if (m) this.flashHint(m); return; }
    this.hirePet();
  }

  tryAddTable() {
    if (this.tableCount >= MAX_TABLES) { this.flashHint('All ' + MAX_TABLES + ' tables open'); return; }
    if (this.coins < TABLE_COST)       { this.flashHint('Need ' + TABLE_COST + ' 💰'); return; }
    this.coins -= TABLE_COST;
    this.tableCount += 1;
    this.refreshTables();
    this.refreshHud(); this.refreshToolbar();
    this.flashHint('Table opened — ' + this.tableCount + '/' + MAX_TABLES);
  }

  // ---------------- Building / staffing ----------------
  tryBuildSlot(i) {
    const slot = this.slots[i], type = slot.type;
    if (this.isLocked(type)) { this.flashHint(ORDERS[type].emoji + ' coming in a future update!'); return; }
    if (!this.canBuildPhase(type)) {
      this.flashHint(this.tutHint() || 'Locked for now'); return;
    }
    if (this.coins < COST[type]) { this.flashHint('Need ' + COST[type] + ' 💰'); return; }
    this.coins -= COST[type];
    const st = this.placeStation(i, type);
    this.setStepHint('');
    if (this.tutPhase === 'd-build')      this.walkEmployeeToStation(st); // employee mans it, shop opens
    else if (this.tutPhase === 'b-build') this.startBobaMoveStep(st);     // built, now prompt to move helper
    // in normal play a new stall starts empty — tap it to assign a worker
    this.refreshHud(); this.refreshToolbar();
  }

  placeStation(slotIndex, type) {
    const slot = this.slots[slotIndex];
    const accent = ACCENT[type];
    const cont = this.add.container(slot.x, slot.y).setDepth(10);

    // --- Stall: a labeled sign showing the product it makes ---
    cont.add(this.add.rectangle(0, -34, 96, 60, COL.card).setStrokeStyle(3, accent));
    cont.add(this.add.rectangle(0, -58, 96, 14, accent));                 // sign strip
    cont.add(this.add.text(0, -34, ORDERS[type].emoji, { fontSize:'34px' }).setOrigin(0.5));

    // --- Menu button (gear) at the top-right corner: opens upgrades + stats ---
    cont.add(this.add.circle(40, -58, 11, COL.card).setStrokeStyle(2, accent));
    cont.add(this.add.text(40, -58, '⚙', { fontSize:'13px' }).setOrigin(0.5));

    // --- Status line summarizing the whole station ---
    const status = this.add.text(0, 58, '', { fontFamily:'system-ui,sans-serif', fontSize:'11px', color:hex(accent), fontStyle:'700' }).setOrigin(0.5);
    cont.add(status);

    const st = { type, slotIndex, x:slot.x, y:slot.y, accent, cont, status,
                 slots: [], up:{ cap:1, speed:0, price:0, eff:0 }, stats:{ served:0, revenue:0 } };

    // --- Worker slots: created up to MAX_SLOTS, shown up to current capacity ---
    for (let k = 0; k < MAX_SLOTS; k++) {
      const sc   = this.add.container(0, 0);
      const dot  = this.add.circle(0, 0, 13, COL.btnOff).setStrokeStyle(2, accent);
      const face = this.add.text(0, 0, '', { fontSize:'15px' }).setOrigin(0.5);
      const bub  = this.add.text(14, -9, '', { fontSize:'11px' }).setOrigin(0.5);  // dish being made
      const bar  = this.add.graphics();
      sc.add([dot, face, bub, bar]);
      cont.add(sc);
      st.slots.push({ idx:k, cont:sc, dot, face, bubble:bub, bar, accent, pet:null, busy:false, customer:null, workTween:null, sx:0, sy:0 });
    }

    slot.station = st;
    this.stations.push(st);
    if (slot.pad) slot.pad.cont.setVisible(false);
    this.layoutSlots(st);
    this.refreshStationStatus(st);
    this.refreshPantry();    // this stall's ingredient now matters
    return st;
  }

  // --- Station helpers ---
  activeSlots(st)    { return st.slots.slice(0, st.up.cap); }
  firstEmptySlot(st) { return this.activeSlots(st).find(sl => !sl.pet) || null; }
  cookMsFor(st)      { return ORDERS[st.type].cookMs * Math.pow(0.82, st.up.speed); }
  valueFor(st)       { return ORDERS[st.type].value + 3 * st.up.price; }
  effFree(st)        { return Math.random() < 0.2 * st.up.eff; }   // chance a dish uses no ingredient
  stationName(type)  { return { dumpling:'Dumpling', boba:'Boba', noodle:'Noodle' }[type] || type; }

  upgradeLevel(st, key) { return key === 'cap' ? st.up.cap - 1 : st.up[key]; }
  upgradeMaxed(st, key) { return key === 'cap' ? st.up.cap >= MAX_SLOTS : st.up[key] >= UPGRADE_MAX; }
  upgradeCost(st, key)  { return Math.round(UPGRADES[key].base * Math.pow(UPGRADE_GROW, this.upgradeLevel(st, key))); }

  // Position the active worker slots in a row beneath the stall; hide the rest.
  layoutSlots(st) {
    const xs = ({ 1:[0], 2:[-20, 20], 3:[-31, 0, 31] })[st.up.cap] || [0];
    st.slots.forEach((sl, i) => {
      const active = i < st.up.cap;
      sl.cont.setVisible(active);
      if (active) {
        const lx = xs[i], ly = 26;
        sl.cont.setPosition(lx, ly);
        sl.sx = st.x + lx; sl.sy = st.y + ly;
      }
    });
  }

  refreshSlot(slot) {
    if (slot.pet) { slot.dot.setFillStyle(COL.tan);   slot.face.setText(slot.pet.emoji); }
    else          { slot.dot.setFillStyle(COL.btnOff); slot.face.setText(''); slot.bubble.setText(''); }
  }

  drawSlotBar(slot, p) {
    const bw = 26, bh = 4, bx = -bw/2, by = 15;
    slot.bar.clear();
    if (p > 0) {
      slot.bar.fillStyle(COL.cream, 1).fillRoundedRect(bx, by, bw, bh, 2);
      slot.bar.fillStyle(slot.accent, 1).fillRoundedRect(bx, by, bw*Phaser.Math.Clamp(p,0,1), bh, 2);
    }
  }

  // One-line summary of the station's state shown under the slots.
  refreshStationStatus(st) {
    const slots = this.activeSlots(st);
    const staffed = slots.filter(s => s.pet).length;
    const cooking = slots.filter(s => s.busy).length;
    const ing = RECIPE_ING[st.type];
    let msg = 'Ready', col = st.accent;
    if (staffed === 0)                                     { msg = 'needs 🐾'; col = COL.dim; }
    else if (cooking > 0)                                  { msg = cooking + (cooking > 1 ? ' cooking' : ' cooking'); }
    else if (this.broke)                                   { msg = 'unpaid 💢'; col = COL.red; }
    else if ((this.pantry[ing] || 0) <= 0)                 { msg = 'out ' + INGREDIENTS[ing].emoji; col = COL.red; }
    st.status.setText(msg).setColor(hex(col));
  }

  hirePet() {
    if (this.coins < COST.pet) { this.flashHint('Need ' + COST.pet + ' 💰'); return; }
    this.coins -= COST.pet;
    const w = this.addWorker();                        // joins the idle pool
    let msg = 'Hired ' + w.emoji + '! Tap a stall to place them';
    if (this.tutPhase === 'h-hire') {                  // tutorial complete — cushion before wages start
      this.setPhase('done'); this.setStepHint('');
      this.coins += GRAND_OPENING_BONUS;
      msg = 'Hired ' + w.emoji + '!  +' + GRAND_OPENING_BONUS + ' 💰 grand-opening bonus.\nPlace them on a stall — note: staff now draw a wage.';
    }
    this.refreshHud(); this.refreshToolbar();
    this.flashHint(msg, this.tutPhase === 'done' ? 4200 : 1300);
  }

  // ---------------- Worker picker (one station slot at a time) ----------------
  openWorkerPicker(station, slot) {
    this.closePicker(); this.closeMenu();
    const cur = slot.pet;
    const idle      = this.freeWorkers();
    const elsewhere = this.workers.filter(w => w !== cur && w.slot && w.slot !== slot);
    const opts = [
      ...idle.map(w => ({ w, label: 'idle helper' })),
      ...elsewhere.map(w => ({ w, label: 'move from ' + ORDERS[w.station.type].emoji })),
    ];
    if (cur) opts.push({ clear: true, label: '⛔ Clear slot (' + cur.emoji + ' → idle)' });
    if (idle.length > 0 && this.tutPhase === 'done') opts.push({ dismiss: true, label: '👋 Send an idle helper home' });
    if (opts.length === 0) {
      this.flashHint('No helpers yet — hire one (🐾 ' + COST.pet + ' 💰)');
      return;
    }
    const rowH = 46, headH = 44, padB = 14, panelW = 300, halfW = (panelW - 24) / 2;
    const panelH = headH + opts.length * rowH + padB;
    const cx = W / 2, top = Phaser.Math.Clamp(430 - panelH / 2, 110, H - panelH - 20);

    const cont = this.add.container(0, 0).setDepth(90);
    cont.add(this.add.rectangle(W/2, H/2, W, H, 0x2A211B, 0.5));               // backdrop
    const panel = this.add.graphics();
    panel.fillStyle(COL.card, 1).fillRoundedRect(cx - panelW/2, top, panelW, panelH, 16);
    panel.lineStyle(3, station.accent, 1).strokeRoundedRect(cx - panelW/2, top, panelW, panelH, 16);
    cont.add(panel);
    cont.add(this.add.text(cx, top + headH/2 + 2, 'Staff this ' + ORDERS[station.type].emoji + ' slot',
      { fontFamily:'system-ui,sans-serif', fontSize:'15px', color:hex(COL.brown), fontStyle:'700' }).setOrigin(0.5));

    const rows = [];
    opts.forEach((o, i) => {
      const ry = top + headH + rowH*i + rowH/2;
      const action = o.dismiss || o.clear;
      cont.add(this.add.rectangle(cx, ry, panelW - 24, rowH - 8, action ? COL.tan : COL.cream).setStrokeStyle(2, COL.dim));
      cont.add(this.add.text(cx - halfW + 12, ry, action ? o.label : (o.w.emoji + '   ' + o.label),
        { fontFamily:'system-ui,sans-serif', fontSize:'15px', color:hex(COL.brown), fontStyle:'700' }).setOrigin(0, 0.5));
      rows.push({ opt: o, ry, halfH: (rowH - 8) / 2 });
    });
    this.picker = { cont, station, slot, rows, cx, halfW };
  }

  pickerTap(px, py) {
    const pk = this.picker;
    for (const r of pk.rows) {
      if (Math.abs(px - pk.cx) <= pk.halfW && Math.abs(py - r.ry) <= r.halfH) {
        if (r.opt.clear)        { this.closePicker(); this.clearSlot(pk.slot); }
        else if (r.opt.dismiss) { this.closePicker(); this.dismissIdleWorker(); }
        else                    this.chooseWorker(pk.station, pk.slot, r.opt.w);
        return;
      }
    }
    this.closePicker();   // tapped the backdrop / outside the rows
  }

  chooseWorker(station, slot, w) {
    this.assignToSlot(w, station, slot);
    this.closePicker();
    if (this.tutPhase === 'b-move' && this.bobaStation && this.activeSlots(this.bobaStation).some(s => s.pet)) this.finishBobaStep();
  }

  dismissIdleWorker() {
    const w = this.freeWorkers()[0];
    if (!w) { this.flashHint('No idle helper to send home'); return; }
    this.workers = this.workers.filter(x => x !== w);
    this.refreshHud(); this.refreshToolbar();
    this.flashHint('Sent ' + w.emoji + ' home — payroll is lighter');
  }

  closePicker() {
    if (!this.picker) return;
    this.picker.cont.destroy();
    this.picker = null;
  }

  // ---------------- Station Menu (upgrades + stats) ----------------
  openStationMenu(st) {
    this.closePicker(); this.closeMenu();
    const keys = ['cap', 'speed', 'price', 'eff'];
    const headH = 60, rowH = 50, padB = 16, panelW = 320, halfW = (panelW - 24) / 2;
    const panelH = headH + keys.length*rowH + padB + 18;
    const cx = W / 2, top = Phaser.Math.Clamp(420 - panelH / 2, 100, H - panelH - 20);

    const cont = this.add.container(0, 0).setDepth(90);
    cont.add(this.add.rectangle(W/2, H/2, W, H, 0x2A211B, 0.5));
    const panel = this.add.graphics();
    panel.fillStyle(COL.card, 1).fillRoundedRect(cx - panelW/2, top, panelW, panelH, 16);
    panel.lineStyle(3, st.accent, 1).strokeRoundedRect(cx - panelW/2, top, panelW, panelH, 16);
    cont.add(panel);
    cont.add(this.add.text(cx, top + 20, ORDERS[st.type].emoji + '  ' + this.stationName(st.type) + ' Stall',
      { fontFamily:'system-ui,sans-serif', fontSize:'16px', color:hex(COL.brown), fontStyle:'700' }).setOrigin(0.5));
    cont.add(this.add.text(cx, top + 42, 'Served ' + st.stats.served + '   ·   Earned ' + st.stats.revenue + ' 💰',
      { fontFamily:'system-ui,sans-serif', fontSize:'12px', color:hex(COL.dim), fontStyle:'700' }).setOrigin(0.5));

    const rows = [];
    keys.forEach((key, i) => {
      const u = UPGRADES[key];
      const ry = top + headH + rowH*i + rowH/2;
      const maxed = this.upgradeMaxed(st, key);
      const cost  = this.upgradeCost(st, key);
      const lvl   = (key === 'cap') ? st.up.cap : st.up[key];
      const cap   = (key === 'cap') ? MAX_SLOTS : UPGRADE_MAX;
      const afford = !maxed && this.coins >= cost && this.inFreePlay();
      const bg = maxed ? COL.cream : (afford ? COL.btn : COL.btnOff);
      cont.add(this.add.rectangle(cx, ry, panelW - 24, rowH - 8, bg).setStrokeStyle(2, COL.dim));
      const labelCol = afford ? '#FFFFFF' : hex(COL.brown);
      cont.add(this.add.text(cx - halfW + 12, ry - 9, u.emoji + ' ' + u.label + '  (Lv ' + lvl + '/' + cap + ')',
        { fontFamily:'system-ui,sans-serif', fontSize:'14px', color:labelCol, fontStyle:'700' }).setOrigin(0, 0.5));
      cont.add(this.add.text(cx - halfW + 12, ry + 10, u.effect,
        { fontFamily:'system-ui,sans-serif', fontSize:'10px', color: afford ? '#F3E7D3' : hex(COL.dim) }).setOrigin(0, 0.5));
      cont.add(this.add.text(cx + halfW - 12, ry, maxed ? 'MAX' : (cost + ' 💰'),
        { fontFamily:'system-ui,sans-serif', fontSize:'13px', color:labelCol, fontStyle:'700' }).setOrigin(1, 0.5));
      rows.push({ key, ry, halfH: (rowH - 8) / 2 });
    });
    cont.add(this.add.text(cx, top + panelH - 12, 'tap outside to close',
      { fontFamily:'system-ui,sans-serif', fontSize:'10px', color:hex(COL.dim) }).setOrigin(0.5));
    this.menu = { st, cont, rows, cx, halfW };
  }

  menuTap(px, py) {
    const m = this.menu;
    for (const r of m.rows) {
      if (Math.abs(px - m.cx) <= m.halfW && Math.abs(py - r.ry) <= r.halfH) { this.buyUpgrade(m.st, r.key); return; }
    }
    this.closeMenu();
  }

  buyUpgrade(st, key) {
    if (this.upgradeMaxed(st, key)) { this.flashHint(UPGRADES[key].label + ' is maxed'); return; }
    if (!this.inFreePlay()) return;
    const cost = this.upgradeCost(st, key);
    if (this.coins < cost) { this.flashHint('Need ' + cost + ' 💰'); return; }
    this.coins -= cost;
    if (key === 'cap') { st.up.cap += 1; this.layoutSlots(st); } else { st.up[key] += 1; }
    this.refreshHud(); this.refreshToolbar();
    this.closeMenu(); this.openStationMenu(st);   // reopen to show new levels/costs
    this.flashHint(UPGRADES[key].emoji + ' ' + UPGRADES[key].label + ' upgraded!');
  }

  closeMenu() {
    if (!this.menu) return;
    this.menu.cont.destroy();
    this.menu = null;
  }

  // ---------------- Customers (automatic) ----------------
  trySpawn() {
    // Hold new arrivals while the player is mid build/hire step.
    if (this.tutPhase === 'b-build' || this.tutPhase === 'b-move') return;
    const spot = this.waitSpots.slice(0, this.tableCount).find(s => !s.taken);
    if (!spot) return; // every open table is taken — they don't come in

    this.spawnCount += 1;
    const type = this.scriptedType(this.spawnCount) || Phaser.Utils.Array.GetRandom(ORDERABLE_TYPES);
    // The 4th customer (first boba) kicks off the boba tutorial step.
    const triggerBoba = (this.tutPhase === 'd-run' && this.spawnCount === 4);
    if (triggerBoba) this.setPhase('b-build');   // pause further arrivals immediately

    const cont = this.add.container(DOOR.x, DOOR.y).setDepth(20);
    cont.add(this.add.circle(0, 0, 27, COL.card).setStrokeStyle(3, COL.dim));
    cont.add(this.add.text(0, 0, '🙂', { fontSize:'27px' }).setOrigin(0.5));
    cont.add(this.add.circle(0, -46, 20, COL.cream).setStrokeStyle(2, COL.dim));
    const bubble = this.add.text(0, -46, '…', { fontSize:'23px' }).setOrigin(0.5);
    cont.add(bubble);
    const patBar = this.add.graphics(); cont.add(patBar);

    const cu = { type, state:'entering', patience:PATIENCE_MS, claimed:false, spot, cont, bubble, patBar };
    spot.taken = cu;
    this.customers.push(cu);

    this.tweens.add({
      targets: cont, x: spot.x, y: spot.y, duration: WALK_MS, ease:'Sine.InOut',
      onComplete: () => {
        if (cu.state !== 'entering') return;
        cu.state = 'waiting';
        cu.bubble.setText(ORDERS[type].emoji);
        this.drawPatience(cu);
        if (this.tutPhase === 'd-build' && this.tutEmployee) {
          this.setStepHint('A customer! I need a stall to cook.\nTap the 🥟 slot to build it.');
        } else if (triggerBoba) {
          this.startBobaBuildStep();
        }
      }
    });
  }

  drawPatience(cu) {
    const bw = 50, bh = 8, bx = -bw/2, by = -74;
    const p = cu.patience / PATIENCE_MS;
    let c = COL.green; if (p < 0.5) c = COL.tan; if (p < 0.25) c = COL.red;
    cu.patBar.clear();
    cu.patBar.fillStyle(COL.cream, 1).fillRoundedRect(bx, by, bw, bh, 3);
    cu.patBar.fillStyle(c, 1).fillRoundedRect(bx, by, bw*Phaser.Math.Clamp(p,0,1), bh, 3);
  }

  removeCustomer(cu) {
    const i = this.customers.indexOf(cu);
    if (i >= 0) this.customers.splice(i, 1);
    if (cu.spot) cu.spot.taken = null;
  }

  leaveCustomer(cu, happy) {
    cu.state = 'leaving';
    cu.patBar.clear();
    this.removeCustomer(cu);
    this.tweens.add({
      targets: cu.cont, x: DOOR.x, y: DOOR.y + 40, alpha: 0, duration: 900, ease:'Sine.In',
      onComplete: () => cu.cont.destroy()
    });
  }

  // ---------------- Automatic order filling (per worker slot) ----------------
  claimAndCook(st, sl, cu) {
    const ing = RECIPE_ING[st.type];
    if (this.pantry[ing] > 0 && !this.effFree(st)) {   // efficiency may skip consumption; grace cooks the last 0 free
      this.pantry[ing] -= 1;
      this.refreshPantry();
      if (this.pantry[ing] === 0 && !this.lowSeen[ing] && this.tutPhase === 'done') {
        this.lowSeen[ing] = true;
        this.flashHint('Out of ' + INGREDIENTS[ing].emoji + '! Tap the pantry to restock.');
      }
    }
    sl.busy = true; sl.customer = cu;
    cu.claimed = true; cu.bubble.setText('⏳'); cu.patBar.clear();
    sl.bubble.setText(ORDERS[st.type].emoji);          // this worker is making this dish
    sl.workTween = this.tweens.add({ targets: sl.face, y: -3, duration: 300, yoyo:true, repeat:-1, ease:'Sine.InOut' });
    const prog = { v: 0 };
    this.tweens.add({
      targets: prog, v: 1, duration: this.cookMsFor(st), ease:'Linear',
      onUpdate: () => this.drawSlotBar(sl, prog.v),
      onComplete: () => this.serve(st, sl, cu),
    });
  }

  serve(st, sl, cu) {
    sl.busy = false; sl.customer = null;
    this.drawSlotBar(sl, 0);
    if (sl.workTween) { sl.workTween.stop(); sl.workTween = null; sl.face.y = 0; }
    sl.bubble.setText('');
    const value = this.valueFor(st);

    const alive = cu.state === 'waiting' && cu.cont.active;
    const dish = this.add.text(st.x, st.y - 8, ORDERS[st.type].emoji, { fontSize:'22px' }).setOrigin(0.5).setDepth(40);
    const tx = alive ? cu.cont.x : st.x, ty = alive ? cu.cont.y - 4 : st.y;
    const dist = Phaser.Math.Distance.Between(st.x, st.y, tx, ty);
    this.tweens.add({
      targets: dish, x: tx, y: ty, duration: 250 + dist*0.7, ease:'Quad.Out',
      onComplete: () => {
        dish.destroy();
        if (!alive) return;
        this.coins += value;
        this.served += 1;
        st.stats.served += 1; st.stats.revenue += value;
        this.floatText(cu.cont.x, cu.cont.y - 40, '+' + value + ' 💰', COL.green);
        cu.bubble.setText('💛');
        this.leaveCustomer(cu, true);
        this.refreshHud(); this.refreshToolbar();
        this.maybeAdviseHire();
      }
    });
  }

  // ---------------- feedback ----------------
  floatText(x, y, str, color) {
    const t = this.add.text(x, y, str, { fontFamily:'system-ui,sans-serif', fontSize:'20px', color:hex(color), fontStyle:'700' }).setOrigin(0.5).setDepth(45);
    this.tweens.add({ targets:t, y:y-46, alpha:0, duration:800, ease:'Quad.Out', onComplete:()=>t.destroy() });
  }

  flashHint(msg, ms = 1300) {
    this.setHint(msg);
    this.time.delayedCall(ms, () => { if (this.hint.text === msg) this.setHint(this.stepHint || ''); });
  }

  // ---------------- main loop ----------------
  update(time, delta) {
    this.payWages(delta);
    this.runStations();
    this.tickPatience(delta);
  }

  // Continuous wage drain (only once the tutorial is fully done). Coins never go
  // negative; if payroll can't be met you go "broke" and staff idle (see runStations).
  payWages(delta) {
    if (this.tutPhase !== 'done' || this.workers.length === 0) return;
    const before = this.coins;
    this.wageBucket += this.workers.length * WAGE_PER_SEC * (delta / 1000);
    while (this.wageBucket >= 1) {
      if (this.coins <= 0) { this.wageBucket = 0; break; }   // can't pay — forgive the rest, go broke
      this.coins -= 1; this.wageBucket -= 1;
    }
    if (this.coins <= 0) this.broke = true;
    else if (this.coins >= BROKE_RECOVER) this.broke = false;   // hysteresis so we don't flicker
    if (this.coins !== before) { this.refreshHud(); this.refreshToolbar(); }
  }

  // While broke, one "grace" worker slot keeps cooking (even with no stock) so you can
  // recover. Prefer a slot whose stall has a customer waiting, so income can always restart.
  graceSlot() {
    let fallback = null;
    for (const st of this.stations) {
      for (const sl of this.activeSlots(st)) {
        if (!sl.pet) continue;
        if (!fallback) fallback = sl;
        if (this.customers.some(c => c.state === 'waiting' && !c.claimed && c.type === st.type)) return sl;
      }
    }
    return fallback;
  }

  // Assign each idle staffed slot to a longest-waiting matching order, respecting
  // ingredient stock and the broke/unpaid state. Slots cook in parallel.
  runStations() {
    const grace = this.broke ? this.graceSlot() : null;
    for (const st of this.stations) {
      const ing = RECIPE_ING[st.type];
      for (const sl of this.activeSlots(st)) {
        if (!sl.pet || sl.busy) continue;
        const isGrace = (sl === grace);
        if (this.broke && !isGrace) continue;                       // unpaid → idle
        if ((this.pantry[ing] || 0) <= 0 && !isGrace) continue;     // out of stock
        const cu = this.customers.find(c => c.state === 'waiting' && !c.claimed && c.type === st.type);
        if (cu) this.claimAndCook(st, sl, cu);
      }
      this.refreshStationStatus(st);
    }
  }

  tickPatience(delta) {
    // Freeze patience during gated steps, when a customer is stuck waiting on you to build/hire.
    if (this.tutPhase === 'd-build' || this.tutPhase === 'b-build' || this.tutPhase === 'b-move') return;
    // copy guards against splice-during-iteration in leaveCustomer
    for (const cu of [...this.customers]) {
      if (cu.state !== 'waiting' || cu.claimed) continue;
      cu.patience -= delta;
      if (cu.patience <= 0) { cu.bubble.setText('💨'); this.lost += 1; this.leaveCustomer(cu, false); this.refreshHud(); }
      else this.drawPatience(cu);
    }
  }
}

new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game',
  width: W, height: H,
  backgroundColor: hex(COL.cream),
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [Cafe],
});
</script>
