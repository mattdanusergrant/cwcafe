<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="CW Market" />
<title>CW Market — Prototype</title>
<style>
  html, body { margin: 0; padding: 0; background: #FAF4EA; height: 100%; overflow: hidden; }
  #game { width: 100vw; height: 100vh; }
  * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
</style>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
<div id="game"></div>
<script>
"use strict";

/* ============================================================================
   CW MARKET — a pop-up food market you automate stall by stall.

   Core loop (the heart of the game):
     hand-cook  →  train by repetition  →  automate, one step at a time.

   Every recipe is an ordered sequence of tap-steps (wrap → fill → boil).
   You make dishes by tapping each step. Each manual tap nudges that step's
   training meter; once a step is learned AND a helper is on the stall, the
   helper performs that step automatically — so you tap fewer and fewer steps
   until the line runs itself and the stall earns passively while you walk away
   to work another stall.

   Two scenes share one module-scope game state (G):
     • Market — a hub of stalls; tap one to step inside it.
     • Stall  — the cooking floor for one stall (steps, counter, queue, helper).
   ========================================================================== */

const W = 390, H = 844;
const COL = {
  cream:    0xFAF4EA,
  floor:    0xF3E7D3,
  floorAlt: 0xEEE0CA,
  wall:     0xC9B79A,
  counter:  0xB98B5E,
  card:     0xFFFFFF,
  red:      0xD64545,
  tan:      0xE8C39E,
  pink:     0xF2A6B3,
  green:    0x8FBF6F,
  blue:     0x6FA8C7,
  brown:    0x5A453B,
  dim:      0xB6A488,
  amber:    0xE0913B,
  btn:      0x7BA86B,
  btnOff:   0xC4BBA8,
};
const hex = c => '#' + c.toString(16).padStart(6, '0');
const FONT = 'system-ui,sans-serif';

// ---- Ingredients (a shared pantry; one stall draws from each today) ----
const INGREDIENTS = {
  dough: { emoji:'🌾', label:'Dough' },   // 🥟 dumplings
  tea:   { emoji:'🍵', label:'Tea'   },   // 🧋 boba
  broth: { emoji:'🍲', label:'Broth' },   // 🍜 noodles (future)
};

// ---- Steps: the shared library recipes are built from. Steps reused across
//      recipes (wrap, fill) share ONE training meter per stall — so unlocking a
//      recipe that reuses them leaves only the genuinely new step to learn. ----
const STEPS = {
  wrap:   { emoji:'🌾',  label:'Wrap',   ms:600 },
  fill:   { emoji:'🥩',  label:'Fill',   ms:600 },
  boil:   { emoji:'♨️',  label:'Boil',   ms:1000 },
  fry:    { emoji:'🍳',  label:'Fry',    ms:1100 },
  brew:   { emoji:'🍵',  label:'Brew',   ms:700 },
  pour:   { emoji:'🥛',  label:'Pour',   ms:600 },
  pearls: { emoji:'🟤',  label:'Pearls', ms:700 },
};

// ---- Recipes: an ordered list of step ids. A stall can switch between the
//      recipes it has unlocked (e.g. buying a pan unlocks pan-fried). ----
const RECIPES = {
  boiled:   { name:'Boiled',    emoji:'🥟', value:6,  steps:['wrap','fill','boil'] },
  panfried: { name:'Pan-fried', emoji:'🥟', value:11, steps:['wrap','fill','fry'] },
  milktea:  { name:'Milk Tea',  emoji:'🧋', value:8,  steps:['brew','pour','pearls'] },
};

// ---- Stalls: the market roster. Only the dumpling stall is enterable for now.
//   state: open / locked (buyable later) / soon.
//   recipe: the recipe available from the start.
//   unlock: an optional equipment purchase that adds a second recipe.
const STALLS = {
  dumpling: { name:'Dumpling Stall', emoji:'🥟', accent:COL.red,   ingredient:'dough', recipe:'boiled',  state:'open',
              unlock:{ recipe:'panfried', cost:250, equip:'🍳 Pan' } },
  boba:     { name:'Boba Stall',     emoji:'🧋', accent:COL.pink,  ingredient:'tea',   recipe:'milktea', state:'locked', cost:250 },
  noodle:   { name:'Noodle Stall',   emoji:'🍜', accent:COL.amber, ingredient:'broth', recipe:'noodlesoup', state:'soon' },
};
const STALL_ORDER = ['dumpling', 'boba', 'noodle'];

// ---- Economy / tuning ----
const START_COINS    = 120;   // enough to cook, restock a couple times, and earn toward a helper
const START_STOCK    = 22;    // a smooth first training run (~15 dishes) before the first restock
const RESTOCK_AMOUNT = 20;    // units per restock
const RESTOCK_COST   = 20;    // coins per restock (below the per-dish margin)
const HIRE_COST      = 130;   // coins to hire + assign a helper (reachable soon after training)
const WAGE_PER_SEC   = 0.4;   // coins each helper costs per second
const TRAIN_PER_TAP  = 0.2;   // training a step gains this per manual completion (5 reps to learn)
const TRAINEE_RATE   = 0.05;  // a trainee self-practices a step at this/sec (slower than hand-crafting)
const TRAY_MAX       = 6;     // finished dishes a stall's pickup tray can hold (buffer for hand-cooking)
const QUEUE_MAX      = 4;     // customers that line up at a stall
const PATIENCE_MS    = 14000;
const SPAWN_MS       = 1500;  // customers arrive briskly, so pitching in by hand sells more & earns faster
const WORKER_EMOJIS  = ['🐱', '🐶', '🐰', '🐻', '🦊', '🐼', '🐯', '🐸'];

/* ============================================================================
   Game state (shared across scenes) + pure helpers
   ========================================================================== */
function makeStallState(id) {
  const def = STALLS[id].recipe;            // the recipe available from the start
  const train = {};                         // per-STEP-ID training meter, 0..1 (shared across recipes)
  if (RECIPES[def]) RECIPES[def].steps.forEach(sid => { train[sid] = 0; });
  return {
    id,
    active: def,                            // the recipe this stall is currently making
    unlocked: def ? [def] : [],             // recipe keys this stall can switch between
    train,
    trainee: null,                          // apprentice on the manual line, learning the recipe ({ emoji })
    autos: [null, null, null],              // hands-free auto-stations; each holds a worker ({ emoji }) or null
    served: 0,
    revenue: 0,
    acc: 0,                                 // fractional cycle progress for passive income
  };
}

const G = {
  coins: START_COINS,
  pantry: { dough: START_STOCK, tea: START_STOCK, broth: START_STOCK },
  wageBucket: 0,               // fractional wages owed
  stalls: Object.fromEntries(STALL_ORDER.map(id => [id, makeStallState(id)])),
  firstCookDone: false,        // clears the opening "tap to cook" nudge
  taughtAutomate: false,       // true once the player automates their first stall — stops the teaching highlights
  taughtPan: false,            // true once the pan-fried unlock has been pointed out
};

const recipeOf  = id => RECIPES[G.stalls[id].active];          // the stall's *active* recipe
const cycleMs   = id => recipeOf(id).steps.reduce((a, sid) => a + STEPS[sid].ms, 0);
const trainOf   = (id, sid) => G.stalls[id].train[sid] || 0;
const isLearned = (id, sid) => trainOf(id, sid) >= 1;
const trained   = id => recipeOf(id).steps.every(sid => isLearned(id, sid));   // recipe mastered
// Workforce: a stall has one trainee (manual line) + staffed auto-stations.
const autoLines = id => G.stalls[id].autos.filter(Boolean).length;
const workersAt = id => (G.stalls[id].trainee ? 1 : 0) + autoLines(id);
const totalWorkers = () => STALL_ORDER.reduce((n, id) => n + workersAt(id), 0);
const nextWorkerEmoji = () => WORKER_EMOJIS[totalWorkers() % WORKER_EMOJIS.length];
// A stall earns automatically once its recipe is mastered and ≥1 auto-station is staffed.
const isAutomated = id => STALLS[id].state === 'open' && trained(id) && autoLines(id) > 0;

// Continuous wage drain — coins never go negative (helpers simply work for free if broke).
function tickWages(dtMs) {
  const n = totalWorkers();
  if (n === 0) return;
  G.wageBucket += n * WAGE_PER_SEC * (dtMs / 1000);
  while (G.wageBucket >= 1 && G.coins > 0) { G.coins -= 1; G.wageBucket -= 1; }
  if (G.coins <= 0) G.wageBucket = 0;
}

// Passive income for automated stalls that aren't being hand-run right now — scaled
// by how many auto-stations are staffed. (The stall you're inside is driven by its
// scene's auto-stations instead, so we skip it here.)
function tickPassive(dtMs, exceptId) {
  for (const id of STALL_ORDER) {
    if (id === exceptId || !isAutomated(id)) continue;
    const ing = STALLS[id].ingredient;
    if (G.pantry[ing] <= 0) continue;
    const stall = G.stalls[id], cyc = cycleMs(id), val = recipeOf(id).value;
    stall.acc += dtMs * autoLines(id);          // each staffed station runs a parallel line
    while (stall.acc >= cyc && G.pantry[ing] > 0) {
      stall.acc -= cyc;
      G.pantry[ing] -= 1;
      G.coins += val; stall.served += 1; stall.revenue += val;
    }
  }
}

/* ============================================================================
   Shared UI bits
   ========================================================================== */
// A rounded button drawn from a rectangle (easy hit-testing) + centered label.
function makeButton(scene, x, y, w, h, fill, label, fontSize, depth) {
  const rect = scene.add.rectangle(x, y, w, h, fill).setStrokeStyle(2, COL.brown).setDepth(depth || 60);
  const txt = scene.add.text(x, y, label, { fontFamily:FONT, fontSize:(fontSize||'15px'), color:'#FFFFFF', fontStyle:'700' }).setOrigin(0.5).setDepth((depth||60)+1);
  return { x, y, w, h, rect, txt };
}
const inBox = (px, py, o, hw, hh) => px >= o.x-hw && px <= o.x+hw && py >= o.y-hh && py <= o.y+hh;
const hitBtn = (px, py, b) => inBox(px, py, b, b.w/2, b.h/2);

/* ============================================================================
   MARKET SCENE — the hub: tap a stall to step inside it
   ========================================================================== */
class Market extends Phaser.Scene {
  constructor() { super('market'); }

  create() {
    this.drawBackground();
    this.buildHud();

    this.add.text(W/2, 78, '🏮 CW Market', { fontFamily:FONT, fontSize:'26px', color:hex(COL.brown), fontStyle:'800' }).setOrigin(0.5).setDepth(5);
    this.add.text(W/2, 104, 'Tap a stall to run it', { fontFamily:FONT, fontSize:'13px', color:hex(COL.dim), fontStyle:'700' }).setOrigin(0.5).setDepth(5);

    // One card per stall, stacked down the screen.
    this.cards = [];
    const top = 150, cardH = 184, gap = 16;
    STALL_ORDER.forEach((id, i) => this.cards.push(this.buildCard(id, top + i*(cardH+gap), cardH)));

    this.hintPill = this.makeHintPill();
    this.hl = this.add.graphics().setDepth(8);   // first-run nudge toward the dumpling stall
    this.input.on('pointerdown', p => this.handleTap(p.x, p.y));
    this.refreshHud();
    this.refreshCards();
  }

  // Pulse the dumpling ENTER button until the very first dish has been cooked.
  drawHighlight(time) {
    const g = this.hl; g.clear();
    if (G.firstCookDone) return;
    const c = this.cards.find(c => c.id === 'dumpling');
    if (!c || !c.btn.rect.visible) return;
    const b = c.btn, puls = 0.5 + 0.5 * Math.sin(time / 250);
    g.lineStyle(3 + 2*puls, COL.cream, 0.6 + 0.4*puls);
    g.strokeRoundedRect(b.x - b.w/2 - 2*puls, b.y - b.h/2 - 2*puls, b.w + 4*puls, b.h + 4*puls, 12);
  }

  drawBackground() {
    const g = this.add.graphics().setDepth(0);
    const t = 38;
    for (let yy = 0; yy < H; yy += t)
      for (let xx = 0; xx < W; xx += t) {
        const alt = (Math.floor(xx/t) + Math.floor(yy/t)) % 2 === 0;
        g.fillStyle(alt ? COL.floor : COL.floorAlt, 1).fillRect(xx, yy, t, t);
      }
  }

  buildHud() {
    this.add.rectangle(W/2, 24, W, 48, COL.brown).setDepth(50);
    this.coinLabel = this.add.text(12, 24, '', { fontFamily:FONT, fontSize:'21px', color:'#FAF4EA', fontStyle:'700' }).setOrigin(0,0.5).setDepth(51);
    this.statLabel = this.add.text(W-12, 24, '', { fontFamily:FONT, fontSize:'13px', color:'#FAF4EA' }).setOrigin(1,0.5).setDepth(51);
  }

  refreshHud() {
    this.coinLabel.setText('💰 ' + Math.floor(G.coins));
    const n = totalWorkers(), wage = n * WAGE_PER_SEC;
    const wageStr = n ? '   💸-' + (Number.isInteger(wage) ? wage : wage.toFixed(1)) + '/s' : '';
    this.statLabel.setText('🐾 ' + n + wageStr);
  }

  buildCard(id, y, h) {
    const cfg = STALLS[id], cx = W/2, cardW = 334, left = cx - cardW/2;
    const bg = this.add.graphics().setDepth(4);
    const emoji = this.add.text(left + 46, y + 52, cfg.emoji, { fontSize:'46px' }).setOrigin(0.5).setDepth(5);
    this.add.text(left + 84, y + 30, cfg.name, { fontFamily:FONT, fontSize:'19px', color:hex(COL.brown), fontStyle:'800' }).setOrigin(0,0.5).setDepth(5);
    const status = this.add.text(left + 84, y + 58, '', { fontFamily:FONT, fontSize:'12px', color:hex(COL.dim), fontStyle:'700', lineSpacing:3, wordWrap:{ width: cardW - 100 } }).setOrigin(0,0).setDepth(5);
    // One action button per card; its label/fill/visibility track the stall's state.
    const btn = makeButton(this, cx, y + h - 30, cardW - 28, 42, COL.btn, '', '16px', 6);
    return { id, cfg, y, h, left, cardW, bg, emoji, status, btn };
  }

  refreshCards() {
    for (const c of this.cards) {
      const cfg = c.cfg, open = cfg.state === 'open';
      c.bg.clear();
      c.bg.fillStyle(COL.card, open ? 1 : 0.9).fillRoundedRect(c.left, c.y, c.cardW, c.h, 18);
      c.bg.lineStyle(3, cfg.accent, open ? 1 : 0.5).strokeRoundedRect(c.left, c.y, c.cardW, c.h, 18);
      c.emoji.setAlpha(open ? 1 : 0.5);

      if (open) {
        const s = G.stalls[c.id], ing = cfg.ingredient, r = recipeOf(c.id);
        const learned = r.steps.filter(sid => isLearned(c.id, sid)).length;
        let txt;
        if (isAutomated(c.id)) {
          const lines = autoLines(c.id), rate = lines * (r.value / (cycleMs(c.id) / 1000));
          txt = (G.pantry[ing] > 0)
            ? '🤖 ' + lines + ' auto-station' + (lines>1?'s':'') + ' running  ·  +' + rate.toFixed(1) + '/s\nServed ' + s.served + '   ·   ' + INGREDIENTS[ing].emoji + ' ' + G.pantry[ing] + ' left'
            : '⚠️ Out of ' + INGREDIENTS[ing].emoji + ' — step in to restock\nServed ' + s.served;
        } else if (trained(c.id)) {
          txt = '✓ Recipe mastered — staff an auto-station 🤖\nServed ' + s.served;
        } else {
          txt = (s.served > 0 ? 'Served ' + s.served + '  ·  ' : '') + 'Cook by hand 👆 to master it (' + learned + '/' + r.steps.length + ')\nthen helpers can run auto-stations';
        }
        c.status.setText(txt);
        c.btn.txt.setText('ENTER  →'); c.btn.rect.setFillStyle(COL.btn).setVisible(true); c.btn.txt.setVisible(true);
      } else if (cfg.state === 'locked') {
        c.status.setText('A new stall to open up.\nIts own recipe to learn and automate.');
        const afford = G.coins >= cfg.cost;
        c.btn.txt.setText('🔓 Open  ·  ' + cfg.cost + ' 💰'); c.btn.rect.setFillStyle(afford ? COL.amber : COL.btnOff).setVisible(true); c.btn.txt.setVisible(true);
      } else {   // soon
        c.status.setText('Coming in a future update.');
        c.btn.rect.setVisible(false); c.btn.txt.setVisible(false);
      }
    }
  }

  makeHintPill() {
    const bg = this.add.graphics().setDepth(70);
    const txt = this.add.text(W/2, H-40, '', { fontFamily:FONT, fontSize:'13px', color:hex(COL.brown), fontStyle:'700', align:'center' }).setOrigin(0.5).setDepth(71);
    return { bg, txt, show:(m)=>{ txt.setText(m); const w=txt.width+26,h=txt.height+14; bg.clear(); bg.fillStyle(COL.card,0.96).fillRoundedRect(W/2-w/2,H-40-h/2,w,h,11); bg.lineStyle(2,COL.dim,1).strokeRoundedRect(W/2-w/2,H-40-h/2,w,h,11); this.time.delayedCall(1600,()=>{ if(txt.text===m){txt.setText('');bg.clear();} }); } };
  }

  handleTap(px, py) {
    // action buttons first (ENTER / Open)
    for (const c of this.cards) {
      if (!c.btn.rect.visible || !hitBtn(px, py, c.btn)) continue;
      if (c.cfg.state === 'open') this.scene.start('stall', { id: c.id });
      else if (c.cfg.state === 'locked') this.tryOpenStall(c);
      return;
    }
    // card-body taps: open → enter, locked/soon → explain
    const top = 150, cardH = 184, gap = 16;
    STALL_ORDER.forEach((id, i) => {
      const y = top + i*(cardH+gap);
      if (py >= y && py <= y + cardH) {
        const cfg = STALLS[id];
        if (cfg.state === 'open') this.scene.start('stall', { id });
        else if (cfg.state === 'locked') this.hintPill.show('Tap “Open” to start the ' + cfg.name + ' for ' + cfg.cost + ' 💰');
        else this.hintPill.show('🍜 Noodles are coming soon!');
      }
    });
  }

  // Open a locked stall for coins, then step straight inside to start cooking.
  tryOpenStall(c) {
    const cfg = c.cfg;
    if (G.coins < cfg.cost) { this.hintPill.show('Need ' + cfg.cost + ' 💰 to open the ' + cfg.name); return; }
    G.coins -= cfg.cost;
    cfg.state = 'open';                 // mutates STALLS[id].state — persists for the session
    this.refreshHud(); this.refreshCards();
    this.scene.start('stall', { id: c.id });
  }

  update(time, delta) {
    tickWages(delta);
    tickPassive(delta, null);   // every automated stall earns while you're in the market
    this.refreshHud();
    this.refreshCards();
    this.drawHighlight(time);
  }
}

/* ============================================================================
   STALL SCENE — the cooking floor for one stall
   ========================================================================== */
const TOKEN_Y   = 158;   // the in-progress dish hovers above the current step
const PREP_Y    = 230;   // the row of recipe step-buttons (the player's manual line)
const TABS_Y    = 300;   // recipe selector tabs (dumpling only)
const AUTO_Y    = 362;   // the row of hands-free auto-stations
const TRAY_Y    = 406;   // finished dishes line the pickup tray
const COUNTER_Y = 446;   // the serving counter band
const QUEUE_Y   = [530, 588, 646, 704];   // front of line → back toward the door
const DOOR      = { x: W/2, y: 828 };
const AUTO_X    = [120, 195, 270];        // x of each auto-station
const TRAINEE   = { x: W - 46, y: PREP_Y };   // apprentice slot beside the manual line

class Stall extends Phaser.Scene {
  constructor() { super('stall'); }

  create(data) {
    this.id = data.id;
    this.cfg = STALLS[this.id];
    this.recipe = recipeOf(this.id);
    this.stall = G.stalls[this.id];

    // The single dish currently being assembled on the line.
    this.dish = { step: 0, performing: false, prog: 0, manual: false, consumed: false };
    this.tray = [];        // finished-dish tokens waiting on the pickup tray
    this.customers = [];
    this.spawnAcc = SPAWN_MS * 0.4;
    this.wasAutomated = isAutomated(this.id);   // to detect the moment this stall first runs itself
    this.guideBackUntil = 0;                    // briefly highlight ← Market right after that moment

    this.drawRoom();
    this.buildHud();
    this.buildPantryChip();
    this.buildPrepLine();
    this.buildTray();
    this.buildWorkforce();
    this.buildHintPill();
    this.buildDishToken();
    this.buildRecipeTabs();
    this.hl = this.add.graphics().setDepth(69);   // pulsing "do this next" highlight
    this.refreshAll();

    this.input.on('pointerdown', p => this.handleTap(p.x, p.y));
  }

  // ---------------- First-run highlight ----------------
  // Returns a box {x,y,w,h} or circle {x,y,r} to pulse around the next useful
  // action — kept gentle and self-disabling once the player has learned the loop.
  highlightTarget(time) {
    if (time < this.guideBackUntil) return { x:this.backBtn.x, y:this.backBtn.y, w:this.backBtn.w+10, h:this.backBtn.h+10 };
    if (!G.taughtAutomate) {                                  // teach the core loop on the first stall only
      if (trained(this.id) && G.coins >= HIRE_COST) {
        // recipe mastered → point at the way to automate (deploy a ready trainee, else staff a station)
        if (this.stall.trainee) return { x:TRAINEE.x, y:TRAINEE.y, r:22 };
        const open = this.autoStations.find(st => !this.stall.autos[st.i]);
        if (open) return { x:open.x, y:open.y, r:22 };
      } else if (!trained(this.id)) {                        // otherwise nudge the current manual step
        const k = this.dish.step;
        if (k < this.recipe.steps.length && !this.dish.performing) {
          const b = this.stepBtns[k];
          return { x:b.x, y:b.y, w:b.bw+8, h:b.bh+8 };
        }
      }
    } else if (!G.taughtPan) {                               // one-time nudge toward the pan unlock
      const u = STALLS[this.id].unlock;
      if (u && !this.stall.unlocked.includes(u.recipe) && isAutomated(this.id) && G.coins >= u.cost) {
        const tab = this.recipeTabs.find(t => t.key === u.recipe);
        if (tab) return { x:tab.x, y:tab.y, w:tab.w+8, h:tab.h+8 };
      }
    }
    return null;
  }

  drawHighlight(time) {
    const g = this.hl; g.clear();
    const t = this.highlightTarget(time);
    if (!t) return;
    const puls = 0.5 + 0.5 * Math.sin(time / 250);
    g.lineStyle(3 + 2*puls, COL.btn, 0.4 + 0.5*puls);
    if (t.r) g.strokeCircle(t.x, t.y, t.r + 3*puls);
    else     g.strokeRoundedRect(t.x - t.w/2 - 2*puls, t.y - t.h/2 - 2*puls, t.w + 4*puls, t.h + 4*puls, 14);
  }

  // ---------------- Layout / room ----------------
  drawRoom() {
    const g = this.add.graphics().setDepth(0);
    const t = 38;
    for (let yy = 96; yy < H; yy += t)
      for (let xx = 0; xx < W; xx += t) {
        const alt = (Math.floor(xx/t) + Math.floor(yy/t)) % 2 === 0;
        g.fillStyle(alt ? COL.floor : COL.floorAlt, 1).fillRect(xx, yy, t, t);
      }
    g.fillStyle(COL.wall, 1);
    g.fillRect(0, 96, W, 8);
    g.fillRect(0, H-8, W, 8);
    g.fillStyle(COL.floor, 1).fillRect(DOOR.x-38, H-8, 76, 8);                       // doorway
    g.fillStyle(COL.counter, 1).fillRoundedRect(20, COUNTER_Y-13, W-40, 26, 8);      // serving counter
    this.add.text(W/2, COUNTER_Y+24, 'waiting line', { fontFamily:FONT, fontSize:'11px', color:hex(COL.dim) }).setOrigin(0.5).setDepth(2);
  }

  buildHud() {
    this.add.rectangle(W/2, 24, W, 48, this.cfg.accent).setDepth(50);
    this.coinLabel = this.add.text(12, 24, '', { fontFamily:FONT, fontSize:'21px', color:'#FFFFFF', fontStyle:'700' }).setOrigin(0,0.5).setDepth(51);
    this.statLabel = this.add.text(W-12, 24, '', { fontFamily:FONT, fontSize:'12px', color:'#FFFFFF' }).setOrigin(1,0.5).setDepth(51);

    // Back-to-market button + stall name on the sub-bar.
    this.add.rectangle(W/2, 72, W, 48, COL.cream).setDepth(50);
    this.backBtn = makeButton(this, 52, 72, 76, 34, COL.brown, '← Market', '13px', 51);
    this.add.text(W/2 + 6, 72, this.cfg.emoji + ' ' + this.cfg.name, { fontFamily:FONT, fontSize:'15px', color:hex(COL.brown), fontStyle:'800' }).setOrigin(0.5).setDepth(51);
  }

  // The stall's ingredient chip (top-right of the sub-bar): tap to restock.
  buildPantryChip() {
    const x = W - 60, y = 72;
    this.pantryChip = { x, y, w: 92, h: 34 };
    this.pantryChip.box = this.add.rectangle(x, y, 92, 34, COL.card).setStrokeStyle(2, COL.dim).setDepth(51);
    this.pantryChip.txt = this.add.text(x, y-6, '', { fontFamily:FONT, fontSize:'14px', color:hex(COL.brown), fontStyle:'700' }).setOrigin(0.5).setDepth(52);
    this.pantryChip.cap = this.add.text(x, y+9, '↺ ' + RESTOCK_COST + '💰', { fontFamily:FONT, fontSize:'9px', color:hex(COL.dim), fontStyle:'700' }).setOrigin(0.5).setDepth(52);
  }

  refreshPantryChip() {
    const ing = this.cfg.ingredient, stock = G.pantry[ing];
    let col = COL.brown; if (stock === 0) col = COL.red; else if (stock <= 3) col = COL.amber;
    this.pantryChip.txt.setText(INGREDIENTS[ing].emoji + ' ' + stock).setColor(hex(col));
    this.pantryChip.box.setStrokeStyle(2, stock === 0 ? COL.red : COL.dim);

  // ---------------- Prep line (the tap-steps) ----------------
  buildPrepLine() {
    if (this.stepBtns) this.stepBtns.forEach(b => b.cont.destroy());   // rebuilt when the recipe switches
    // Centered a touch left of middle so the helper column on the right has clear space.
    const n = this.recipe.steps.length, gap = 92, startX = 168 - (n-1)*gap/2;
    this.stepBtns = this.recipe.steps.map((sid, i) => {
      const s = STEPS[sid], x = startX + i*gap, y = PREP_Y, bw = 88, bh = 96;
      const cont = this.add.container(x, y).setDepth(10);
      const bg = this.add.graphics();
      const emoji = this.add.text(0, -22, s.emoji, { fontSize:'30px' }).setOrigin(0.5);
      const label = this.add.text(0, 8, s.label, { fontFamily:FONT, fontSize:'13px', color:hex(COL.brown), fontStyle:'800' }).setOrigin(0.5);
      const mark  = this.add.text(0, 28, '', { fontFamily:FONT, fontSize:'11px', fontStyle:'800' }).setOrigin(0.5);
      const meter = this.add.graphics();   // training meter (bottom) + perform progress (overlay)
      cont.add([bg, emoji, label, mark, meter]);
      return { i, sid, x, y, bw, bh, cont, bg, emoji, label, mark, meter };
    });
  }

  // Draw one step button (the player's manual line). Frame reflects active / learned.
  refreshStepBtn(i) {
    const b = this.stepBtns[i], sid = b.sid;
    const learned = isLearned(this.id, sid);
    const isCurrent = this.dish.step === i;
    const train = Phaser.Math.Clamp(trainOf(this.id, sid), 0, 1);

    b.bg.clear();
    const frame = isCurrent ? COL.btn : this.cfg.accent;
    b.bg.fillStyle(frame, isCurrent ? 0.18 : 0.10).fillRoundedRect(-b.bw/2, -b.bh/2, b.bw, b.bh, 14);
    b.bg.lineStyle(isCurrent ? 3.5 : 2.5, frame, 1).strokeRoundedRect(-b.bw/2, -b.bh/2, b.bw, b.bh, 14);

    b.mark.setText(learned ? '✓ mastered' : (isCurrent ? '👆 tap' : ''))
          .setColor(hex(learned ? COL.green : COL.brown));

    // training meter strip along the bottom of the button
    const mw = b.bw - 20, mx = -mw/2, my = b.bh/2 - 11;
    b.meter.clear();
    b.meter.fillStyle(COL.cream, 1).fillRoundedRect(mx, my, mw, 5, 2);
    b.meter.fillStyle(learned ? COL.green : COL.amber, 1).fillRoundedRect(mx, my, mw*train, 5, 2);
  }

  // Perform-progress arc drawn live while the player works a step.
  drawStepProgress() {
    this.stepBtns.forEach((b, i) => {
      if (!(this.dish.performing && this.dish.step === i)) return;
      const mw = b.bw - 20, mx = -mw/2, my = b.bh/2 - 11;
      const train = Phaser.Math.Clamp(trainOf(this.id, b.sid), 0, 1);
      const learned = isLearned(this.id, b.sid);
      b.meter.clear();
      b.meter.fillStyle(COL.cream, 1).fillRoundedRect(mx, my, mw, 5, 2);
      b.meter.fillStyle(learned ? COL.green : COL.amber, 1).fillRoundedRect(mx, my, mw*train, 5, 2);
      const pw = b.bw - 20, px = -pw/2, py = -b.bh/2 + 6;
      b.meter.fillStyle(COL.cream, 1).fillRoundedRect(px, py, pw, 6, 3);
      b.meter.fillStyle(COL.btn, 1).fillRoundedRect(px, py, pw*Phaser.Math.Clamp(this.dish.prog,0,1), 6, 3);
    });
  }

  // ---------------- In-progress dish token ----------------
  buildDishToken() {
    this.token = this.add.text(this.stepBtns[0].x, TOKEN_Y, this.recipe.emoji, { fontSize:'30px' }).setOrigin(0.5).setDepth(12);
    this.refreshToken();
  }

  refreshToken() {
    const steps = this.recipe.steps.length;
    const k = Math.min(this.dish.step, steps - 1);
    this.token.setText(this.recipe.emoji).setX(this.stepBtns[k].x);
    this.token.setAlpha(0.3 + 0.7 * (this.dish.step / steps));
  }

  // ---------------- Recipe tabs (switch recipe / buy equipment) ----------------
  // Shown only when a stall can hold more than one recipe (e.g. dumplings, once
  // the pan is bought). The second tab doubles as the equipment-purchase button.
  buildRecipeTabs() {
    const u = STALLS[this.id].unlock;
    this.recipeKeys = u ? [STALLS[this.id].recipe, u.recipe] : [STALLS[this.id].recipe];
    this.recipeTabs = [];
    if (this.recipeKeys.length < 2) return;            // nothing to switch between — no tabs
    const n = this.recipeKeys.length, tw = 156, gap = 10, y = TABS_Y;
    const startX = W/2 - ((n-1)*(tw+gap))/2;
    this.recipeKeys.forEach((key, i) => {
      const x = startX + i*(tw+gap);
      const bg  = this.add.graphics().setDepth(9);
      const txt = this.add.text(x, y, '', { fontFamily:FONT, fontSize:'12.5px', fontStyle:'800', align:'center' }).setOrigin(0.5).setDepth(10);
      this.recipeTabs.push({ key, x, y, w:tw, h:38, bg, txt });
    });
  }

  refreshRecipeTabs() {
    if (!this.recipeTabs) return;
    for (const tab of this.recipeTabs) {
      const r = RECIPES[tab.key];
      const unlocked = this.stall.unlocked.includes(tab.key);
      const active = this.stall.active === tab.key;
      const u = STALLS[this.id].unlock;
      tab.bg.clear();
      const x = tab.x - tab.w/2, y = tab.y - tab.h/2;
      if (!unlocked) {                                  // the locked recipe = buy-equipment button
        const afford = G.coins >= u.cost;
        tab.bg.fillStyle(afford ? COL.amber : COL.btnOff, afford ? 0.18 : 0.12).fillRoundedRect(x, y, tab.w, tab.h, 12);
        tab.bg.lineStyle(2.5, afford ? COL.amber : COL.dim, 1).strokeRoundedRect(x, y, tab.w, tab.h, 12);
        tab.txt.setText(u.equip + ' 🔒\nunlock ' + r.name + ' · ' + u.cost + '💰').setColor(hex(afford ? COL.brown : COL.dim));
      } else {
        const col = this.cfg.accent;
        tab.bg.fillStyle(col, active ? 0.22 : 0.08).fillRoundedRect(x, y, tab.w, tab.h, 12);
        tab.bg.lineStyle(active ? 3.5 : 2, col, active ? 1 : 0.6).strokeRoundedRect(x, y, tab.w, tab.h, 12);
        tab.txt.setText((active ? '▶ ' : '') + r.emoji + ' ' + r.name + '\n' + r.value + '💰 each').setColor(hex(COL.brown));
      }
    }
  }

  // Switch the stall to a different unlocked recipe. Shared steps keep their
  // training; only steps unique to the new recipe still need learning.
  setActiveRecipe(key) {
    if (this.stall.active === key || !this.stall.unlocked.includes(key)) return;
    this.stall.active = key;
    this.recipe = recipeOf(this.id);
    this.dish = { step:0, performing:false, prog:0, manual:false, consumed:false };   // steps changed — reset the line
    this.buildPrepLine();
    this.refreshAll();
  }

  tryBuyEquipment(key) {
    const u = STALLS[this.id].unlock;
    if (!u || u.recipe !== key) return;
    if (G.coins < u.cost) { this.flashHint('Need ' + u.cost + ' 💰 for the ' + u.equip); return; }
    G.coins -= u.cost;
    G.taughtPan = true;                                 // the unlock has been used — stop nudging it
    this.stall.unlocked.push(key);
    RECIPES[key].steps.forEach(sid => { if (!(sid in this.stall.train)) this.stall.train[sid] = 0; });
    const newStep = RECIPES[key].steps.find(sid => trainOf(this.id, sid) < 1) || RECIPES[key].steps[RECIPES[key].steps.length-1];
    this.setActiveRecipe(key);                          // switch to the new recipe straight away
    this.flashHint(u.equip + ' bought! Learn the new ' + STEPS[newStep].emoji + ' ' + STEPS[newStep].label + ' step 👆', 2400);
  }

  // ---------------- Pickup tray ----------------
  buildTray() {
    const gap = 30, startX = W/2 - (TRAY_MAX-1)*gap/2;
    this.trayPlates = [];
    for (let i = 0; i < TRAY_MAX; i++) {
      const x = startX + i*gap;
      const plate = this.add.circle(x, TRAY_Y, 11, COL.btnOff).setStrokeStyle(2, this.cfg.accent).setDepth(8).setAlpha(0.35);
      const dish  = this.add.text(x, TRAY_Y, '', { fontSize:'17px' }).setOrigin(0.5).setDepth(9);
      this.trayPlates.push({ x, plate, dish });
    }
  }

  refreshTray() {
    this.trayPlates.forEach((p, i) => {
      const filled = i < this.tray.length;
      p.dish.setText(filled ? this.recipe.emoji : '');
      p.plate.setAlpha(filled ? 1 : 0.35);
    });
  }

  // ---------------- Workforce: a trainee on the manual line + hands-free auto-stations ----------------
  buildWorkforce() {
    // Trainee slot — an apprentice that learns the recipe beside the player.
    const tx = TRAINEE.x, ty = TRAINEE.y;
    this.traineeDot  = this.add.circle(tx, ty, 18, COL.btnOff).setStrokeStyle(2, this.cfg.accent).setDepth(11);
    this.traineeFace = this.add.text(tx, ty, '', { fontSize:'20px' }).setOrigin(0.5).setDepth(12);
    this.traineeLbl  = this.add.text(tx, ty+27, '', { fontFamily:FONT, fontSize:'9.5px', color:hex(COL.dim), fontStyle:'700', align:'center' }).setOrigin(0.5).setDepth(12);

    // Auto-stations — staffed helpers run the whole recipe hands-free (no buttons).
    this.add.text(W/2, AUTO_Y - 28, '🤖 AUTO STATIONS', { fontFamily:FONT, fontSize:'10px', color:hex(COL.dim), fontStyle:'800' }).setOrigin(0.5).setDepth(8);
    this.autoStations = AUTO_X.map((x, i) => {
      const ring = this.add.graphics().setDepth(11);
      const dot  = this.add.circle(x, AUTO_Y, 17, COL.btnOff).setStrokeStyle(2, COL.blue).setDepth(11);
      const face = this.add.text(x, AUTO_Y, '', { fontSize:'18px' }).setOrigin(0.5).setDepth(12);
      const lbl  = this.add.text(x, AUTO_Y+25, '', { fontFamily:FONT, fontSize:'9px', color:hex(COL.dim), fontStyle:'700' }).setOrigin(0.5).setDepth(12);
      return { i, x, y:AUTO_Y, r:17, ring, dot, face, lbl };
    });
    this.autoProg = AUTO_X.map(() => null);   // per-station cycle: null=idle, 0..1=working, 'done'=waiting for tray
  }

  refreshWorkforce() {
    const isTrained = trained(this.id);
    // Trainee
    const tw = this.stall.trainee;
    if (tw) {
      this.traineeDot.setFillStyle(COL.tan);
      this.traineeFace.setText(tw.emoji);
      this.traineeLbl.setText(isTrained ? '✓ ready\ntap to deploy' : 'learning…');
    } else {
      this.traineeDot.setFillStyle(COL.btnOff);
      this.traineeFace.setText('');
      this.traineeLbl.setText('+ apprentice\n' + HIRE_COST + '💰');
    }
    // Auto-stations
    this.autoStations.forEach(st => {
      const w = this.stall.autos[st.i];
      st.face.setText(w ? w.emoji : '');
      st.dot.setFillStyle(w ? COL.tan : COL.btnOff).setStrokeStyle(2, w ? COL.blue : COL.dim);
      st.lbl.setText(w ? (isTrained ? 'running 🤖' : 'idle') : (isTrained ? '+ staff\n' + HIRE_COST + '💰' : '🔒 master\nrecipe'));
      st.lbl.setColor(hex(w && isTrained ? COL.blue : COL.dim));
    });
  }

  // Live progress rings on working auto-stations.
  drawAutoProgress() {
    this.autoStations.forEach(st => {
      st.ring.clear();
      const p = this.autoProg[st.i];
      if (typeof p !== 'number') return;
      st.ring.lineStyle(3, COL.blue, 0.9);
      st.ring.beginPath();
      st.ring.arc(st.x, st.y, st.r + 4, -Math.PI/2, -Math.PI/2 + Phaser.Math.PI2 * Phaser.Math.Clamp(p,0,1));
      st.ring.strokePath();
    });
  }

  // ---------------- HUD / hint ----------------
  refreshHud() {
    this.coinLabel.setText('💰 ' + Math.floor(G.coins));
    this.statLabel.setText('Served ' + this.stall.served + '   🐾' + workersAt(this.id));
  }

  buildHintPill() {
    this.hintBg = this.add.graphics().setDepth(70);
    this.hintTxt = this.add.text(W/2, 116, '', { fontFamily:FONT, fontSize:'13px', color:hex(COL.brown), fontStyle:'700', align:'center', wordWrap:{ width: 320 } }).setOrigin(0.5).setDepth(71);
  }

  setHint(msg) {
    this.hintTxt.setText(msg || '');
    this.hintBg.clear();
    if (msg) {
      const w = this.hintTxt.width + 24, h = this.hintTxt.height + 14;
      this.hintBg.fillStyle(COL.card, 0.96).fillRoundedRect(W/2-w/2, 116-h/2, w, h, 11);
      this.hintBg.lineStyle(2, COL.dim, 1).strokeRoundedRect(W/2-w/2, 116-h/2, w, h, 11);
    }
  }

  flashHint(msg, ms = 1500) {
    this.setHint(msg);
    this.time.delayedCall(ms, () => { if (this.hintTxt.text === msg) this.updateStandingHint(); });
  }

  // The standing instruction shown when nothing transient is up.
  updateStandingHint() {
    const first = STEPS[this.recipe.steps[0]];
    const u = STALLS[this.id].unlock;
    const panBuyable = u && !this.stall.unlocked.includes(u.recipe);
    const steps = this.recipe.steps, total = steps.length;
    const learned = steps.filter(sid => isLearned(this.id, sid)).length;
    const isTrained = trained(this.id);
    const openAuto = this.stall.autos.some(w => !w);
    if (!G.firstCookDone)            this.setHint('👆 Tap ' + first.emoji + ' ' + first.label + ' to make a ' + this.recipe.emoji + ' by hand');
    else if (isTrained && panBuyable && G.coins >= u.cost)
                                     this.setHint('Buy the ' + u.equip + ' to unlock ' + RECIPES[u.recipe].name + ' ' + RECIPES[u.recipe].emoji + ' — worth more!');
    else if (isTrained && openAuto)  this.setHint('✓ Mastered! Staff an 🤖 auto-station so it runs hands-free — you keep cooking too');
    else if (isTrained)              this.setHint('🤖 Auto-stations are cooking — keep crafting by hand for extra coins!');
    else                             this.setHint('Cook by hand to master the recipe (' + learned + '/' + total + ' steps) — then helpers can run it');
  }

  refreshAll() {
    this.refreshHud();
    this.refreshPantryChip();
    this.refreshTray();
    this.refreshWorkforce();
    this.refreshToken();
    this.refreshRecipeTabs();
    this.stepBtns.forEach((_, i) => this.refreshStepBtn(i));
    this.updateStandingHint();
  }

  // ---------------- Cooking logic (manual line — player only) ----------------
  startStep(k, manual) {
    if (k === 0 && !this.dish.consumed) {                 // a fresh dish draws one ingredient
      if (G.pantry[this.cfg.ingredient] <= 0) {
        if (manual) this.flashHint('Out of ' + INGREDIENTS[this.cfg.ingredient].emoji + ' — tap the chip to restock');
        return false;
      }
      G.pantry[this.cfg.ingredient] -= 1;
      this.dish.consumed = true;
      this.refreshPantryChip();
    }
    this.dish.performing = true;
    this.dish.prog = 0;
    this.dish.manual = manual;
    return true;
  }

  completeStep(k) {
    this.dish.performing = false;
    this.dish.prog = 0;
    const sid = this.recipe.steps[k], was = trainOf(this.id, sid);
    this.stall.train[sid] = Math.min(1, was + TRAIN_PER_TAP);   // hand-crafting trains the recipe
    if (!G.firstCookDone) { G.firstCookDone = true; this.flashHint('Nice — one ' + this.recipe.emoji + ' made! Keep going to master each step', 2200); }
    else if (was < 1 && this.stall.train[sid] >= 1) {
      this.floatText(this.stepBtns[k].x, PREP_Y - 44, '✓ mastered!', COL.green);
      this.flashHint('✓ ' + STEPS[sid].label + ' mastered!' + (trained(this.id) ? ' Recipe complete — staff an 🤖 auto-station' : ''), 2200);
    }
    this.dish.step = k + 1;
    this.stepBtns.forEach((_, i) => this.refreshStepBtn(i));   // re-highlight the new current step
    this.refreshToken();
    this.refreshWorkforce();
  }

  // Add one finished dish to the shared tray (returns false if it's full). Used by
  // both the manual line and the auto-stations.
  addDishToTray(fromX, fromY) {
    if (this.tray.length >= TRAY_MAX) return false;
    this.tray.push(true);
    const plate = this.trayPlates[this.tray.length - 1];
    const fly = this.add.text(fromX, fromY, this.recipe.emoji, { fontSize:'22px' }).setOrigin(0.5).setDepth(30);
    this.tweens.add({ targets: fly, x: plate.x, y: TRAY_Y, duration: 260, ease:'Quad.Out', onComplete: () => { fly.destroy(); this.refreshTray(); } });
    return true;
  }

  depositDish() {
    if (!this.addDishToTray(this.token.x, TOKEN_Y)) return;   // tray full — finished dish waits
    this.dish.step = 0; this.dish.performing = false; this.dish.prog = 0; this.dish.consumed = false;
    this.stepBtns.forEach((_, i) => this.refreshStepBtn(i));
    this.refreshToken();
  }

  // The player's manual line: advances only when the player taps (never auto-runs).
  tickLine(delta) {
    const steps = this.recipe.steps;
    if (this.dish.step >= steps.length) { this.depositDish(); return; }
    const k = this.dish.step;
    if (this.dish.performing) {
      this.dish.prog += delta / STEPS[steps[k]].ms;
      if (this.dish.prog >= 1) this.completeStep(k);
    }
    this.drawStepProgress();
  }

  // Hands-free auto-stations: each staffed station runs the full recipe on its own
  // (once mastered), consuming an ingredient per dish and depositing to the tray.
  tickAutoStations(delta) {
    if (!trained(this.id)) { this.drawAutoProgress(); return; }
    const cyc = cycleMs(this.id), ing = this.cfg.ingredient;
    this.autoStations.forEach(st => {
      const staffed = !!this.stall.autos[st.i];
      let p = this.autoProg[st.i];
      if (!staffed) { this.autoProg[st.i] = null; return; }
      if (p === 'done') {                                   // finished, waiting for tray room
        if (this.addDishToTray(st.x, st.y)) this.autoProg[st.i] = null;
      } else if (p === null) {                              // idle — start a cycle if we can
        if (this.tray.length < TRAY_MAX && G.pantry[ing] > 0) {
          G.pantry[ing] -= 1; this.refreshPantryChip();
          this.autoProg[st.i] = 0;
        }
      } else {                                              // working
        p += delta / cyc;
        this.autoProg[st.i] = p >= 1 ? 'done' : p;
        if (p >= 1 && this.addDishToTray(st.x, st.y)) this.autoProg[st.i] = null;
      }
    });
    this.drawAutoProgress();
  }

  // ---------------- Customers ----------------
  spawnCustomer() {
    if (this.customers.length >= QUEUE_MAX) return;
    const idx = this.customers.length;
    const cont = this.add.container(DOOR.x, DOOR.y).setDepth(20);
    cont.add(this.add.circle(0, 0, 22, COL.card).setStrokeStyle(3, COL.dim));
    cont.add(this.add.text(0, 0, '🙂', { fontSize:'22px' }).setOrigin(0.5));
    cont.add(this.add.circle(0, -42, 16, COL.cream).setStrokeStyle(2, COL.dim));
    const bubble = this.add.text(0, -42, this.recipe.emoji, { fontSize:'18px' }).setOrigin(0.5);
    const patBar = this.add.graphics();
    cont.add([bubble, patBar]);
    const cu = { cont, bubble, patBar, patience: PATIENCE_MS, state:'walking' };
    this.customers.push(cu);
    this.tweens.add({ targets: cont, x: QUEUE_X(), y: QUEUE_Y[idx], duration: 700, ease:'Sine.InOut', onComplete: () => { if (cu.state === 'walking') cu.state = 'waiting'; } });
  }

  layoutQueue() {
    this.customers.forEach((cu, i) => {
      if (cu.state === 'leaving') return;
      this.tweens.add({ targets: cu.cont, x: QUEUE_X(), y: QUEUE_Y[Math.min(i, QUEUE_Y.length-1)], duration: 250, ease:'Sine.Out' });
    });
  }

  drawPatience(cu) {
    const bw = 42, bh = 6, bx = -bw/2, by = -24;
    const p = cu.patience / PATIENCE_MS;
    let c = COL.green; if (p < 0.5) c = COL.tan; if (p < 0.25) c = COL.red;
    cu.patBar.clear();
    cu.patBar.fillStyle(COL.cream, 1).fillRoundedRect(bx, by, bw, bh, 3);
    cu.patBar.fillStyle(c, 1).fillRoundedRect(bx, by, bw*Phaser.Math.Clamp(p,0,1), bh, 3);
  }

  serveFront() {
    const cu = this.customers.find(c => c.state === 'waiting');
    if (!cu) return;
    this.tray.pop(); this.refreshTray();
    cu.state = 'leaving';
    cu.patBar.clear();
    cu.bubble.setText('💛');
    const val = this.recipe.value;
    // a dish flies from the tray to the guest, then pays out
    const src = this.trayPlates[this.tray.length] || this.trayPlates[0];
    const fly = this.add.text(src.x, TRAY_Y, this.recipe.emoji, { fontSize:'20px' }).setOrigin(0.5).setDepth(35);
    this.tweens.add({ targets: fly, x: cu.cont.x, y: cu.cont.y, duration: 260, ease:'Quad.Out', onComplete: () => {
      fly.destroy();
      G.coins += val; this.stall.served += 1; this.stall.revenue += val;
      this.floatText(cu.cont.x, cu.cont.y - 30, '+' + val + ' 💰', COL.green);
      this.refreshHud();
    }});
    this.tweens.add({ targets: cu.cont, x: DOOR.x, y: DOOR.y + 40, alpha: 0, duration: 800, delay: 120, ease:'Sine.In', onComplete: () => {
      cu.cont.destroy();
      this.customers = this.customers.filter(c => c !== cu);
      this.layoutQueue();
    }});
  }

  tickCustomers(delta) {
    this.spawnAcc += delta;
    if (this.spawnAcc >= SPAWN_MS) { this.spawnAcc = 0; this.spawnCustomer(); }
    // serve as many fronts as we have tray dishes
    while (this.tray.length > 0 && this.customers.some(c => c.state === 'waiting')) this.serveFront();
    for (const cu of [...this.customers]) {
      if (cu.state !== 'waiting') continue;
      cu.patience -= delta;
      if (cu.patience <= 0) {
        cu.state = 'leaving'; cu.bubble.setText('💨'); cu.patBar.clear();
        this.tweens.add({ targets: cu.cont, x: DOOR.x, y: DOOR.y + 40, alpha: 0, duration: 700, ease:'Sine.In', onComplete: () => {
          cu.cont.destroy(); this.customers = this.customers.filter(c => c !== cu); this.layoutQueue();
        }});
      } else this.drawPatience(cu);
    }
  }

  floatText(x, y, str, color) {
    const t = this.add.text(x, y, str, { fontFamily:FONT, fontSize:'19px', color:hex(color), fontStyle:'700' }).setOrigin(0.5).setDepth(45);
    this.tweens.add({ targets:t, y:y-42, alpha:0, duration:800, ease:'Quad.Out', onComplete:()=>t.destroy() });
  }

  // ---------------- Input ----------------
  handleTap(px, py) {
    if (hitBtn(px, py, this.backBtn)) { this.scene.start('market'); return; }
    if (inBox(px, py, this.pantryChip, this.pantryChip.w/2, this.pantryChip.h/2)) { this.doRestock(); return; }
    // trainee slot: hire an apprentice, or (once ready) deploy them to an auto-station
    if (inBox(px, py, TRAINEE, 22, 26)) { this.tapTrainee(); return; }
    // auto-stations: staff with a worker (once the recipe is mastered)
    for (const st of this.autoStations) {
      if (Math.abs(px - st.x) <= 24 && Math.abs(py - st.y) <= 24) { this.tapAutoStation(st.i); return; }
    }
    // recipe tabs: select an unlocked recipe, or buy the equipment that unlocks it
    for (const tab of this.recipeTabs) {
      if (!inBox(px, py, tab, tab.w/2, tab.h/2)) continue;
      if (this.stall.unlocked.includes(tab.key)) {
        this.setActiveRecipe(tab.key);
        this.flashHint('Now making ' + RECIPES[tab.key].emoji + ' ' + RECIPES[tab.key].name);
      } else {
        this.tryBuyEquipment(tab.key);
      }
      return;
    }
    // a prep step: tap the CURRENT step to work it. You can always pitch in —
    // even on an automated line — to cook faster than the helper alone.
    for (const b of this.stepBtns) {
      if (!inBox(px, py, b, b.bw/2, b.bh/2)) continue;
      if (this.dish.step !== b.i) { this.flashHint('Make the steps in order 👉'); return; }
      if (this.dish.performing) this.completeStep(b.i);   // rush the step in progress (helps even when automated)
      else this.startStep(b.i, true);
      return;
    }
  }

  doRestock() {
    if (G.coins < RESTOCK_COST) { this.flashHint('Need ' + RESTOCK_COST + ' 💰 to restock'); return; }
    G.coins -= RESTOCK_COST;
    G.pantry[this.cfg.ingredient] += RESTOCK_AMOUNT;
    this.refreshHud(); this.refreshPantryChip();
    this.flashHint('Restocked ' + INGREDIENTS[this.cfg.ingredient].emoji + ' +' + RESTOCK_AMOUNT);
  }

  // Trainee slot: hire an apprentice when empty; once the recipe is mastered, tap the
  // ready apprentice to deploy them (free) into an open auto-station.
  tapTrainee() {
    const tw = this.stall.trainee;
    if (!tw) {
      if (G.coins < HIRE_COST) { this.flashHint('Need ' + HIRE_COST + ' 💰 to hire an apprentice'); return; }
      G.coins -= HIRE_COST;
      this.stall.trainee = { emoji: nextWorkerEmoji() };
      this.flashHint('Hired ' + this.stall.trainee.emoji + '! They learn the recipe as you craft 🐾');
    } else if (trained(this.id)) {
      const slot = this.stall.autos.findIndex(w => !w);
      if (slot < 0) { this.flashHint('All auto-stations are staffed'); return; }
      this.stall.autos[slot] = tw;
      this.stall.trainee = null;
      this.flashHint(tw.emoji + ' deployed to an 🤖 auto-station — it now runs hands-free!');
    } else {
      this.flashHint(tw.emoji + ' is still learning — keep crafting to master the recipe');
    }
    this.refreshHud(); this.refreshWorkforce(); this.updateStandingHint();
  }

  // Auto-station: staff it with a fresh hire (only once the recipe is mastered);
  // tap a staffed station to send that worker home.
  tapAutoStation(i) {
    if (this.stall.autos[i]) {
      this.stall.autos[i] = null;
      this.autoProg[i] = null;
      this.flashHint('Sent a helper home — payroll is lighter');
    } else if (!trained(this.id)) {
      this.flashHint('Master the recipe first — cook every step by hand 👆');
      return;
    } else {
      if (G.coins < HIRE_COST) { this.flashHint('Need ' + HIRE_COST + ' 💰 to staff a station'); return; }
      G.coins -= HIRE_COST;
      this.stall.autos[i] = { emoji: nextWorkerEmoji() };
      this.flashHint(this.stall.autos[i].emoji + ' staffed an 🤖 auto-station — hands-free cooking!');
    }
    this.refreshHud(); this.refreshWorkforce(); this.updateStandingHint();
  }

  update(time, delta) {
    tickWages(delta);
    tickPassive(delta, this.id);     // other automated stalls keep earning while you're here
    this.tickLine(delta);            // player's manual line
    this.tickAutoStations(delta);    // helpers' hands-free stations
    this.trainTrainee(delta);        // the apprentice practices alongside you
    this.tickCustomers(delta);
    this.checkAutomationMilestone(time);
    this.drawHighlight(time);
    this.refreshHud();
  }

  // An apprentice in the trainee slot slowly practices the recipe on their own,
  // nudging the least-learned step toward mastery (your hand-crafting is faster).
  trainTrainee(delta) {
    if (!this.stall.trainee || trained(this.id)) return;
    const sid = this.recipe.steps.find(s => !isLearned(this.id, s));
    if (!sid) return;
    const before = trainOf(this.id, sid);
    this.stall.train[sid] = Math.min(1, before + delta / 1000 * TRAINEE_RATE);
    if (before < 1 && this.stall.train[sid] >= 1) {        // apprentice just finished mastering a step
      this.refreshWorkforce(); this.updateStandingHint();
    }
  }

  // Celebrate the first time a stall starts running itself, and point the way out.
  checkAutomationMilestone(time) {
    const now = isAutomated(this.id);
    if (now && !this.wasAutomated) {
      this.floatText(W/2, PREP_Y + 70, '🎉 It runs itself!', COL.green);
      this.flashHint('🎉 Automated! Tap along to earn even faster, or ← Market for another stall', 2800);
      this.guideBackUntil = time + 5000;
      G.taughtAutomate = true;       // teaching highlights stop nagging from here on
    }
    this.wasAutomated = now;
  }
}
function QUEUE_X() { return W/2; }

new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game',
  width: W, height: H,
  backgroundColor: hex(COL.cream),
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [Market, Stall],
});
</script>
