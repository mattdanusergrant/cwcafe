<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="CW Market" />
<title>CW Market — Prototype</title>
<style>
  html, body { margin: 0; padding: 0; background: #FAF4EA; height: 100%; overflow: hidden; }
  #game { width: 100vw; height: 100vh; }
  * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
</style>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
<div id="game"></div>
<script>
"use strict";

/* ============================================================================
   CW MARKET — a pop-up food market you automate stall by stall.

   Core loop (the heart of the game):
     hand-cook  →  train by repetition  →  automate, one step at a time.

   Every recipe is an ordered sequence of tap-steps (wrap → fill → boil).
   You make dishes by tapping each step. Each manual tap nudges that step's
   training meter; once a step is learned AND a helper is on the stall, the
   helper performs that step automatically — so you tap fewer and fewer steps
   until the line runs itself and the stall earns passively while you walk away
   to work another stall.

   Two scenes share one module-scope game state (G):
     • Market — a hub of stalls; tap one to step inside it.
     • Stall  — the cooking floor for one stall (steps, counter, queue, helper).
   ========================================================================== */

const W = 390, H = 844;
const COL = {
  cream:    0xFAF4EA,
  floor:    0xF3E7D3,
  floorAlt: 0xEEE0CA,
  wall:     0xC9B79A,
  counter:  0xB98B5E,
  card:     0xFFFFFF,
  red:      0xD64545,
  tan:      0xE8C39E,
  pink:     0xF2A6B3,
  green:    0x8FBF6F,
  blue:     0x6FA8C7,
  brown:    0x5A453B,
  dim:      0xB6A488,
  amber:    0xE0913B,
  btn:      0x7BA86B,
  btnOff:   0xC4BBA8,
};
const hex = c => '#' + c.toString(16).padStart(6, '0');
const FONT = 'system-ui,sans-serif';

// ---- Ingredients (a shared pantry; one stall draws from each today) ----
const INGREDIENTS = {
  dough: { emoji:'🌾', label:'Dough' },   // 🥟 dumplings
  tea:   { emoji:'🍵', label:'Tea'   },   // 🧋 boba
  broth: { emoji:'🍲', label:'Broth' },   // 🍜 noodles (future)
};

// ---- Steps: the shared library recipes are built from. Steps reused across
//      recipes (wrap, fill) share ONE training meter per stall — so unlocking a
//      recipe that reuses them leaves only the genuinely new step to learn. ----
const STEPS = {
  wrap:   { emoji:'🌾',  label:'Wrap',   ms:600 },
  fill:   { emoji:'🥩',  label:'Fill',   ms:600 },
  boil:   { emoji:'♨️',  label:'Boil',   ms:1000 },
  fry:    { emoji:'🍳',  label:'Fry',    ms:1100 },
  brew:   { emoji:'🍵',  label:'Brew',   ms:700 },
  pour:   { emoji:'🥛',  label:'Pour',   ms:600 },
  pearls: { emoji:'🟤',  label:'Pearls', ms:700 },
};

// ---- Recipes: an ordered list of step ids. A stall can switch between the
//      recipes it has unlocked (e.g. buying a pan unlocks pan-fried). ----
const RECIPES = {
  boiled:   { name:'Boiled',    emoji:'🥟', value:6,  steps:['wrap','fill','boil'] },
  panfried: { name:'Pan-fried', emoji:'🥟', value:11, steps:['wrap','fill','fry'] },
  milktea:  { name:'Milk Tea',  emoji:'🧋', value:8,  steps:['brew','pour','pearls'] },
};

// ---- Stalls: the market roster. Only the dumpling stall is enterable for now.
//   state: open / locked (buyable later) / soon.
//   recipe: the recipe available from the start.
//   unlock: an optional equipment purchase that adds a second recipe.
const STALLS = {
  dumpling: { name:'Dumpling Stall', emoji:'🥟', accent:COL.red,   ingredient:'dough', recipe:'boiled',  state:'open',
              unlock:{ recipe:'panfried', cost:250, equip:'🍳 Pan' } },
  boba:     { name:'Boba Stall',     emoji:'🧋', accent:COL.pink,  ingredient:'tea',   recipe:'milktea', state:'locked', cost:250 },
  noodle:   { name:'Noodle Stall',   emoji:'🍜', accent:COL.amber, ingredient:'broth', recipe:'noodlesoup', state:'soon' },
};
const STALL_ORDER = ['dumpling', 'boba', 'noodle'];

// ---- Economy / tuning ----
const START_COINS    = 60;    // a lean start — sell a few by hand (and clear quests) to afford your first hire
const START_STOCK    = 22;    // a smooth first training run (~15 dishes) before the first restock
const RESTOCK_AMOUNT = 20;    // units per restock
const RESTOCK_COST   = 20;    // coins per restock (below the per-dish margin)
const HIRE_COST      = 100;   // coins to hire an apprentice
const WAGE_PER_SEC   = 0.4;   // coins each helper costs per second
const TRAY_MAX       = 6;     // finished dishes a stall's pickup tray can hold (buffer for hand-cooking)
const BUFFER_CAP     = 3;     // items a between-step buffer holds before the upstream step blocks (upgradable)
const MANUAL_CD_MULT = 1.8;   // manual-button cooldown = step time x this (longer than a helper's cycle)
const QUEUE_MAX      = 4;     // customers that line up at a stall
const PATIENCE_MS    = 14000;
const SPAWN_MS       = 1500;  // customers arrive briskly, so pitching in by hand sells more & earns faster
const WORKER_EMOJIS  = ['🐱', '🐶', '🐰', '🐻', '🦊', '🐼', '🐯', '🐸'];

/* ============================================================================
   Game state (shared across scenes) + pure helpers
   ========================================================================== */
function makeStallState(id) {
  const def = STALLS[id].recipe;            // the recipe available from the start
  const nSteps = RECIPES[def] ? RECIPES[def].steps.length : 0;
  return {
    id,
    active: def,                            // the recipe this stall is currently making
    unlocked: def ? [def] : [],             // recipe keys this stall can switch between
    trainee: null,                          // apprentice being trained ({ worker })
    autos: new Array(nSteps).fill(null),    // one workstation per step; each holds a worker or null
    buf: new Array(Math.max(0, nSteps-1)).fill(0),   // items waiting between steps k and k+1
    bufCap: BUFFER_CAP,                     // buffer capacity (upgradable)
    served: 0,
    revenue: 0,
    acc: 0,                                 // fractional cycle progress for passive income
  };
}

// Each helper is an individual with their own profile + per-recipe mastery.
const NAMES  = ['Mochi','Pip','Suki','Bao','Yuki','Coco','Tofu','Miso','Nori','Yam'];
const SPEEDS = [1.0, 1.2, 0.9, 1.15, 1.3, 0.95, 1.1, 1.25];   // innate throughput multiplier
function makeWorker() {
  const i = G.workerSeq++;
  return { emoji: WORKER_EMOJIS[i % WORKER_EMOJIS.length], name: NAMES[i % NAMES.length],
           speed: SPEEDS[i % SPEEDS.length], mastery: {}, served: 0 };
}

const G = {
  coins: START_COINS,
  pantry: { dough: START_STOCK, tea: START_STOCK, broth: START_STOCK },
  wageBucket: 0,               // fractional wages owed
  workerSeq: 0,                // assigns each new helper their emoji/name/speed
  stalls: Object.fromEntries(STALL_ORDER.map(id => [id, makeStallState(id)])),
  firstCookDone: false,        // clears the opening "tap to cook" nudge
  taughtAutomate: false,       // true once the player automates their first stall — stops the teaching highlights
  taughtPan: false,            // true once the pan-fried unlock has been pointed out
  quest: 0,                    // index into QUESTS (the current tutorial goal)
  stats: { handMade: 0 },      // dishes the player has finished by hand (for quests)
};

// Sequential tutorial quests — each pays out a coin reward, bootstrapping the
// early game so you sell a few by hand, then fund your first hire and beyond.
const QUESTS = [
  { text:'Cook 3 dumplings by hand', reward:50, emoji:'🥟',
    prog:()=>({ n:Math.min(G.stats.handMade,3), of:3 }), done:()=>G.stats.handMade >= 3 },
  { text:'Hire your first apprentice', reward:60, emoji:'🐾',
    done:()=>G.workerSeq > 0 },
  { text:'Master a recipe (100%)', reward:80, emoji:'🎓',
    done:()=>STALL_ORDER.some(id => wTrained(G.stalls[id].trainee, id) || G.stalls[id].autos.some(Boolean)) },
  { text:'Staff a line station with a helper', reward:120, emoji:'🤖',
    done:()=>STALL_ORDER.some(id => G.stalls[id].autos.some(Boolean)) },
  { text:'Open the boba stall', reward:150, emoji:'🧋',
    done:()=>STALLS.boba.state === 'open' },
];
const currentQuest = () => G.quest < QUESTS.length ? QUESTS[G.quest] : null;
// If the current quest is satisfied, pay its reward, advance, and return it (for a toast).
function tryCompleteQuest() {
  const q = currentQuest();
  if (!q || !q.done()) return null;
  G.coins += q.reward;
  G.quest += 1;
  return q;
}

const recipeOf  = id => RECIPES[G.stalls[id].active];          // the stall's *active* recipe
const cycleMs   = id => recipeOf(id).steps.reduce((a, sid) => a + STEPS[sid].ms, 0);
// Each helper has a 0-100 mastery meter PER RECIPE. Hand-crafting while they're in
// the apprentice slot raises the active recipe's meter; at 100 they've mastered it
// and can be deployed to a slot to run that recipe hands-free.
const MASTER_MAX     = 100;
// Mastery is rolled with dice: 2d6 when the PLAYER works a station, 1d6 when a
// deployed HELPER does (learn by watching, slower on average).
const MASTER_DICE_TAP  = 2;   // d6 rolled per manual tap
const MASTER_DICE_AUTO = 1;   // d6 rolled per helper cycle
const rollDice = n => { let s = 0; for (let i = 0; i < n; i++) s += 1 + Math.floor(Math.random() * 6); return s; };
const wMastery   = (w, id) => (w && w.mastery[G.stalls[id].active]) || 0;
const wTrained   = (w, id) => wMastery(w, id) >= MASTER_MAX;        // mastered the active recipe
const wSpeed     = w => w.speed;                                    // innate auto-throughput
// The auto line: a slot runs only if its worker has mastered the ACTIVE recipe;
// the line produces finished dishes only when EVERY slot is staffed by such a worker.
const stepReady    = (id, k) => wTrained(G.stalls[id].autos[k], id);
const lineComplete = id => recipeOf(id).steps.every((sid, k) => stepReady(id, k));
// A helper's per-item time is the HIGHER of its speed-cycle and the manual cooldown.
const autoStepMs   = (id, sid, k) => Math.max(STEPS[sid].ms * MANUAL_CD_MULT, STEPS[sid].ms / wSpeed(G.stalls[id].autos[k]));
const lineCycle    = id => Math.max(...recipeOf(id).steps.map((sid, k) => autoStepMs(id, sid, k)));  // bottleneck (call only when complete)
const placedAt     = id => (G.stalls[id].trainee ? 1 : 0) + G.stalls[id].autos.filter(Boolean).length;
const workersAt    = placedAt;                                 // (kept name; used by the HUD)
const totalWorkers = () => STALL_ORDER.reduce((n, id) => n + placedAt(id), 0);
const isAutomated  = id => STALLS[id].state === 'open' && lineComplete(id);

// Continuous wage drain — coins never go negative (helpers simply work for free if broke).
function tickWages(dtMs) {
  const n = totalWorkers();
  if (n === 0) return;
  G.wageBucket += n * WAGE_PER_SEC * (dtMs / 1000);
  while (G.wageBucket >= 1 && G.coins > 0) { G.coins -= 1; G.wageBucket -= 1; }
  if (G.coins <= 0) G.wageBucket = 0;
}

// Passive income for automated stalls that aren't being hand-run right now — scaled
// by how many auto-stations are staffed. (The stall you're inside is driven by its
// scene's auto-stations instead, so we skip it here.)
function tickPassive(dtMs, exceptId) {
  for (const id of STALL_ORDER) {
    if (id === exceptId || !isAutomated(id)) continue;
    const ing = STALLS[id].ingredient;
    if (G.pantry[ing] <= 0) continue;
    const stall = G.stalls[id], cyc = lineCycle(id), val = recipeOf(id).value;
    stall.acc += dtMs;                          // a complete line yields one dish per bottleneck cycle
    while (stall.acc >= cyc && G.pantry[ing] > 0) {
      stall.acc -= cyc;
      G.pantry[ing] -= 1;
      G.coins += val; stall.served += 1; stall.revenue += val;
    }
  }
}

/* ============================================================================
   Shared UI bits
   ========================================================================== */
// A rounded button drawn from a rectangle (easy hit-testing) + centered label.
function makeButton(scene, x, y, w, h, fill, label, fontSize, depth) {
  const rect = scene.add.rectangle(x, y, w, h, fill).setStrokeStyle(2, COL.brown).setDepth(depth || 60);
  const txt = scene.add.text(x, y, label, { fontFamily:FONT, fontSize:(fontSize||'15px'), color:'#FFFFFF', fontStyle:'700' }).setOrigin(0.5).setDepth((depth||60)+1);
  return { x, y, w, h, rect, txt };
}
const inBox = (px, py, o, hw, hh) => px >= o.x-hw && px <= o.x+hw && py >= o.y-hh && py <= o.y+hh;
const hitBtn = (px, py, b) => inBox(px, py, b, b.w/2, b.h/2);

/* ============================================================================
   MARKET SCENE — the hub: tap a stall to step inside it
   ========================================================================== */
class Market extends Phaser.Scene {
  constructor() { super('market'); }

  create() {
    this.drawBackground();
    this.buildHud();

    this.add.text(W/2, 74, '🏮 CW Market', { fontFamily:FONT, fontSize:'26px', color:hex(COL.brown), fontStyle:'800' }).setOrigin(0.5).setDepth(5);

    // Quest banner: the current tutorial goal + its coin reward.
    this.qbBg = this.add.graphics().setDepth(4);
    this.qbTxt = this.add.text(W/2, 110, '', { fontFamily:FONT, fontSize:'13px', color:hex(COL.brown), fontStyle:'800', align:'center' }).setOrigin(0.5).setDepth(5);

    // One card per stall, stacked down the screen.
    this.cards = [];
    const top = 150, cardH = 184, gap = 16;
    STALL_ORDER.forEach((id, i) => this.cards.push(this.buildCard(id, top + i*(cardH+gap), cardH)));

    this.hintPill = this.makeHintPill();
    this.hl = this.add.graphics().setDepth(8);   // first-run nudge toward the dumpling stall
    this.input.on('pointerdown', p => this.handleTap(p.x, p.y));
    this.refreshHud();
    this.refreshCards();
    this.refreshQuestBanner();
  }

  refreshQuestBanner() {
    const q = currentQuest();
    this.qbBg.clear();
    if (!q) { this.qbTxt.setText(''); return; }
    const p = q.prog && q.prog();
    this.qbTxt.setText('📋 ' + q.text + ' ' + q.emoji + (p ? '  (' + p.n + '/' + p.of + ')' : '') + '   ·   +' + q.reward + '💰');
    const w = this.qbTxt.width + 26, h = 26;
    this.qbBg.fillStyle(COL.card, 0.96).fillRoundedRect(W/2-w/2, 110-h/2, w, h, 10);
    this.qbBg.lineStyle(2, COL.amber, 1).strokeRoundedRect(W/2-w/2, 110-h/2, w, h, 10);
  }

  // Pulse the dumpling ENTER button until the very first dish has been cooked.
  drawHighlight(time) {
    const g = this.hl; g.clear();
    if (G.firstCookDone) return;
    const c = this.cards.find(c => c.id === 'dumpling');
    if (!c || !c.btn.rect.visible) return;
    const b = c.btn, puls = 0.5 + 0.5 * Math.sin(time / 250);
    g.lineStyle(3 + 2*puls, COL.cream, 0.6 + 0.4*puls);
    g.strokeRoundedRect(b.x - b.w/2 - 2*puls, b.y - b.h/2 - 2*puls, b.w + 4*puls, b.h + 4*puls, 12);
  }

  drawBackground() {
    const g = this.add.graphics().setDepth(0);
    const t = 38;
    for (let yy = 0; yy < H; yy += t)
      for (let xx = 0; xx < W; xx += t) {
        const alt = (Math.floor(xx/t) + Math.floor(yy/t)) % 2 === 0;
        g.fillStyle(alt ? COL.floor : COL.floorAlt, 1).fillRect(xx, yy, t, t);
      }
  }

  buildHud() {
    this.add.rectangle(W/2, 24, W, 48, COL.brown).setDepth(50);
    this.coinLabel = this.add.text(12, 24, '', { fontFamily:FONT, fontSize:'21px', color:'#FAF4EA', fontStyle:'700' }).setOrigin(0,0.5).setDepth(51);
    this.statLabel = this.add.text(W-12, 24, '', { fontFamily:FONT, fontSize:'13px', color:'#FAF4EA' }).setOrigin(1,0.5).setDepth(51);
  }

  refreshHud() {
    this.coinLabel.setText('💰 ' + Math.floor(G.coins));
    const n = totalWorkers(), wage = n * WAGE_PER_SEC;
    const wageStr = n ? '   💸-' + (Number.isInteger(wage) ? wage : wage.toFixed(1)) + '/s' : '';
    this.statLabel.setText('🐾 ' + n + wageStr);
  }

  buildCard(id, y, h) {
    const cfg = STALLS[id], cx = W/2, cardW = 334, left = cx - cardW/2;
    const bg = this.add.graphics().setDepth(4);
    const emoji = this.add.text(left + 46, y + 52, cfg.emoji, { fontSize:'46px' }).setOrigin(0.5).setDepth(5);
    this.add.text(left + 84, y + 30, cfg.name, { fontFamily:FONT, fontSize:'19px', color:hex(COL.brown), fontStyle:'800' }).setOrigin(0,0.5).setDepth(5);
    const status = this.add.text(left + 84, y + 58, '', { fontFamily:FONT, fontSize:'12px', color:hex(COL.dim), fontStyle:'700', lineSpacing:3, wordWrap:{ width: cardW - 100 } }).setOrigin(0,0).setDepth(5);
    // One action button per card; its label/fill/visibility track the stall's state.
    const btn = makeButton(this, cx, y + h - 30, cardW - 28, 42, COL.btn, '', '16px', 6);
    return { id, cfg, y, h, left, cardW, bg, emoji, status, btn };
  }

  refreshCards() {
    for (const c of this.cards) {
      const cfg = c.cfg, open = cfg.state === 'open';
      c.bg.clear();
      c.bg.fillStyle(COL.card, open ? 1 : 0.9).fillRoundedRect(c.left, c.y, c.cardW, c.h, 18);
      c.bg.lineStyle(3, cfg.accent, open ? 1 : 0.5).strokeRoundedRect(c.left, c.y, c.cardW, c.h, 18);
      c.emoji.setAlpha(open ? 1 : 0.5);

      if (open) {
        const s = G.stalls[c.id], ing = cfg.ingredient, r = recipeOf(c.id);
        let txt;
        if (isAutomated(c.id)) {
          const rate = r.value / (lineCycle(c.id) / 1000);
          txt = (G.pantry[ing] > 0)
            ? '🤖 Assembly line running  ·  +' + rate.toFixed(1) + '/s\nServed ' + s.served + '   ·   ' + INGREDIENTS[ing].emoji + ' ' + G.pantry[ing] + ' left'
            : '⚠️ Out of ' + INGREDIENTS[ing].emoji + ' — step in to restock\nServed ' + s.served;
        } else if (s.autos.some(Boolean)) {
          const staffed = s.autos.filter(Boolean).length;
          txt = '🛠️ Line ' + staffed + '/' + r.steps.length + ' staffed — fill every station\nServed ' + s.served;
        } else if (s.trainee) {
          txt = '👩‍🍳 Training ' + s.trainee.name + ' · ' + Math.floor(wMastery(s.trainee, c.id)) + '%\nServed ' + s.served;
        } else {
          txt = (s.served > 0 ? 'Served ' + s.served + '  ·  ' : '') + 'Cook by hand 👆 to earn\nHire an apprentice to automate';
        }
        c.status.setText(txt);
        c.btn.txt.setText('ENTER  →'); c.btn.rect.setFillStyle(COL.btn).setVisible(true); c.btn.txt.setVisible(true);
      } else if (cfg.state === 'locked') {
        c.status.setText('A new stall to open up.\nIts own recipe to learn and automate.');
        const afford = G.coins >= cfg.cost;
        c.btn.txt.setText('🔓 Open  ·  ' + cfg.cost + ' 💰'); c.btn.rect.setFillStyle(afford ? COL.amber : COL.btnOff).setVisible(true); c.btn.txt.setVisible(true);
      } else {   // soon
        c.status.setText('Coming in a future update.');
        c.btn.rect.setVisible(false); c.btn.txt.setVisible(false);
      }
    }
  }

  makeHintPill() {
    const bg = this.add.graphics().setDepth(70);
    const txt = this.add.text(W/2, H-40, '', { fontFamily:FONT, fontSize:'13px', color:hex(COL.brown), fontStyle:'700', align:'center' }).setOrigin(0.5).setDepth(71);
    return { bg, txt, show:(m)=>{ txt.setText(m); const w=txt.width+26,h=txt.height+14; bg.clear(); bg.fillStyle(COL.card,0.96).fillRoundedRect(W/2-w/2,H-40-h/2,w,h,11); bg.lineStyle(2,COL.dim,1).strokeRoundedRect(W/2-w/2,H-40-h/2,w,h,11); this.time.delayedCall(1600,()=>{ if(txt.text===m){txt.setText('');bg.clear();} }); } };
  }

  handleTap(px, py) {
    // action buttons first (ENTER / Open)
    for (const c of this.cards) {
      if (!c.btn.rect.visible || !hitBtn(px, py, c.btn)) continue;
      if (c.cfg.state === 'open') this.scene.start('stall', { id: c.id });
      else if (c.cfg.state === 'locked') this.tryOpenStall(c);
      return;
    }
    // card-body taps: open → enter, locked/soon → explain
    const top = 150, cardH = 184, gap = 16;
    STALL_ORDER.forEach((id, i) => {
      const y = top + i*(cardH+gap);
      if (py >= y && py <= y + cardH) {
        const cfg = STALLS[id];
        if (cfg.state === 'open') this.scene.start('stall', { id });
        else if (cfg.state === 'locked') this.hintPill.show('Tap “Open” to start the ' + cfg.name + ' for ' + cfg.cost + ' 💰');
        else this.hintPill.show('🍜 Noodles are coming soon!');
      }
    });
  }

  // Open a locked stall for coins, then step straight inside to start cooking.
  tryOpenStall(c) {
    const cfg = c.cfg;
    if (G.coins < cfg.cost) { this.hintPill.show('Need ' + cfg.cost + ' 💰 to open the ' + cfg.name); return; }
    G.coins -= cfg.cost;
    cfg.state = 'open';                 // mutates STALLS[id].state — persists for the session
    this.refreshHud(); this.refreshCards();
    this.scene.start('stall', { id: c.id });
  }

  update(time, delta) {
    tickWages(delta);
    tickPassive(delta, null);   // every automated stall earns while you're in the market
    const q = tryCompleteQuest();
    if (q) this.hintPill.show('✅ ' + q.text + '  ·  +' + q.reward + '💰');
    this.refreshHud();
    this.refreshCards();
    this.refreshQuestBanner();
    this.drawHighlight(time);
  }
}

/* ============================================================================
   STALL SCENE — the cooking floor for one stall
   ========================================================================== */
const TRAINEE_Y = 150;   // apprentice slot (top, centered)
const LINE_Y    = 250;   // the production line: one manual button per step, buffers between
const SLOT_DY   = 50;    // a helper slot sits this far beneath each manual button
const TABS_Y    = 322;   // recipe selector tabs (dumpling only)
const TRAY_Y    = 374;   // finished dishes line the pickup tray
const COUNTER_Y = 416;   // the serving counter band
const QUEUE_Y   = [498, 556, 614, 672];   // front of line → back toward the door
const DOOR      = { x: W/2, y: 828 };
const TRAINEE   = { x: W/2, y: TRAINEE_Y };   // apprentice slot

class Stall extends Phaser.Scene {
  constructor() { super('stall'); }

  create(data) {
    this.id = data.id;
    this.cfg = STALLS[this.id];
    this.recipe = recipeOf(this.id);
    this.stall = G.stalls[this.id];
    // Phaser reuses the scene instance across visits but destroys its GameObjects on
    // shutdown — so null out persistent-once refs here, or buildLine's guard would
    // skip rebuilding the (now-dead) trainee UI and crash on re-entry.
    this.traineeDot = null;
    this.stations = null; this.slots = null; this.bufviews = null;

    this.tray = [];        // finished-dish tokens waiting on the pickup tray
    this.lineItems = this.stall.autos.map(() => null);   // per-workstation in-progress AUTO item ({prog}) or null
    this.customers = [];
    this.spawnAcc = SPAWN_MS * 0.4;
    this.wasAutomated = isAutomated(this.id);   // to detect the moment this stall first runs itself
    this.guideBackUntil = 0;                    // briefly highlight ← Market right after that moment

    this.drawRoom();
    this.buildHud();
    this.buildPantryChip();
    this.buildLine();      // workstations (one per step) + buffers + trainee slot
    this.buildTray();
    this.buildHintPill();
    this.buildRecipeTabs();
    this.hl = this.add.graphics().setDepth(69);   // pulsing "do this next" highlight
    this.refreshAll();

    this.input.on('pointerdown', p => this.handleTap(p.x, p.y));
  }

  // ---------------- First-run highlight ----------------
  // Returns a box {x,y,w,h} or circle {x,y,r} to pulse around the next useful
  // action — kept gentle and self-disabling once the player has learned the loop.
  highlightTarget(time) {
    if (time < this.guideBackUntil) return { x:this.backBtn.x, y:this.backBtn.y, w:this.backBtn.w+10, h:this.backBtn.h+10 };
    if (!G.taughtAutomate) {                                  // teach the core loop on the first stall only
      const w = this.stall.trainee;
      if (w && this.deployStep(w) >= 0) return { x:TRAINEE.x, y:TRAINEE.y, r:22 };  // a ready apprentice to deploy
      if (!w && G.coins >= HIRE_COST) return { x:TRAINEE.x, y:TRAINEE.y, r:22 };    // hire an apprentice
      const k = this.firstTappableStep();                    // otherwise nudge a step you can perform by hand
      if (k >= 0) { const st = this.stations[k]; return { x:st.x, y:st.y, w:st.w+8, h:st.h+8 }; }
    } else if (!G.taughtPan) {                               // one-time nudge toward the pan unlock
      const u = STALLS[this.id].unlock;
      if (u && !this.stall.unlocked.includes(u.recipe) && isAutomated(this.id) && G.coins >= u.cost) {
        const tab = this.recipeTabs.find(t => t.key === u.recipe);
        if (tab) return { x:tab.x, y:tab.y, w:tab.w+8, h:tab.h+8 };
      }
    }
    return null;
  }

  drawHighlight(time) {
    const g = this.hl; g.clear();
    const t = this.highlightTarget(time);
    if (!t) return;
    const puls = 0.5 + 0.5 * Math.sin(time / 250);
    g.lineStyle(3 + 2*puls, COL.btn, 0.4 + 0.5*puls);
    if (t.r) g.strokeCircle(t.x, t.y, t.r + 3*puls);
    else     g.strokeRoundedRect(t.x - t.w/2 - 2*puls, t.y - t.h/2 - 2*puls, t.w + 4*puls, t.h + 4*puls, 14);
  }

  // ---------------- Layout / room ----------------
  drawRoom() {
    const g = this.add.graphics().setDepth(0);
    const t = 38;
    for (let yy = 96; yy < H; yy += t)
      for (let xx = 0; xx < W; xx += t) {
        const alt = (Math.floor(xx/t) + Math.floor(yy/t)) % 2 === 0;
        g.fillStyle(alt ? COL.floor : COL.floorAlt, 1).fillRect(xx, yy, t, t);
      }
    g.fillStyle(COL.wall, 1);
    g.fillRect(0, 96, W, 8);
    g.fillRect(0, H-8, W, 8);
    g.fillStyle(COL.floor, 1).fillRect(DOOR.x-38, H-8, 76, 8);                       // doorway
    g.fillStyle(COL.counter, 1).fillRoundedRect(20, COUNTER_Y-13, W-40, 26, 8);      // serving counter
    this.add.text(W/2, COUNTER_Y+24, 'waiting line', { fontFamily:FONT, fontSize:'11px', color:hex(COL.dim) }).setOrigin(0.5).setDepth(2);
  }

  buildHud() {
    this.add.rectangle(W/2, 24, W, 48, this.cfg.accent).setDepth(50);
    this.coinLabel = this.add.text(12, 24, '', { fontFamily:FONT, fontSize:'21px', color:'#FFFFFF', fontStyle:'700' }).setOrigin(0,0.5).setDepth(51);
    this.statLabel = this.add.text(W-12, 24, '', { fontFamily:FONT, fontSize:'12px', color:'#FFFFFF' }).setOrigin(1,0.5).setDepth(51);

    // Back-to-market button + stall name on the sub-bar.
    this.add.rectangle(W/2, 72, W, 48, COL.cream).setDepth(50);
    this.backBtn = makeButton(this, 52, 72, 76, 34, COL.brown, '← Market', '13px', 51);
    this.add.text(W/2 + 6, 72, this.cfg.emoji + ' ' + this.cfg.name, { fontFamily:FONT, fontSize:'15px', color:hex(COL.brown), fontStyle:'800' }).setOrigin(0.5).setDepth(51);
  }

  // The stall's ingredient chip (top-right of the sub-bar): tap to restock.
  buildPantryChip() {
    const x = W - 60, y = 72;
    this.pantryChip = { x, y, w: 92, h: 34 };
    this.pantryChip.box = this.add.rectangle(x, y, 92, 34, COL.card).setStrokeStyle(2, COL.dim).setDepth(51);
    this.pantryChip.txt = this.add.text(x, y-6, '', { fontFamily:FONT, fontSize:'14px', color:hex(COL.brown), fontStyle:'700' }).setOrigin(0.5).setDepth(52);
    this.pantryChip.cap = this.add.text(x, y+9, '↺ ' + RESTOCK_COST + '💰', { fontFamily:FONT, fontSize:'9px', color:hex(COL.dim), fontStyle:'700' }).setOrigin(0.5).setDepth(52);
  }

  refreshPantryChip() {
    const ing = this.cfg.ingredient, stock = G.pantry[ing];
    let col = COL.brown; if (stock === 0) col = COL.red; else if (stock <= 3) col = COL.amber;
    this.pantryChip.txt.setText(INGREDIENTS[ing].emoji + ' ' + stock).setColor(hex(col));
    this.pantryChip.box.setStrokeStyle(2, stock === 0 ? COL.red : COL.dim);
  }

  // ---------------- Production line: a manual button per step + a helper slot beneath each ----------------
  buildLine() {
    if (this.stations) this.stations.forEach(s => s.cont.destroy());
    if (this.slots) this.slots.forEach(s => s.cont.destroy());
    if (this.bufviews) this.bufviews.forEach(b => b.cont.destroy());
    const n = this.recipe.steps.length;
    const x0 = 60, span = (W - 120);
    const xAt = i => n > 1 ? x0 + i*span/(n-1) : W/2;

    // Manual buttons (the player's stations) — always tappable, one per step.
    this.stations = this.recipe.steps.map((sid, i) => {
      const s = STEPS[sid], x = xAt(i), y = LINE_Y, w = 78, h = 70;
      const cont = this.add.container(x, y).setDepth(10);
      const bg = this.add.graphics();
      const emoji = this.add.text(0, -16, s.emoji, { fontSize:'26px' }).setOrigin(0.5);
      const label = this.add.text(0, 9, s.label, { fontFamily:FONT, fontSize:'12px', color:hex(COL.brown), fontStyle:'800' }).setOrigin(0.5);
      const cdg = this.add.graphics();   // cooldown overlay (after a manual tap)
      cont.add([bg, emoji, label, cdg]);
      return { i, sid, x, y, w, h, cont, bg, emoji, label, cdg, cd: 0, cdMax: STEPS[sid].ms * MANUAL_CD_MULT };
    });

    // Helper slots — beneath each button; a worker here automates that step in parallel with the player.
    this.slots = this.recipe.steps.map((sid, i) => {
      const x = xAt(i), y = LINE_Y + SLOT_DY, r = 15;
      const cont = this.add.container(x, y).setDepth(11);
      const ring = this.add.graphics();    // auto progress
      const dot  = this.add.circle(0, 0, r, COL.btnOff).setStrokeStyle(2, COL.dim);
      const face = this.add.text(0, 0, '', { fontSize:'15px' }).setOrigin(0.5);
      const lbl  = this.add.text(0, r+9, '', { fontFamily:FONT, fontSize:'8px', color:hex(COL.dim), fontStyle:'700' }).setOrigin(0.5);
      cont.add([ring, dot, face, lbl]);
      return { i, sid, x, y, r, cont, ring, dot, face, lbl };
    });

    // Buffer indicators between consecutive steps
    this.bufviews = [];
    for (let k = 0; k < n - 1; k++) {
      const mx = (xAt(k) + xAt(k+1)) / 2, cont = this.add.container(mx, LINE_Y).setDepth(10);
      const g = this.add.graphics();
      cont.add(g);
      this.bufviews.push({ k, cont, g });
    }

    // Trainee slot (apprentice) — masters the active recipe as you hand-craft.
    if (!this.traineeDot) {
      this.add.text(TRAINEE.x - 60, TRAINEE.y, '🎓', { fontSize:'15px' }).setOrigin(0.5).setDepth(11).setAlpha(0.6);
      this.traineeDot  = this.add.circle(TRAINEE.x, TRAINEE.y, 18, COL.btnOff).setStrokeStyle(2, this.cfg.accent).setDepth(11);
      this.traineeFace = this.add.text(TRAINEE.x, TRAINEE.y, '', { fontSize:'20px' }).setOrigin(0.5).setDepth(12);
      this.traineeLbl  = this.add.text(TRAINEE.x + 30, TRAINEE.y - 8, '', { fontFamily:FONT, fontSize:'10px', color:hex(COL.dim), fontStyle:'700' }).setOrigin(0, 0.5).setDepth(12);
      this.traineeXp   = this.add.graphics().setDepth(12);   // mastery meter for the active recipe
    }
  }

  // Draw the apprentice's 0-100 mastery meter for the stall's active recipe.
  drawTraineeXp() {
    const g = this.traineeXp; g.clear();
    const tw = this.stall.trainee;
    const bx = TRAINEE.x + 30, by = TRAINEE.y + 6, bw = 84, bh = 7;
    g.fillStyle(COL.cream, tw ? 1 : 0.35).fillRoundedRect(bx, by, bw, bh, 3);
    if (tw) { const p = wMastery(tw, this.id) / MASTER_MAX; g.fillStyle(wTrained(tw, this.id) ? COL.green : COL.amber, 1).fillRoundedRect(bx, by, bw*p, bh, 3); }
  }

  // The player's manual button for step i (always usable, even if a helper also works it).
  refreshStation(i) {
    const st = this.stations[i];
    const canDo = this.canPerform(i);
    st.bg.clear();
    st.bg.fillStyle(this.cfg.accent, canDo ? 0.16 : 0.07).fillRoundedRect(-st.w/2, -st.h/2, st.w, st.h, 12);
    st.bg.lineStyle(2.5, this.cfg.accent, canDo ? 1 : 0.5).strokeRoundedRect(-st.w/2, -st.h/2, st.w, st.h, 12);
  }

  // The helper slot beneath step i.
  refreshSlot(i) {
    const sl = this.slots[i], w = this.stall.autos[i];
    sl.face.setText(w ? w.emoji : '+');
    sl.dot.setFillStyle(w ? COL.tan : COL.btnOff).setStrokeStyle(2, w ? COL.blue : COL.dim);
    sl.lbl.setText(w ? w.name : 'helper').setColor(hex(w ? COL.blue : COL.dim));
  }

  // Draw helper auto-progress rings + buffer fill + manual cooldowns each frame.
  drawLine() {
    this.stations.forEach(st => {
      st.cdg.clear();
      if (st.cd <= 0) return;
      const p = st.cd / st.cdMax;                         // 1 just-tapped → 0 ready
      st.cdg.fillStyle(0x2A211B, 0.32).fillRoundedRect(-st.w/2, -st.h/2, st.w, st.h * p, 12);
    });
    this.slots.forEach(sl => {
      sl.ring.clear();
      const it = this.lineItems[sl.i];
      if (!it) return;
      sl.ring.lineStyle(3, COL.blue, 0.9);
      sl.ring.beginPath();
      sl.ring.arc(0, 0, sl.r + 3, -Math.PI/2, -Math.PI/2 + Phaser.Math.PI2 * Phaser.Math.Clamp(it.prog,0,1));
      sl.ring.strokePath();
    });
    this.bufviews.forEach(bv => {
      const cap = this.stall.bufCap, cnt = this.stall.buf[bv.k];
      bv.g.clear();
      const dw = 8, gap = 3, totalW = cap*dw + (cap-1)*gap, x0 = -totalW/2;
      for (let j = 0; j < cap; j++) {
        bv.g.fillStyle(j < cnt ? this.cfg.accent : COL.dim, j < cnt ? 1 : 0.3);
        bv.g.fillRoundedRect(x0 + j*(dw+gap), -5, dw, 10, 2);
      }
    });
  }

  // ---------------- Recipe tabs (switch recipe / buy equipment) ----------------
  // Shown only when a stall can hold more than one recipe (e.g. dumplings, once
  // the pan is bought). The second tab doubles as the equipment-purchase button.
  buildRecipeTabs() {
    const u = STALLS[this.id].unlock;
    this.recipeKeys = u ? [STALLS[this.id].recipe, u.recipe] : [STALLS[this.id].recipe];
    this.recipeTabs = [];
    if (this.recipeKeys.length < 2) return;            // nothing to switch between — no tabs
    const n = this.recipeKeys.length, tw = 156, gap = 10, y = TABS_Y;
    const startX = W/2 - ((n-1)*(tw+gap))/2;
    this.recipeKeys.forEach((key, i) => {
      const x = startX + i*(tw+gap);
      const bg  = this.add.graphics().setDepth(9);
      const txt = this.add.text(x, y, '', { fontFamily:FONT, fontSize:'12.5px', fontStyle:'800', align:'center' }).setOrigin(0.5).setDepth(10);
      this.recipeTabs.push({ key, x, y, w:tw, h:38, bg, txt });
    });
  }

  refreshRecipeTabs() {
    if (!this.recipeTabs) return;
    for (const tab of this.recipeTabs) {
      const r = RECIPES[tab.key];
      const unlocked = this.stall.unlocked.includes(tab.key);
      const active = this.stall.active === tab.key;
      const u = STALLS[this.id].unlock;
      tab.bg.clear();
      const x = tab.x - tab.w/2, y = tab.y - tab.h/2;
      if (!unlocked) {                                  // the locked recipe = buy-equipment button
        const afford = G.coins >= u.cost;
        tab.bg.fillStyle(afford ? COL.amber : COL.btnOff, afford ? 0.18 : 0.12).fillRoundedRect(x, y, tab.w, tab.h, 12);
        tab.bg.lineStyle(2.5, afford ? COL.amber : COL.dim, 1).strokeRoundedRect(x, y, tab.w, tab.h, 12);
        tab.txt.setText(u.equip + ' 🔒\nunlock ' + r.name + ' · ' + u.cost + '💰').setColor(hex(afford ? COL.brown : COL.dim));
      } else {
        const col = this.cfg.accent;
        tab.bg.fillStyle(col, active ? 0.22 : 0.08).fillRoundedRect(x, y, tab.w, tab.h, 12);
        tab.bg.lineStyle(active ? 3.5 : 2, col, active ? 1 : 0.6).strokeRoundedRect(x, y, tab.w, tab.h, 12);
        tab.txt.setText((active ? '▶ ' : '') + r.emoji + ' ' + r.name + '\n' + r.value + '💰 each').setColor(hex(COL.brown));
      }
    }
  }

  // Switch the stall to a different unlocked recipe. Shared steps keep their
  // training; only steps unique to the new recipe still need learning.
  setActiveRecipe(key) {
    if (this.stall.active === key || !this.stall.unlocked.includes(key)) return;
    this.stall.active = key;
    this.recipe = recipeOf(this.id);
    this.lineItems = this.stall.autos.map(() => null);   // steps changed — reset in-progress items
    this.buildLine();                                    // rebuild workstations for the new steps
    this.refreshAll();
  }

  tryBuyEquipment(key) {
    const u = STALLS[this.id].unlock;
    if (!u || u.recipe !== key) return;
    if (G.coins < u.cost) { this.flashHint('Need ' + u.cost + ' 💰 for the ' + u.equip); return; }
    G.coins -= u.cost;
    G.taughtPan = true;                                 // the unlock has been used — stop nudging it
    this.stall.unlocked.push(key);
    // the genuinely new step (not shared with the current recipe)
    const newStep = RECIPES[key].steps.find(sid => !this.recipe.steps.includes(sid)) || RECIPES[key].steps[RECIPES[key].steps.length-1];
    this.setActiveRecipe(key);                          // switch to the new recipe straight away
    this.flashHint(u.equip + ' bought! Your apprentice must learn the new ' + STEPS[newStep].emoji + ' ' + STEPS[newStep].label + ' step 👆', 2600);
  }

  // ---------------- Pickup tray ----------------
  buildTray() {
    const gap = 30, startX = W/2 - (TRAY_MAX-1)*gap/2;
    this.trayPlates = [];
    for (let i = 0; i < TRAY_MAX; i++) {
      const x = startX + i*gap;
      const plate = this.add.circle(x, TRAY_Y, 11, COL.btnOff).setStrokeStyle(2, this.cfg.accent).setDepth(8).setAlpha(0.35);
      const dish  = this.add.text(x, TRAY_Y, '', { fontSize:'17px' }).setOrigin(0.5).setDepth(9);
      this.trayPlates.push({ x, plate, dish });
    }
  }

  refreshTray() {
    this.trayPlates.forEach((p, i) => {
      const filled = i < this.tray.length;
      p.dish.setText(filled ? this.recipe.emoji : '');
      p.plate.setAlpha(filled ? 1 : 0.35);
    });
  }

  // Refresh the trainee slot + every workstation.
  refreshWorkforce() {
    const tw = this.stall.trainee;
    if (tw) {
      const ready = wTrained(tw, this.id);
      this.traineeDot.setFillStyle(COL.tan);
      this.traineeFace.setText(tw.emoji);
      this.traineeLbl.setText(tw.name + '  ' + Math.floor(wMastery(tw, this.id)) + '%' + (ready ? ' ✓ deploy' : '')).setColor(hex(ready ? COL.green : COL.dim));
    } else {
      this.traineeDot.setFillStyle(COL.btnOff);
      this.traineeFace.setText('');
      this.traineeLbl.setText('+ apprentice ' + HIRE_COST + '💰').setColor(hex(COL.dim));
    }
    this.drawTraineeXp();
    this.stations.forEach((_, i) => this.refreshStation(i));
    this.slots.forEach((_, i) => this.refreshSlot(i));
  }

  // ---------------- HUD / hint ----------------
  refreshHud() {
    this.coinLabel.setText('💰 ' + Math.floor(G.coins));
    this.statLabel.setText('Served ' + this.stall.served + '   🐾' + workersAt(this.id));
  }

  buildHintPill() {
    this.hintBg = this.add.graphics().setDepth(70);
    this.hintTxt = this.add.text(W/2, 116, '', { fontFamily:FONT, fontSize:'13px', color:hex(COL.brown), fontStyle:'700', align:'center', wordWrap:{ width: 320 } }).setOrigin(0.5).setDepth(71);
  }

  setHint(msg) {
    this.hintTxt.setText(msg || '');
    this.hintBg.clear();
    if (msg) {
      const w = this.hintTxt.width + 24, h = this.hintTxt.height + 14;
      this.hintBg.fillStyle(COL.card, 0.96).fillRoundedRect(W/2-w/2, 116-h/2, w, h, 11);
      this.hintBg.lineStyle(2, COL.dim, 1).strokeRoundedRect(W/2-w/2, 116-h/2, w, h, 11);
    }
  }

  flashHint(msg, ms = 1500) {
    this.setHint(msg);
    this.time.delayedCall(ms, () => { if (this.hintTxt.text === msg) this.updateStandingHint(); });
  }

  // The standing instruction shown when nothing transient is up. While a tutorial
  // quest is active it doubles as the quest tracker (goal + reward).
  updateStandingHint() {
    const q = currentQuest();
    if (q) {
      const p = q.prog && q.prog();
      this.setHint('📋 ' + q.text + ' ' + q.emoji + (p ? ' (' + p.n + '/' + p.of + ')' : '') + '   ·   +' + q.reward + '💰');
      return;
    }
    const first = STEPS[this.recipe.steps[0]];
    const u = STALLS[this.id].unlock;
    const panBuyable = u && !this.stall.unlocked.includes(u.recipe);
    const w = this.stall.trainee;
    const staffed = this.stall.autos.filter(Boolean).length, n = this.recipe.steps.length;
    if (!G.firstCookDone)
      this.setHint('👆 Tap ' + first.emoji + ' ' + first.label + ', then the rest, to make a ' + this.recipe.emoji + ' by hand');
    else if (!w && placedAt(this.id) === 0 && G.coins < HIRE_COST)
      this.setHint('Sell a few by hand, then hire an apprentice 🐾 (' + HIRE_COST + '💰) to train');
    else if (w && wTrained(w, this.id))
      this.setHint('🎓 ' + w.name + ' has mastered this recipe — tap a helper slot to deploy them 🤖');
    else if (w)
      this.setHint('Tap any step to raise ' + w.name + '’s mastery — reach 100% to deploy them 🐾');
    else if (isAutomated(this.id) && panBuyable && G.coins >= u.cost)
      this.setHint('Buy the ' + u.equip + ' to unlock ' + RECIPES[u.recipe].name + ' ' + RECIPES[u.recipe].emoji + '!');
    else if (isAutomated(this.id))
      this.setHint('🤖 The whole line is automated! Tap by hand for extra, or ← Market');
    else if (staffed > 0)
      this.setHint('Line ' + staffed + '/' + n + ' automated — tap the rest by hand, or train helpers for them 🤖');
    else
      this.setHint('Hire an apprentice 🐾 — master the recipe by hand-crafting, then deploy them');
  }

  refreshAll() {
    this.refreshHud();
    this.refreshPantryChip();
    this.refreshTray();
    this.refreshWorkforce();
    this.refreshRecipeTabs();
    this.updateStandingHint();
  }

  // ---------------- Production line: buffered, per-step ----------------
  // Step k draws from its input (pantry for step 0, else the buffer after step k-1)
  // and pushes to its output (the buffer after step k, or the tray for the last step).
  inputAvail(k)  { return k === 0 ? G.pantry[this.cfg.ingredient] > 0 : this.stall.buf[k-1] > 0; }
  outputRoom(k)  { return k === this.recipe.steps.length - 1 ? this.tray.length < TRAY_MAX : this.stall.buf[k] < this.stall.bufCap; }
  canPerform(k)  { return this.inputAvail(k) && this.outputRoom(k); }
  consumeInput(k){ if (k === 0) { G.pantry[this.cfg.ingredient] -= 1; this.refreshPantryChip(); } else this.stall.buf[k-1] -= 1; }
  // Push step k's output; returns false only if the tray was full at the last step.
  pushOutput(k, fromX, fromY) {
    if (k === this.recipe.steps.length - 1) return this.addDishToTray(fromX, fromY);
    this.stall.buf[k] += 1; return true;
  }

  // First step the player can perform by hand right now (un-automated, input+room).
  firstTappableStep() {
    for (let k = 0; k < this.recipe.steps.length; k++)
      if (!this.stall.autos[k] && this.canPerform(k)) return k;
    return -1;
  }
  // First open slot a mastered worker can take (any step of the active recipe), or -1.
  deployStep(w) {
    if (!wTrained(w, this.id)) return -1;
    for (let k = 0; k < this.recipe.steps.length; k++) if (!this.stall.autos[k]) return k;
    return -1;
  }

  // Player taps a manual workstation: perform one cycle + raise the apprentice's mastery.
  // Each button then cools down (a bit longer than the step's natural time) so it
  // can't be spammed; other stations stay independent, so you juggle the line.
  performManual(k) {
    const st = this.stations[k];
    if (st.cd > 0) return;                                // still cooling down
    if (!this.inputAvail(k)) { this.flashHint(k === 0 ? 'Out of ' + INGREDIENTS[this.cfg.ingredient].emoji + ' — tap the chip to restock' : 'Nothing waiting — do ' + STEPS[this.recipe.steps[k-1]].label + ' first 👈'); return; }
    if (!this.outputRoom(k)) { this.flashHint(STEPS[this.recipe.steps[k]].label + ' buffer is full — clear it downstream 👉'); return; }
    this.consumeInput(k);
    this.pushOutput(k, st.x, st.y);
    st.cd = st.cdMax;                                     // start this button's own cooldown
    this.gainMastery(rollDice(MASTER_DICE_TAP));          // the slot apprentice learns from your work (2d6)
    if (k === this.recipe.steps.length - 1) G.stats.handMade += 1;   // a hand-finished dish (for the quest)
    if (!G.firstCookDone) { G.firstCookDone = true; this.flashHint('Nice — a ' + this.recipe.emoji + '! Sell a few, then hire an apprentice 🐾 to train', 2600); }
    this.refreshWorkforce(); this.refreshHud();
  }

  // The apprentice in the trainee slot masters the active recipe whenever ANY station
  // is worked — by the player OR by a deployed helper — so helpers train each other.
  // Floats the rolled amount so the RNG is visible.
  gainMastery(amount) {
    const w = this.stall.trainee;
    if (!w) return;
    const key = this.stall.active, before = wMastery(w, this.id);
    if (before >= MASTER_MAX) return;
    w.mastery[key] = Math.min(MASTER_MAX, before + amount);
    this.floatText(TRAINEE.x + 70, TRAINEE.y - 16, '+' + amount, COL.amber);   // show the roll
    if (w.mastery[key] >= MASTER_MAX) {
      this.floatText(TRAINEE.x, TRAINEE.y - 26, '⭐ Mastered!', COL.green);
      this.flashHint('🎓 ' + w.name + ' mastered ' + this.recipe.name + ' — tap a slot to deploy them', 2400);
    }
  }

  // Add one finished dish to the shared tray (returns false if it's full).
  addDishToTray(fromX, fromY) {
    if (this.tray.length >= TRAY_MAX) return false;
    this.tray.push(true);
    const plate = this.trayPlates[this.tray.length - 1];
    const fly = this.add.text(fromX, fromY, this.recipe.emoji, { fontSize:'22px' }).setOrigin(0.5).setDepth(30);
    this.tweens.add({ targets: fly, x: plate.x, y: TRAY_Y, duration: 260, ease:'Quad.Out', onComplete: () => { fly.destroy(); this.refreshTray(); } });
    return true;
  }

  // Auto workstations advance on a timer (speed-scaled) and move items through the
  // buffers. A station only runs if its worker has mastered its step. Processed
  // high→low so a freed buffer slot isn't double-filled in one frame.
  tickAutoStations(delta) {
    const steps = this.recipe.steps;
    const ready = k => wTrained(this.stall.autos[k], this.id);
    for (let k = steps.length - 1; k >= 0; k--) {
      if (!ready(k)) continue;
      const st = this.stations[k];
      let it = this.lineItems[k];
      if (it && it.prog >= 1) {                            // finished — push output if there's room
        if (this.outputRoom(k)) { this.pushOutput(k, st.x, st.y); this.stall.autos[k].served += 1; this.lineItems[k] = it = null;
                                  this.gainMastery(rollDice(MASTER_DICE_AUTO)); }   // slot apprentice learns by watching (1d6)
      }
      if (!it) {                                           // idle — start a new item if possible
        if (this.inputAvail(k) && this.outputRoom(k)) { this.consumeInput(k); this.lineItems[k] = it = { prog: 0 }; }
      }
      // a helper's cycle respects the HIGHER of its own speed-cycle and the manual cooldown
      const cyc = Math.max(st.cdMax, STEPS[steps[k]].ms / wSpeed(this.stall.autos[k]));
      if (it && it.prog < 1) it.prog = Math.min(1, it.prog + delta / cyc);
    }
    this.drawLine();
  }

  // ---------------- Customers ----------------
  spawnCustomer() {
    if (this.customers.length >= QUEUE_MAX) return;
    const idx = this.customers.length;
    const cont = this.add.container(DOOR.x, DOOR.y).setDepth(20);
    cont.add(this.add.circle(0, 0, 22, COL.card).setStrokeStyle(3, COL.dim));
    cont.add(this.add.text(0, 0, '🙂', { fontSize:'22px' }).setOrigin(0.5));
    cont.add(this.add.circle(0, -42, 16, COL.cream).setStrokeStyle(2, COL.dim));
    const bubble = this.add.text(0, -42, this.recipe.emoji, { fontSize:'18px' }).setOrigin(0.5);
    const patBar = this.add.graphics();
    cont.add([bubble, patBar]);
    const cu = { cont, bubble, patBar, patience: PATIENCE_MS, state:'walking' };
    this.customers.push(cu);
    this.tweens.add({ targets: cont, x: QUEUE_X(), y: QUEUE_Y[idx], duration: 700, ease:'Sine.InOut', onComplete: () => { if (cu.state === 'walking') cu.state = 'waiting'; } });
  }

  layoutQueue() {
    this.customers.forEach((cu, i) => {
      if (cu.state === 'leaving') return;
      this.tweens.add({ targets: cu.cont, x: QUEUE_X(), y: QUEUE_Y[Math.min(i, QUEUE_Y.length-1)], duration: 250, ease:'Sine.Out' });
    });
  }

  drawPatience(cu) {
    const bw = 42, bh = 6, bx = -bw/2, by = -24;
    const p = cu.patience / PATIENCE_MS;
    let c = COL.green; if (p < 0.5) c = COL.tan; if (p < 0.25) c = COL.red;
    cu.patBar.clear();
    cu.patBar.fillStyle(COL.cream, 1).fillRoundedRect(bx, by, bw, bh, 3);
    cu.patBar.fillStyle(c, 1).fillRoundedRect(bx, by, bw*Phaser.Math.Clamp(p,0,1), bh, 3);
  }

  serveFront() {
    const cu = this.customers.find(c => c.state === 'waiting');
    if (!cu) return;
    this.tray.pop(); this.refreshTray();
    cu.state = 'leaving';
    cu.patBar.clear();
    cu.bubble.setText('💛');
    const val = this.recipe.value;
    // a dish flies from the tray to the guest, then pays out
    const src = this.trayPlates[this.tray.length] || this.trayPlates[0];
    const fly = this.add.text(src.x, TRAY_Y, this.recipe.emoji, { fontSize:'20px' }).setOrigin(0.5).setDepth(35);
    this.tweens.add({ targets: fly, x: cu.cont.x, y: cu.cont.y, duration: 260, ease:'Quad.Out', onComplete: () => {
      fly.destroy();
      G.coins += val; this.stall.served += 1; this.stall.revenue += val;
      this.floatText(cu.cont.x, cu.cont.y - 30, '+' + val + ' 💰', COL.green);
      this.refreshHud();
    }});
    this.tweens.add({ targets: cu.cont, x: DOOR.x, y: DOOR.y + 40, alpha: 0, duration: 800, delay: 120, ease:'Sine.In', onComplete: () => {
      cu.cont.destroy();
      this.customers = this.customers.filter(c => c !== cu);
      this.layoutQueue();
    }});
  }

  tickCustomers(delta) {
    this.spawnAcc += delta;
    if (this.spawnAcc >= SPAWN_MS) { this.spawnAcc = 0; this.spawnCustomer(); }
    // serve as many fronts as we have tray dishes
    while (this.tray.length > 0 && this.customers.some(c => c.state === 'waiting')) this.serveFront();
    for (const cu of [...this.customers]) {
      if (cu.state !== 'waiting') continue;
      cu.patience -= delta;
      if (cu.patience <= 0) {
        cu.state = 'leaving'; cu.bubble.setText('💨'); cu.patBar.clear();
        this.tweens.add({ targets: cu.cont, x: DOOR.x, y: DOOR.y + 40, alpha: 0, duration: 700, ease:'Sine.In', onComplete: () => {
          cu.cont.destroy(); this.customers = this.customers.filter(c => c !== cu); this.layoutQueue();
        }});
      } else this.drawPatience(cu);
    }
  }

  floatText(x, y, str, color) {
    const t = this.add.text(x, y, str, { fontFamily:FONT, fontSize:'19px', color:hex(color), fontStyle:'700' }).setOrigin(0.5).setDepth(45);
    this.tweens.add({ targets:t, y:y-42, alpha:0, duration:800, ease:'Quad.Out', onComplete:()=>t.destroy() });
  }

  // ---------------- Input ----------------
  handleTap(px, py) {
    if (hitBtn(px, py, this.backBtn)) { this.scene.start('market'); return; }
    if (inBox(px, py, this.pantryChip, this.pantryChip.w/2, this.pantryChip.h/2)) { this.doRestock(); return; }
    // trainee slot: hire an apprentice, or (once ready) deploy them to a station
    if (inBox(px, py, TRAINEE, 24, 24)) { this.tapTrainee(); return; }
    // recipe tabs: select an unlocked recipe, or buy the equipment that unlocks it
    for (const tab of this.recipeTabs) {
      if (!inBox(px, py, tab, tab.w/2, tab.h/2)) continue;
      if (this.stall.unlocked.includes(tab.key)) {
        this.setActiveRecipe(tab.key);
        this.flashHint('Now making ' + RECIPES[tab.key].emoji + ' ' + RECIPES[tab.key].name);
      } else {
        this.tryBuyEquipment(tab.key);
      }
      return;
    }
    // a helper slot (beneath a button): deploy a ready apprentice, or show the worker's profile
    for (const sl of this.slots) {
      if (Math.abs(px - sl.x) > 24 || Math.abs(py - sl.y) > 24) continue;
      this.tapSlot(sl.i);
      return;
    }
    // a manual button: the player performs that step by hand (always available)
    for (const st of this.stations) {
      if (!inBox(px, py, st, st.w/2, st.h/2)) continue;
      this.performManual(st.i);
      return;
    }
  }

  // Helper slot beneath step i: deploy a mastered apprentice here, or show the worker's profile.
  tapSlot(i) {
    const w = this.stall.autos[i];
    if (w) { this.flashHint('🤖 ' + w.emoji + ' ' + w.name + '  ·  ' + Math.floor(wMastery(w, this.id)) + '%  ·  ⚡' + wSpeed(w).toFixed(2) + 'x  ·  made ' + w.served); return; }
    const tw = this.stall.trainee;
    if (tw && wTrained(tw, this.id)) this.deployTo(i, tw);
    else this.flashHint('Master this recipe (100%) with an apprentice in the slot, then deploy here 🐾');
    this.refreshHud(); this.refreshWorkforce(); this.updateStandingHint();
  }

  doRestock() {
    if (G.coins < RESTOCK_COST) { this.flashHint('Need ' + RESTOCK_COST + ' 💰 to restock'); return; }
    G.coins -= RESTOCK_COST;
    G.pantry[this.cfg.ingredient] += RESTOCK_AMOUNT;
    this.refreshHud(); this.refreshPantryChip();
    this.flashHint('Restocked ' + INGREDIENTS[this.cfg.ingredient].emoji + ' +' + RESTOCK_AMOUNT);
  }

  // Trainee slot: hire an apprentice when empty; once they've mastered the recipe,
  // tap the ready apprentice to deploy them (free) onto the first open line station.
  tapTrainee() {
    const tw = this.stall.trainee;
    if (!tw) {
      if (G.coins < HIRE_COST) { this.flashHint('Need ' + HIRE_COST + ' 💰 to hire an apprentice'); return; }
      G.coins -= HIRE_COST;
      const w = makeWorker();
      this.stall.trainee = w;
      this.flashHint('Hired ' + w.emoji + ' ' + w.name + '! Craft by hand to train them (⚡' + w.speed + 'x)');
    } else {
      const k = this.deployStep(tw);                      // first open station whose step they've mastered
      if (k >= 0) this.deployTo(k, tw);
      else this.flashHint(tw.name + ' is still learning — hand-craft a step to mastery');
    }
    this.refreshHud(); this.refreshWorkforce(); this.updateStandingHint();
  }

  // Move the apprentice onto line station `i`. Returns false if invalid.
  deployTo(i, w) {
    if (i < 0) return false;
    this.stall.autos[i] = w;
    this.stall.trainee = null;
    this.lineItems[i] = null;
    this.flashHint(w.emoji + ' ' + w.name + ' took the ' + STEPS[this.recipe.steps[i]].label + ' station 🤖');
    return true;
  }

  update(time, delta) {
    tickWages(delta);
    tickPassive(delta, this.id);     // other automated stalls keep earning while you're here
    this.stations.forEach(st => { if (st.cd > 0) st.cd = Math.max(0, st.cd - delta); });   // manual button cooldowns
    this.tickAutoStations(delta);    // staffed workstations advance + move items through buffers
    this.tickCustomers(delta);
    this.checkQuest();
    this.checkAutomationMilestone(time);
    this.drawHighlight(time);
    this.refreshHud();
  }

  checkQuest() {
    const q = tryCompleteQuest();
    if (!q) return;
    this.floatText(W/2, 150, '✅ +' + q.reward + ' 💰', COL.green);
    this.flashHint('✅ Quest done: ' + q.text + '  ·  +' + q.reward + '💰', 2600);
    this.refreshHud();
  }

  // Celebrate the first time a stall starts running itself, and point the way out.
  checkAutomationMilestone(time) {
    const now = isAutomated(this.id);
    if (now && !this.wasAutomated) {
      this.floatText(W/2, LINE_Y + 70, '🎉 Line automated!', COL.green);
      this.flashHint('🎉 A helper is cooking hands-free! Keep crafting by hand, or ← Market for another stall', 2800);
      this.guideBackUntil = time + 5000;
      G.taughtAutomate = true;       // teaching highlights stop nagging from here on
    }
    this.wasAutomated = now;
  }
}
function QUEUE_X() { return W/2; }

new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game',
  width: W, height: H,
  backgroundColor: hex(COL.cream),
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [Market, Stall],
});
</script>
</body>
</html>
