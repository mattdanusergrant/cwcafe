<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

<title>CW Market — Prototype</title>
<style>
  html, body { margin: 0; padding: 0; background: #FAF4EA; height: 100%; overflow: hidden; }
  #game { width: 100vw; height: 100vh; }
  * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

<body>
<div id="game"></div>
<script>
"use strict";

/* ============================================================================
   CW MARKET — a pop-up food market you automate stall by stall.

   Core loop (the heart of the game):
     hand-cook  →  train by repetition  →  automate, one step at a time.

   Every recipe is an ordered sequence of tap-steps (wrap → fill → boil).
   You make dishes by tapping each step. Each manual tap nudges that step's
   training meter; once a step is learned AND a helper is on the stall, the
   helper performs that step automatically — so you tap fewer and fewer steps
   until the line runs itself and the stall earns passively while you walk away
   to work another stall.

   Two scenes share one module-scope game state (G):
     • Market — a hub of stalls; tap one to step inside it.
     • Stall  — the cooking floor for one stall (steps, counter, queue, helper).
   ========================================================================== */

const W = 390, H = 844;
const COL = {
  cream:    0xFAF4EA,
  floor:    0xF3E7D3,
  floorAlt: 0xEEE0CA,
  wall:     0xC9B79A,
  counter:  0xB98B5E,
  card:     0xFFFFFF,
  red:      0xD64545,
  tan:      0xE8C39E,
  pink:     0xF2A6B3,
  green:    0x8FBF6F,
  blue:     0x6FA8C7,
  brown:    0x5A453B,
  dim:      0xB6A488,
  amber:    0xE0913B,
  btn:      0x7BA86B,
  btnOff:   0xC4BBA8,
};
const hex = c => '#' + c.toString(16).padStart(6, '0');
const FONT = 'system-ui,sans-serif';

// ---- Ingredients (a shared pantry; one stall draws from each today) ----
const INGREDIENTS = {
  dough: { emoji:'🌾', label:'Dough' },   // 🥟 dumplings
  tea:   { emoji:'🍵', label:'Tea'   },   // 🧋 boba
  broth: { emoji:'🍲', label:'Broth' },   // 🍜 noodles (future)
  cloth: { emoji:'🧵', label:'Cloth' },   // 🧦 PJ stall
};

// ---- Steps: the shared library recipes are built from. Steps reused across
//      recipes (wrap, fill) share ONE training meter per stall — so unlocking a
//      recipe that reuses them leaves only the genuinely new step to learn. ----
const STEPS = {
  wrap:   { emoji:'🌾',  label:'Wrap',   ms:600 },
  fill:   { emoji:'🥩',  label:'Fill',   ms:600 },
  boil:   { emoji:'♨️',  label:'Boil',   ms:1000 },
  fry:    { emoji:'🍳',  label:'Fry',    ms:1100 },
  brew:   { emoji:'🍵',  label:'Brew',   ms:700 },
  pour:   { emoji:'🥛',  label:'Pour',   ms:600 },
  pearls: { emoji:'🟤',  label:'Pearls', ms:700 },
  cut:    { emoji:'✂️',  label:'Cut',    ms:700 },   // 🧦 PJ stall
  sew:    { emoji:'🪡',  label:'Sew',    ms:900 },
  fold:   { emoji:'📦',  label:'Fold',   ms:600 },
};

// ---- Recipes: an ordered list of step ids. A stall can switch between the
//      recipes it has unlocked (e.g. buying a pan unlocks pan-fried). ----
const RECIPES = {
  boiled:   { name:'Boiled',    emoji:'🥟', value:6,  steps:['wrap','fill','boil'] },
  panfried: { name:'Pan-fried', emoji:'🥟', value:11, steps:['wrap','fill','fry'] },
  milktea:  { name:'Milk Tea',  emoji:'🧋', value:8,  steps:['brew','pour','pearls'] },
  pajamas:  { name:'Pajamas',   emoji:'🧦', value:10, steps:['cut','sew','fold'] },
  noodlesoup:{ name:'Noodle Soup', emoji:'🍜', value:9, steps:['boil','fill','pour'] },
};

// ---- Stalls: the market roster. Only the dumpling stall is enterable for now.
//   state: open / locked (buyable later) / soon.
//   recipe: the recipe available from the start.
//   unlock: an optional equipment purchase that adds a second recipe.
const STALLS = {
  // 🧦 PJ Stall is your home base / HQ — the starting stall where the tutorial runs.
  pj:       { name:'PJ Workshop (HQ)', emoji:'🧦', accent:COL.blue,  ingredient:'cloth', recipe:'pajamas', state:'open', hq:true },
  dumpling: { name:'Dumpling Stall', emoji:'🥟', accent:COL.red,   ingredient:'dough', recipe:'boiled',  state:'locked', cost:150,
              unlock:{ recipe:'panfried', cost:250, equip:'🍳 Pan' } },
  boba:     { name:'Boba Stall',     emoji:'🧋', accent:COL.pink,  ingredient:'tea',   recipe:'milktea', state:'locked', cost:250 },
  noodle:   { name:'Noodle Stall',   emoji:'🍜', accent:COL.amber, ingredient:'broth', recipe:'noodlesoup', state:'locked', cost:500 },
};
// Corner order for the crossroads: TL, TR, BL, BR — HQ first (top-left).
const STALL_ORDER = ['pj', 'dumpling', 'boba', 'noodle'];

// ---- Economy / tuning ----
const START_COINS    = 60;    // lean start — the cook quest reward then funds the forced first hire
const START_STOCK    = 20;    // enough to reach "both crafting" (steps 1-4); then it runs dry in step 5
const RESTOCK_AMOUNT = 100;   // BASE units per restock (Bulk Supply upgrade adds more)
const RESTOCK_COST   = 100;   // coins per restock (a real moment: 1 coin / unit)
const HIRE_COST      = 100;   // coins to hire an apprentice
const WAGE_PER_SEC   = 0.4;   // coins each helper costs per second
const TRAY_MAX       = 6;     // finished dishes a stall's pickup tray can hold (buffer for hand-cooking)
const BUFFER_CAP     = 3;     // items a between-step buffer holds before the upstream step blocks (upgradable)
const MANUAL_CD_MULT = 1.8;   // manual-button cooldown = step time x this (longer than a helper's cycle)
const QUEUE_MAX      = 4;     // customers that line up at a stall
const PATIENCE_MS    = 14000;
// Customers roam the market and, from time to time, wander into a stall. EACH open
// stall draws customers on its own independent timer, so opening more stalls brings
// more total customers (without slowing the ones you already have).
const ENTER_MS       = 3000;  // BASE: a customer enters EACH open stall this often (Market Buzz lowers it)

// ---- Market Board: HQ-bought, market-wide upgrades (effect every stall) ----
const MARKET_UPGRADES = {
  bulk: { emoji:'📦', name:'Bulk Supply', desc:'+50 supply per restock',
          base:200, max:4, effect:lv => RESTOCK_AMOUNT + 50*lv },          // restock amount
  buzz: { emoji:'📣', name:'Market Buzz', desc:'customers arrive faster',
          base:250, max:4, effect:lv => Math.round(ENTER_MS * Math.pow(0.85, lv)) },  // enter interval (ms)
};
const upLevel  = key => (G.upgrades[key] || 0);
const upCost   = key => Math.round(MARKET_UPGRADES[key].base * Math.pow(1.8, upLevel(key)));
const upMaxed  = key => upLevel(key) >= MARKET_UPGRADES[key].max;
// Live, upgrade-aware values used by the rest of the game:
const restockAmount = () => MARKET_UPGRADES.bulk.effect(upLevel('bulk'));
const enterMs       = () => MARKET_UPGRADES.buzz.effect(upLevel('buzz'));
const MARKET_ROAMERS = 6;     // how many customers wander the crossroads (visual)
const WORKER_EMOJIS  = ['🐱', '🐶', '🐰', '🐻', '🦊', '🐼', '🐯', '🐸'];

/* ============================================================================
   Game state (shared across scenes) + pure helpers
   ========================================================================== */
function makeStallState(id) {
  const def = STALLS[id].recipe;            // the recipe available from the start
  const nSteps = RECIPES[def] ? RECIPES[def].steps.length : 0;
  return {
    id,
    active: def,                            // the recipe this stall is currently making
    unlocked: def ? [def] : [],             // recipe keys this stall can switch between
    trainee: null,                          // apprentice being trained ({ worker })
    autos: new Array(nSteps).fill(null),    // one workstation per step; each holds a worker or null
    buf: new Array(Math.max(0, nSteps-1)).fill(0),   // items waiting between steps k and k+1
    bufCap: BUFFER_CAP,                     // buffer capacity (upgradable)
    served: 0,
    revenue: 0,
    acc: 0,                                 // fractional cycle progress for passive income
  };
}

// Each helper has a profile + per-recipe mastery, plus a per-recipe cooldown.
// To keep the early game simple, EVERY helper performs the stall's *starting*
// recipe at the same fixed rate. Only UNLOCKED recipes (e.g. pan-fried) give
// helpers individual cooldowns that they level up by making dishes.
const NAMES  = ['Mochi','Pip','Suki','Bao','Yuki','Coco','Tofu','Miso','Nori','Yam'];
const HELPER_CD_STARTER = 2;       // every helper: 2x the manual cooldown on the starting recipe (uniform)
const HELPER_CD_MIN = 2, HELPER_CD_MAX = 3;   // rolled range for an unlocked recipe (before leveling)
const LEVELUP_DISHES = 10;         // dishes a helper makes of an unlocked recipe per level
const LEVEL_CD_STEP  = 0.25;       // each level shaves this off the cooldown multiplier (floor at the starter rate)
function makeWorker() {
  const i = G.workerSeq++;
  return { emoji: WORKER_EMOJIS[i % WORKER_EMOJIS.length], name: NAMES[i % NAMES.length],
           mastery: {}, cdMul: {}, recServed: {}, served: 0 };
}
const isStarterRecipe = (id, rk) => rk === STALLS[id].recipe;
// A helper's level on a recipe (1+; only meaningful for unlocked recipes).
const wRecipeLevel = (w, rk) => 1 + Math.floor((w.recServed[rk] || 0) / LEVELUP_DISHES);
// The cooldown MULTIPLIER (x manual) this helper applies to the stall's active recipe.
function wCdMul(w, id) {
  const rk = G.stalls[id].active;
  if (isStarterRecipe(id, rk)) return HELPER_CD_STARTER;        // uniform on the starting recipe
  if (w.cdMul[rk] == null) w.cdMul[rk] = HELPER_CD_MIN + Math.random() * (HELPER_CD_MAX - HELPER_CD_MIN);
  return Math.max(HELPER_CD_STARTER, w.cdMul[rk] - LEVEL_CD_STEP * (wRecipeLevel(w, rk) - 1));   // leveling improves it, floor at starter rate
}
// A helper's cooldown (ms) for a station: the step's time x manual mult x their recipe multiplier.
function wStationCd(w, id, sid) {
  if (!w) return Infinity;
  return STEPS[sid].ms * MANUAL_CD_MULT * wCdMul(w, id);
}

const G = {
  coins: START_COINS,
  pantry: { dough: START_STOCK, tea: START_STOCK, broth: START_STOCK, cloth: START_STOCK },
  wageBucket: 0,               // fractional wages owed
  workerSeq: 0,                // assigns each new helper their emoji/name/speed
  stalls: Object.fromEntries(STALL_ORDER.map(id => [id, makeStallState(id)])),
  firstCookDone: false,        // clears the opening "tap to cook" nudge
  taughtAutomate: false,       // true once the player automates their first stall — stops the teaching highlights
  taughtPan: false,            // true once the pan-fried unlock has been pointed out
  quest: 0,                    // index into QUESTS (the current tutorial goal)
  upgrades: {},                // Market Board upgrade levels, keyed by MARKET_UPGRADES key
  stats: { handMade: 0, restocks: 0 },   // dishes finished by hand + supply restocks (for quests)
  pending: {},                 // per-stall count of roamers who've walked in, waiting to be seated
  enterAcc: {},                // per-stall arrival timer (each stall draws customers independently)
};

// Open stalls a roaming customer might wander into.
const openStalls = () => STALL_ORDER.filter(id => STALLS[id].state === 'open');

// Customer arrivals: EACH open stall has its OWN independent (slow) arrival rate,
// so opening more stalls draws more total customers — it does not slow the others.
// Runs in both scenes, so stalls fill whether or not you're looking at them.
// Returns a stall id that just got an arrival (for the market's enter animation), else null.
function tickArrivals(dtMs) {
  let entered = null;
  const interval = enterMs();
  for (const id of openStalls()) {
    G.enterAcc[id] = (G.enterAcc[id] || 0) + dtMs;
    if (G.enterAcc[id] < interval) continue;
    G.enterAcc[id] -= interval;
    // cap pending so an unattended stall doesn't bank infinite customers (its queue is QUEUE_MAX)
    G.pending[id] = Math.min(QUEUE_MAX, (G.pending[id] || 0) + 1);
    entered = id;
  }
  return entered;
}

// Sequential tutorial quests — each pays a coin reward, pacing the early game:
// cook by hand → hire (forced) → train → assign → run dry & restock → expand.
const QUESTS = [
  { text:'Make 3 pajamas by hand', reward:50, emoji:'🧦',
    prog:()=>({ n:Math.min(G.stats.handMade,3), of:3 }), done:()=>G.stats.handMade >= 3 },
  { text:'Hire your first apprentice', reward:60, emoji:'🐾',
    done:()=>G.workerSeq > 0 },
  { text:'Train the apprentice — keep crafting', reward:80, emoji:'🎓',
    prog:()=>{ const t = G.stalls.pj.trainee; const m = Math.floor(t ? wMastery(t,'pj') : 100); return { n:Math.min(m,100), of:100 }; },
    done:()=>STALL_ORDER.some(id => wTrained(G.stalls[id].trainee, id) || G.stalls[id].autos.some(Boolean)) },
  { text:'Assign the trained apprentice to a station', reward:120, emoji:'🤖',
    done:()=>STALL_ORDER.some(id => G.stalls[id].autos.some(Boolean)) },
  { text:'Out of supplies! Restock (📦100 for 💰100)', reward:100, emoji:'📦',
    done:()=>G.stats.restocks >= 1 },
  { text:'Expand! Open the Dumpling Stall', reward:150, emoji:'🥟',
    done:()=>STALLS.dumpling.state === 'open' },
];
const currentQuest = () => G.quest < QUESTS.length ? QUESTS[G.quest] : null;
// If the current quest is satisfied, pay its reward, advance, and return it (for a toast).
function tryCompleteQuest() {
  const q = currentQuest();
  if (!q || !q.done()) return null;
  G.coins += q.reward;
  G.quest += 1;
  return q;
}

const recipeOf  = id => RECIPES[G.stalls[id].active];          // the stall's *active* recipe
const cycleMs   = id => recipeOf(id).steps.reduce((a, sid) => a + STEPS[sid].ms, 0);
// Each helper has a 0-100 mastery meter PER RECIPE. Hand-crafting while they're in
// the apprentice slot raises the active recipe's meter; at 100 they've mastered it
// and can be deployed to a slot to run that recipe hands-free.
const MASTER_MAX     = 100;
// Mastery is rolled with dice: 2d6 when the PLAYER works a station, 1d6 when a
// deployed HELPER does (learn by watching, slower on average).
const MASTER_DICE_TAP  = 2;   // d6 rolled per manual tap
const MASTER_DICE_AUTO = 1;   // d6 rolled per helper cycle
const rollDice = n => { let s = 0; for (let i = 0; i < n; i++) s += 1 + Math.floor(Math.random() * 6); return s; };
const wMastery   = (w, id) => (w && w.mastery[G.stalls[id].active]) || 0;
const wTrained   = (w, id) => wMastery(w, id) >= MASTER_MAX;        // mastered the active recipe
// The auto line: a slot runs only if its worker has mastered the ACTIVE recipe;
// the line produces finished dishes only when EVERY slot is staffed by such a worker.
const stepReady    = (id, k) => wTrained(G.stalls[id].autos[k], id);
const lineComplete = id => recipeOf(id).steps.every((sid, k) => stepReady(id, k));
// A helper's per-item time is their own cooldown for that station (always >= 2x manual).
const autoStepMs   = (id, sid, k) => wStationCd(G.stalls[id].autos[k], id, sid);
const lineCycle    = id => Math.max(...recipeOf(id).steps.map((sid, k) => autoStepMs(id, sid, k)));  // bottleneck (call only when complete)
const placedAt     = id => (G.stalls[id].trainee ? 1 : 0) + G.stalls[id].autos.filter(Boolean).length;
const workersAt    = placedAt;                                 // (kept name; used by the HUD)
const totalWorkers = () => STALL_ORDER.reduce((n, id) => n + placedAt(id), 0);
const isAutomated  = id => STALLS[id].state === 'open' && lineComplete(id);

// Continuous wage drain — coins never go negative (helpers simply work for free if broke).
function tickWages(dtMs) {
  const n = totalWorkers();
  if (n === 0) return;
  G.wageBucket += n * WAGE_PER_SEC * (dtMs / 1000);
  while (G.wageBucket >= 1 && G.coins > 0) { G.coins -= 1; G.wageBucket -= 1; }
  if (G.coins <= 0) G.wageBucket = 0;
}

// Passive income for automated stalls that aren't being hand-run right now — scaled
// by how many auto-stations are staffed. (The stall you're inside is driven by its
// scene's auto-stations instead, so we skip it here.)
function tickPassive(dtMs, exceptId) {
  for (const id of STALL_ORDER) {
    if (id === exceptId || !isAutomated(id)) continue;
    const ing = STALLS[id].ingredient;
    if (G.pantry[ing] <= 0) continue;
    const stall = G.stalls[id], cyc = lineCycle(id), val = recipeOf(id).value;
    stall.acc += dtMs;                          // a complete line yields one dish per bottleneck cycle
    while (stall.acc >= cyc && G.pantry[ing] > 0) {
      stall.acc -= cyc;
      G.pantry[ing] -= 1;
      G.coins += val; stall.served += 1; stall.revenue += val;
    }
  }
}

/* ============================================================================
   Shared UI bits
   ========================================================================== */
// A rounded button drawn from a rectangle (easy hit-testing) + centered label.
function makeButton(scene, x, y, w, h, fill, label, fontSize, depth) {
  const rect = scene.add.rectangle(x, y, w, h, fill).setStrokeStyle(2, COL.brown).setDepth(depth || 60);
  const txt = scene.add.text(x, y, label, { fontFamily:FONT, fontSize:(fontSize||'15px'), color:'#FFFFFF', fontStyle:'700' }).setOrigin(0.5).setDepth((depth||60)+1);
  return { x, y, w, h, rect, txt };
}
const inBox = (px, py, o, hw, hh) => px >= o.x-hw && px <= o.x+hw && py >= o.y-hh && py <= o.y+hh;
const hitBtn = (px, py, b) => inBox(px, py, b, b.w/2, b.h/2);

/* ============================================================================
   MARKET SCENE — a crossroads hub: 4 corner tents, one per stall
   ========================================================================== */
const MARKET_CY = 470;   // vertical center of the crossroads (tents sit 150px above/below)
class Market extends Phaser.Scene {
  constructor() { super('market'); }

  create() {
    this.drawBackground();
    this.buildHud();

    // Quest banner near the top, above the crossroads.
    this.qbBg = this.add.graphics().setDepth(4);
    this.qbTxt = this.add.text(W/2, 92, '', { fontFamily:FONT, fontSize:'13px', color:hex(COL.brown), fontStyle:'800', align:'center' }).setOrigin(0.5).setDepth(5);

    // One tent per stall, in the four corners around the crossroads.
    this.cards = [];
    STALL_ORDER.forEach((id, i) => this.cards.push(this.buildTent(id, i)));

    this.buildRoamers();
    this.hintPill = this.makeHintPill();
    this.hl = this.add.graphics().setDepth(40);   // first-run nudge toward the dumpling tent
    this.input.on('pointerdown', p => this.handleTap(p.x, p.y));
    this.refreshHud();
    this.refreshCards();
    this.refreshQuestBanner();
  }

  // ---------------- Roaming customers ----------------
  // A pool of shoppers wandering the crossroads. Each picks random spots to stroll
  // to; when a roamer is tapped to "enter" a stall, it walks into that tent and
  // respawns elsewhere a moment later.
  buildRoamers() {
    this.roamers = [];
    for (let i = 0; i < MARKET_ROAMERS; i++) {
      const face = Phaser.Utils.Array.GetRandom(['🙂','😀','😊','🧑','👩','👨','🧒']);
      const cont = this.add.container(this.randSpot().x, this.randSpot().y).setDepth(20);
      cont.add(this.add.circle(0, 0, 13, COL.card).setStrokeStyle(2, COL.dim));
      cont.add(this.add.text(0, 0, face, { fontSize:'15px' }).setOrigin(0.5));
      const r = { cont, walking:false };
      this.roamers.push(r);
      this.strollLater(r, Math.random() * 2000);
    }
  }

  randSpot() {
    // keep roamers on the streets: pick a point along the vertical or horizontal
    // road band so they stroll the paths instead of wandering over the tents.
    const cx = W/2, cy = MARKET_CY, half = 20;   // road half-width (band is ~46 wide)
    if (Math.random() < 0.5) {
      return { x: cx + (Math.random()*2-1)*half, y: 120 + Math.random() * (H - 150) };   // vertical road
    }
    return { x: 24 + Math.random() * (W - 48), y: cy + (Math.random()*2-1)*half };        // horizontal road
  }

  strollLater(r, ms) {
    this.time.delayedCall(ms, () => {
      if (!r.cont.active || r.walking) return;
      const to = this.randSpot(); r.walking = true;
      this.tweens.add({ targets: r.cont, x: to.x, y: to.y, duration: 1600 + Math.random()*1600, ease:'Sine.InOut',
        onComplete: () => { r.walking = false; this.strollLater(r, 600 + Math.random()*2600); } });
    });
  }

  // Send a roamer walking into the given tent, then respawn it back on the floor.
  sendRoamerToTent(id) {
    const tent = this.cards.find(c => c.id === id); if (!tent) return;
    const r = this.roamers.find(x => !x.entering); if (!r) return;
    r.entering = true;
    this.tweens.killTweensOf(r.cont);
    this.tweens.add({ targets: r.cont, x: tent.x, y: tent.y - 10, scale: 0.5, alpha: 0, duration: 600, ease:'Sine.In',
      onComplete: () => { r.cont.setScale(1).setAlpha(1).setPosition(this.randSpot().x, this.randSpot().y); r.entering = false; r.walking = false; this.strollLater(r, 400 + Math.random()*1500); } });
  }

  refreshQuestBanner() {
    const q = currentQuest();
    this.qbBg.clear();
    if (!q) { this.qbTxt.setText(''); return; }
    const p = q.prog && q.prog();
    this.qbTxt.setText('📋 ' + q.text + ' ' + q.emoji + (p ? '  (' + p.n + '/' + p.of + ')' : '') + '   ·   +' + q.reward + '💰');
    const w = this.qbTxt.width + 26, h = 26;
    this.qbBg.fillStyle(COL.card, 0.96).fillRoundedRect(W/2-w/2, 92-h/2, w, h, 10);
    this.qbBg.lineStyle(2, COL.amber, 1).strokeRoundedRect(W/2-w/2, 92-h/2, w, h, 10);
  }

  // Pulse the HQ (starting) tent until the very first item has been made by hand.
  drawHighlight(time) {
    const g = this.hl; g.clear();
    if (G.firstCookDone) return;
    const c = this.cards.find(c => STALLS[c.id].hq);
    if (!c) return;
    const puls = 0.5 + 0.5 * Math.sin(time / 250);
    g.lineStyle(3 + 2*puls, COL.btn, 0.5 + 0.4*puls);
    g.strokeRoundedRect(c.x - c.hw - 2*puls, c.y - c.hh - 2*puls, c.hw*2 + 4*puls, c.hh*2 + 4*puls, 14);
  }

  drawBackground() {
    const g = this.add.graphics().setDepth(0);
    const t = 38;
    for (let yy = 0; yy < H; yy += t)
      for (let xx = 0; xx < W; xx += t) {
        const alt = (Math.floor(xx/t) + Math.floor(yy/t)) % 2 === 0;
        g.fillStyle(alt ? COL.floor : COL.floorAlt, 1).fillRect(xx, yy, t, t);
      }
    // Crossroads: two dirt paths meeting in the middle, with the 4 tents in the corners.
    const cx = W/2, cy = MARKET_CY, pw = 46;
    g.fillStyle(COL.counter, 0.5);
    g.fillRect(cx - pw/2, 96, pw, H - 96);          // vertical road
    g.fillRect(0, cy - pw/2, W, pw);                // horizontal road
    g.fillStyle(COL.tan, 0.85).fillCircle(cx, cy, 30);   // central plaza
    g.lineStyle(2, COL.counter, 0.6).strokeCircle(cx, cy, 30);
    this.add.text(cx, cy, '🏮', { fontSize:'26px' }).setOrigin(0.5).setDepth(1);
    this.add.text(cx, cy + 26, 'CW Market', { fontFamily:FONT, fontSize:'11px', color:hex(COL.brown), fontStyle:'800' }).setOrigin(0.5).setDepth(1);
  }

  buildHud() {
    this.add.rectangle(W/2, 24, W, 48, COL.brown).setDepth(50);
    this.coinLabel = this.add.text(12, 24, '', { fontFamily:FONT, fontSize:'21px', color:'#FAF4EA', fontStyle:'700' }).setOrigin(0,0.5).setDepth(51);
    this.statLabel = this.add.text(W-12, 24, '', { fontFamily:FONT, fontSize:'13px', color:'#FAF4EA' }).setOrigin(1,0.5).setDepth(51);
  }

  refreshHud() {
    this.coinLabel.setText('💰 ' + Math.floor(G.coins));
    const n = totalWorkers(), wage = n * WAGE_PER_SEC;
    const wageStr = n ? '   💸-' + (Number.isInteger(wage) ? wage : wage.toFixed(1)) + '/s' : '';
    this.statLabel.setText('🐾 ' + n + wageStr);
  }

  // A corner tent for stall `id`. Quadrant index i: 0=TL, 1=TR, 2=BL, 3=BR.
  buildTent(id, i) {
    const cfg = STALLS[id];
    const colX = (i % 2 === 0) ? W*0.225 : W*0.775;          // left / right column (clear of the road)
    const rowY = (i < 2) ? MARKET_CY - 152 : MARKET_CY + 152; // top / bottom row
    const hw = 72, hh = 88, x = colX, y = rowY;
    const cont = this.add.container(x, y).setDepth(4);
    const bg = this.add.graphics();                          // tent body + striped awning (state-driven)
    const emoji = this.add.text(0, -8, cfg.emoji, { fontSize:'42px' }).setOrigin(0.5);
    const name  = this.add.text(0, 30, cfg.name, { fontFamily:FONT, fontSize:'12px', color:hex(COL.brown), fontStyle:'800', align:'center', wordWrap:{ width: hw*2-16 } }).setOrigin(0.5, 0);
    const status= this.add.text(0, 54, '', { fontFamily:FONT, fontSize:'9px', color:hex(COL.dim), fontStyle:'700', align:'center', wordWrap:{ width: hw*2-14 } }).setOrigin(0.5, 0);
    cont.add([bg, emoji, name, status]);
    return { id, cfg, x, y, hw, hh, cont, bg, emoji, name, status };
  }

  // Draw one tent: a striped awning peak over a body box, tinted by state.
  drawTent(c) {
    const cfg = c.cfg, open = cfg.state === 'open', g = c.bg;
    const hw = c.hw, hh = c.hh, bodyTop = -hh + 26;
    g.clear();
    // body
    g.fillStyle(COL.card, open ? 1 : 0.92).fillRoundedRect(-hw, bodyTop, hw*2, hh*2 - 26, 12);
    g.lineStyle(3, cfg.accent, open ? 1 : 0.5).strokeRoundedRect(-hw, bodyTop, hw*2, hh*2 - 26, 12);
    // striped awning peak (a triangle of accent + cream stripes)
    g.fillStyle(cfg.accent, open ? 1 : 0.55);
    g.beginPath(); g.moveTo(0, -hh - 6); g.lineTo(-hw - 6, bodyTop); g.lineTo(hw + 6, bodyTop); g.closePath(); g.fillPath();
    g.fillStyle(COL.cream, open ? 0.5 : 0.3);
    for (let sx = -hw; sx < hw; sx += 28) {                  // stripe hints
      const t0 = Phaser.Math.Clamp((sx+hw)/(hw*2), 0, 1);
      g.fillRect(sx, bodyTop - 5, 13, 5);
    }
    c.emoji.setAlpha(open ? 1 : 0.5);
  }

  refreshCards() {
    for (const c of this.cards) {
      const cfg = c.cfg;
      this.drawTent(c);
      if (cfg.state === 'open') {
        const s = G.stalls[c.id], ing = cfg.ingredient, r = recipeOf(c.id);
        let txt;
        if (isAutomated(c.id)) {
          const rate = r.value / (lineCycle(c.id) / 1000);
          txt = (G.pantry[ing] > 0) ? '🤖 +' + rate.toFixed(1) + '/s · served ' + s.served
                                    : '⚠️ out of ' + INGREDIENTS[ing].emoji + ' · served ' + s.served;
        } else if (s.autos.some(Boolean)) {
          txt = '🛠️ line ' + s.autos.filter(Boolean).length + '/' + r.steps.length + ' · served ' + s.served;
        } else if (s.trainee) {
          txt = '👩‍🍳 training ' + Math.floor(wMastery(s.trainee, c.id)) + '%';
        } else {
          txt = s.served > 0 ? 'served ' + s.served + ' · tap to run' : 'tap to cook 👆';
        }
        c.status.setText(txt).setColor(hex(COL.dim));
      } else {   // locked / buyable
        const afford = G.coins >= cfg.cost;
        c.status.setText('🔓 Open · ' + cfg.cost + '💰').setColor(hex(afford ? COL.btn : COL.dim));
      }
    }
  }

  makeHintPill() {
    const bg = this.add.graphics().setDepth(70);
    const txt = this.add.text(W/2, H-40, '', { fontFamily:FONT, fontSize:'13px', color:hex(COL.brown), fontStyle:'700', align:'center' }).setOrigin(0.5).setDepth(71);
    return { bg, txt, show:(m)=>{ txt.setText(m); const w=txt.width+26,h=txt.height+14; bg.clear(); bg.fillStyle(COL.card,0.96).fillRoundedRect(W/2-w/2,H-40-h/2,w,h,11); bg.lineStyle(2,COL.dim,1).strokeRoundedRect(W/2-w/2,H-40-h/2,w,h,11); this.time.delayedCall(1600,()=>{ if(txt.text===m){txt.setText('');bg.clear();} }); } };
  }

  handleTap(px, py) {
    // tap a tent: open → enter; locked → buy & open
    for (const c of this.cards) {
      if (px < c.x - c.hw || px > c.x + c.hw || py < c.y - c.hh - 6 || py > c.y + c.hh) continue;
      if (c.cfg.state === 'open') this.scene.start('stall', { id: c.id });
      else this.tryOpenStall(c);
      return;
    }
  }

  // Open a locked stall for coins, then step straight inside to start cooking.
  tryOpenStall(c) {
    const cfg = c.cfg;
    if (G.coins < cfg.cost) { this.hintPill.show('Need ' + cfg.cost + ' 💰 to open the ' + cfg.name); return; }
    G.coins -= cfg.cost;
    cfg.state = 'open';                 // mutates STALLS[id].state — persists for the session
    this.refreshHud(); this.refreshCards();
    this.scene.start('stall', { id: c.id });
  }

  update(time, delta) {
    tickWages(delta);
    tickPassive(delta, null);   // every automated stall earns while you're in the market
    const entered = tickArrivals(delta);          // a roamer wandered into a stall?
    if (entered) this.sendRoamerToTent(entered);  // walk one of our shoppers into that tent
    const q = tryCompleteQuest();
    if (q) this.hintPill.show('✅ ' + q.text + '  ·  +' + q.reward + '💰');
    this.refreshHud();
    this.refreshCards();
    this.refreshQuestBanner();
    this.drawHighlight(time);
  }
}

/* ============================================================================
   STALL SCENE — the cooking floor for one stall
   ========================================================================== */
// Layout flows top → bottom: customers enter at the TOP and queue down to the
// counter; the kitchen (the player's stations) sits at the BOTTOM, and finished
// dishes travel upward from the kitchen across the counter to the guests.
const DOOR      = { x: W/2, y: 104 };          // customers enter from the top
const QUEUE_Y   = [388, 320, 252, 184];        // front of line (by the counter) → back (by the door)
const HINT_Y    = 144;                          // quest/hint pill — in the clean gap between the door and the queue
const QUEUE_DX  = [0, 64, 0, -64];             // stagger left/right so neighbours don't overlap
const COUNTER_Y = 424;                          // serving counter band — guests above, kitchen below
const TRAY_Y    = 458;                          // pickup pass: finished dishes wait here to be served up
const TABS_Y    = 500;                          // recipe selector tabs (dumpling only)
const KITCHEN_Y = 536;                          // kitchen caption
const LINE_Y    = 594;                          // manual buttons (the player's stations)
const SLOT_DY   = 56;                           // a helper slot sits this far below each button
// Kitchen floor runs left→right: 📦 Storage feeds the first step, then steps with
// a vertical "prep tray" pip-stack in each gap. Squished toward the right so
// Storage has room on the left.
const STORAGE_X = 50;                            // the Storage station (ingredients live here)
const STEP_X0   = 130;                           // first step button's x
const STEP_DX   = 92;                            // spacing between step buttons (tighter than full-width)
const TRAINEE_Y = 728;                          // apprentice card (bottom)
const TRAINEE   = { x: W/2, y: TRAINEE_Y };     // apprentice slot

class Stall extends Phaser.Scene {
  constructor() { super('stall'); }

  create(data) {
    this.id = data.id;
    this.cfg = STALLS[this.id];
    this.recipe = recipeOf(this.id);
    this.stall = G.stalls[this.id];
    // Phaser reuses the scene instance across visits but destroys its GameObjects on
    // shutdown — so null out persistent-once refs here, or buildLine's guard would
    // skip rebuilding the (now-dead) trainee UI and crash on re-entry.
    this.traineeDot = null;
    this.stations = null; this.slots = null; this.bufviews = null;
    this.restockModal = null;
    this.board = null; this.boardBtn = null;

    this.tray = [];        // finished-dish tokens waiting on the pickup tray
    this.lineItems = this.stall.autos.map(() => null);   // per-workstation in-progress AUTO item ({prog}) or null
    this.customers = [];
    this.wasAutomated = isAutomated(this.id);   // to detect the moment this stall first runs itself
    this.guideBackUntil = 0;                    // briefly highlight ← Market right after that moment

    this.drawRoom();
    this.buildHud();
    this.buildLine();      // workstations (one per step) + buffers + trainee slot
    this.buildTray();
    this.buildHintPill();
    this.buildRecipeTabs();
    this.hl = this.add.graphics().setDepth(69);   // pulsing "do this next" highlight
    this.spotlight = this.add.graphics().setDepth(65);   // dims everything but the apprentice card (forced-hire)
    this.refreshAll();

    this.input.on('pointerdown', p => this.handleTap(p.x, p.y));
  }

  // ---------------- First-run highlight ----------------
  // Returns a box {x,y,w,h} or circle {x,y,r} to pulse around the next useful
  // action — kept gentle and self-disabling once the player has learned the loop.
  highlightTarget(time) {
    if (time < this.guideBackUntil) return { x:this.backBtn.x, y:this.backBtn.y, w:this.backBtn.w+10, h:this.backBtn.h+10 };
    if (!G.taughtAutomate) {                                  // teach the core loop on the first stall only
      const q = currentQuest();
      if (q && q.emoji === '📦' && G.coins >= RESTOCK_COST) {   // restock tutorial step → point at Storage
        const s = this.storage; return { x:s.x, y:s.y, w:s.w+8, h:s.h+8 };
      }
      const b = this.traineeBox, w = this.stall.trainee;
      if (w && this.deployStep(w) >= 0) return { x:b.x, y:b.y, w:b.halfW*2+8, h:b.halfH*2+8 };  // deploy a ready apprentice
      if (!w && G.coins >= HIRE_COST) return { x:b.x, y:b.y, w:b.halfW*2+8, h:b.halfH*2+8 };     // hire an apprentice
      const k = this.firstTappableStep();                    // otherwise nudge a step you can perform by hand
      if (k >= 0) { const st = this.stations[k]; return { x:st.x, y:st.y, w:st.w+8, h:st.h+8 }; }
    } else if (!G.taughtPan) {                               // one-time nudge toward the pan unlock
      const u = STALLS[this.id].unlock;
      if (u && !this.stall.unlocked.includes(u.recipe) && isAutomated(this.id) && G.coins >= u.cost) {
        const tab = this.recipeTabs.find(t => t.key === u.recipe);
        if (tab) return { x:tab.x, y:tab.y, w:tab.w+8, h:tab.h+8 };
      }
    }
    return null;
  }

  drawHighlight(time) {
    const g = this.hl; g.clear();
    const t = this.highlightTarget(time);
    if (!t) return;
    const puls = 0.5 + 0.5 * Math.sin(time / 250);
    g.lineStyle(3 + 2*puls, COL.btn, 0.4 + 0.5*puls);
    if (t.r) g.strokeCircle(t.x, t.y, t.r + 3*puls);
    else     g.strokeRoundedRect(t.x - t.w/2 - 2*puls, t.y - t.h/2 - 2*puls, t.w + 4*puls, t.h + 4*puls, 14);
  }

  // During the forced-hire freeze, darken the whole screen EXCEPT the apprentice
  // card, spotlighting the button the player must tap. (Drawn as four dark bands
  // around the card, since graphics can't punch a hole.)
  drawSpotlight() {
    const g = this.spotlight; g.clear();
    if (!this.tutorialFrozen()) return;
    const b = this.traineeBox, pad = 8;
    const L = b.x - b.halfW - pad, R = b.x + b.halfW + pad, T = b.y - b.halfH - pad, B = b.y + b.halfH + pad;
    g.fillStyle(0x2A211B, 0.6);
    g.fillRect(0, 0, W, T);            // above the card
    g.fillRect(0, B, W, H - B);        // below the card
    g.fillRect(0, T, L, B - T);        // left of the card
    g.fillRect(R, T, W - R, B - T);    // right of the card
  }

  // ---------------- Layout / room ----------------
  drawRoom() {
    const g = this.add.graphics().setDepth(0);
    const t = 38;
    for (let yy = 96; yy < H; yy += t)
      for (let xx = 0; xx < W; xx += t) {
        const alt = (Math.floor(xx/t) + Math.floor(yy/t)) % 2 === 0;
        g.fillStyle(alt ? COL.floor : COL.floorAlt, 1).fillRect(xx, yy, t, t);
      }
    // walls top & bottom; the customer door is now at the TOP
    g.fillStyle(COL.wall, 1);
    g.fillRect(0, 96, W, 8);
    g.fillRect(0, H-8, W, 8);
    g.fillStyle(COL.floor, 1).fillRect(DOOR.x-38, 96, 76, 8);                        // doorway (top)
    g.fillStyle(COL.tan, 0.5).fillRoundedRect(DOOR.x-40, 108, 80, 16, 6);            // entry mat
    // serving counter divides the dining area (above) from the kitchen (below)
    g.fillStyle(COL.counter, 1).fillRoundedRect(16, COUNTER_Y-13, W-32, 26, 9);
    g.fillStyle(0xFFFFFF, 0.12).fillRoundedRect(16, COUNTER_Y-13, W-32, 9, 9);       // counter highlight
    this.add.text(24, 132, '🚪 guests', { fontFamily:FONT, fontSize:'11px', color:hex(COL.dim), fontStyle:'700' }).setOrigin(0,0.5).setDepth(2);
    this.kitchenCaption = this.add.text(W/2, KITCHEN_Y, '', { fontFamily:FONT, fontSize:'11px', color:hex(COL.dim), fontStyle:'800' }).setOrigin(0.5).setDepth(2);
  }

  buildHud() {
    this.add.rectangle(W/2, 24, W, 48, this.cfg.accent).setDepth(50);
    this.coinLabel = this.add.text(12, 24, '', { fontFamily:FONT, fontSize:'21px', color:'#FFFFFF', fontStyle:'700' }).setOrigin(0,0.5).setDepth(51);
    this.statLabel = this.add.text(W-12, 24, '', { fontFamily:FONT, fontSize:'12px', color:'#FFFFFF' }).setOrigin(1,0.5).setDepth(51);

    // Back-to-market button + stall name on the sub-bar.
    this.add.rectangle(W/2, 72, W, 48, COL.cream).setDepth(50);
    this.backBtn = makeButton(this, 52, 72, 76, 34, COL.brown, '← Market', '13px', 51);
    this.add.text(W/2 + 6, 72, this.cfg.emoji + ' ' + this.cfg.name, { fontFamily:FONT, fontSize:'15px', color:hex(COL.brown), fontStyle:'800' }).setOrigin(0.5).setDepth(51);
    // HQ-only: the Market Board (market-wide upgrades) lives in the PJ Workshop.
    if (this.cfg.hq) this.boardBtn = makeButton(this, W-50, 72, 84, 34, COL.amber, '📋 Board', '13px', 51);
  }

  // ---------------- Production line: 📦 Storage → step buttons (helper slot beneath each), ----------------
  //                  with a vertical "prep tray" pip-stack in each between-step gap.
  buildLine() {
    if (this.stations) this.stations.forEach(s => s.cont.destroy());
    if (this.slots) this.slots.forEach(s => s.cont.destroy());
    if (this.bufviews) this.bufviews.forEach(b => b.cont.destroy());
    if (this.storage) this.storage.cont.destroy();
    const n = this.recipe.steps.length;
    const xAt = i => STEP_X0 + i*STEP_DX;

    // Storage station — ingredients live here and flow into the first step.
    {
      const x = STORAGE_X, y = LINE_Y, w = 64, h = 70;
      const cont = this.add.container(x, y).setDepth(10);
      const bg = this.add.graphics();
      const box = this.add.text(0, -16, '📦', { fontSize:'24px' }).setOrigin(0.5);
      const stk = this.add.text(0, 9, '', { fontFamily:FONT, fontSize:'12px', color:hex(COL.brown), fontStyle:'800' }).setOrigin(0.5);
      const cap = this.add.text(0, 24, '↺' + RESTOCK_COST + '💰', { fontFamily:FONT, fontSize:'8px', color:hex(COL.dim), fontStyle:'700' }).setOrigin(0.5);
      const arrow = this.add.text(w/2 + (STEP_X0 - STORAGE_X - w/2 - 39)/2, -2, '→', { fontFamily:FONT, fontSize:'15px', color:hex(COL.dim), fontStyle:'700' }).setOrigin(0.5);
      const alert = this.add.graphics();   // pulsing "out of stock!" ring (per-frame)
      cont.add([bg, alert, box, stk, cap, arrow]);
      this.storage = { x, y, w, h, cont, bg, stk, cap, alert };
    }

    // Manual buttons (the player's stations) — always tappable, one per step.
    this.stations = this.recipe.steps.map((sid, i) => {
      const s = STEPS[sid], x = xAt(i), y = LINE_Y, w = 78, h = 70;
      const cont = this.add.container(x, y).setDepth(10);
      const bg = this.add.graphics();
      const emoji = this.add.text(0, -16, s.emoji, { fontSize:'26px' }).setOrigin(0.5);
      const label = this.add.text(0, 9, s.label, { fontFamily:FONT, fontSize:'12px', color:hex(COL.brown), fontStyle:'800' }).setOrigin(0.5);
      const cdg = this.add.graphics();   // cooldown overlay (after a manual tap)
      cont.add([bg, emoji, label, cdg]);
      return { i, sid, x, y, w, h, cont, bg, emoji, label, cdg, cd: 0, cdMax: STEPS[sid].ms * MANUAL_CD_MULT };
    });

    // Helper slots — beneath each button; a worker here automates that step in parallel with the player.
    this.slots = this.recipe.steps.map((sid, i) => {
      const x = xAt(i), y = LINE_Y + SLOT_DY, r = 15;
      const cont = this.add.container(x, y).setDepth(11);
      const ring = this.add.graphics();    // auto progress
      const dot  = this.add.circle(0, 0, r, COL.btnOff).setStrokeStyle(2, COL.dim);
      const face = this.add.text(0, 0, '', { fontSize:'15px' }).setOrigin(0.5);
      const lbl  = this.add.text(0, r+9, '', { fontFamily:FONT, fontSize:'8px', color:hex(COL.dim), fontStyle:'700' }).setOrigin(0.5);
      cont.add([ring, dot, face, lbl]);
      return { i, sid, x, y, r, cont, ring, dot, face, lbl };
    });

    // Prep trays — a vertical pip-stack in each between-step gap (holds items mid-craft).
    this.bufviews = [];
    for (let k = 0; k < n - 1; k++) {
      const mx = (xAt(k) + xAt(k+1)) / 2, cont = this.add.container(mx, LINE_Y).setDepth(10);
      const g = this.add.graphics();
      cont.add(g);
      this.bufviews.push({ k, cont, g });
    }

    if (this.kitchenCaption) this.kitchenCaption.setText('— 🍳 KITCHEN —');

    // Trainee card (apprentice) at the bottom — masters the active recipe as you hand-craft.
    if (!this.traineeDot) {
      const cw = 300, ch = 60, cx = TRAINEE.x, cy = TRAINEE.y;
      this.traineeBox = { x: cx, y: cy, halfW: cw/2, halfH: ch/2 };
      this.traineeCard = this.add.graphics().setDepth(10);
      const ax = cx - cw/2 + 32;                                   // avatar at the card's left
      this.traineeDot  = this.add.circle(ax, cy, 19, COL.btnOff).setStrokeStyle(2, this.cfg.accent).setDepth(11);
      this.traineeFace = this.add.text(ax, cy, '', { fontSize:'21px' }).setOrigin(0.5).setDepth(12);
      this.traineeTag  = this.add.text(ax, cy + 30, '🎓 apprentice', { fontFamily:FONT, fontSize:'8px', color:hex(COL.dim), fontStyle:'700' }).setOrigin(0.5).setDepth(12);
      this.traineeLbl  = this.add.text(ax + 34, cy - 12, '', { fontFamily:FONT, fontSize:'12px', color:hex(COL.brown), fontStyle:'800' }).setOrigin(0, 0.5).setDepth(12);
      this.traineeXpX  = ax + 34; this.traineeXpW = cw/2 + 56;     // mastery bar geometry
      this.traineeXp   = this.add.graphics().setDepth(12);
    }
  }

  // Draw the trainee card background + the apprentice's 0-100 mastery meter.
  drawTraineeXp() {
    const tw = this.stall.trainee, b = this.traineeBox;
    this.traineeCard.clear();
    this.traineeCard.fillStyle(COL.card, 0.96).fillRoundedRect(b.x-b.halfW, b.y-b.halfH, b.halfW*2, b.halfH*2, 14);
    this.traineeCard.lineStyle(2, tw ? this.cfg.accent : COL.dim, tw ? 1 : 0.6).strokeRoundedRect(b.x-b.halfW, b.y-b.halfH, b.halfW*2, b.halfH*2, 14);
    const g = this.traineeXp; g.clear();
    const bx = this.traineeXpX, by = b.y + 6, bw = this.traineeXpW, bh = 8;
    g.fillStyle(COL.cream, tw ? 1 : 0.4).fillRoundedRect(bx, by, bw, bh, 4);
    if (tw) { const p = wMastery(tw, this.id) / MASTER_MAX; g.fillStyle(wTrained(tw, this.id) ? COL.green : COL.amber, 1).fillRoundedRect(bx, by, bw*p, bh, 4); }
  }

  // The player's manual button for step i (always usable, even if a helper also works it).
  refreshStation(i) {
    const st = this.stations[i];
    const canDo = this.canPerform(i);
    st.bg.clear();
    st.bg.fillStyle(this.cfg.accent, canDo ? 0.16 : 0.07).fillRoundedRect(-st.w/2, -st.h/2, st.w, st.h, 12);
    st.bg.lineStyle(2.5, this.cfg.accent, canDo ? 1 : 0.5).strokeRoundedRect(-st.w/2, -st.h/2, st.w, st.h, 12);
  }

  // The helper slot beneath step i.
  refreshSlot(i) {
    const sl = this.slots[i], w = this.stall.autos[i];
    sl.face.setText(w ? w.emoji : '+');
    sl.dot.setFillStyle(w ? COL.tan : COL.btnOff).setStrokeStyle(2, w ? COL.blue : COL.dim);
    sl.lbl.setText(w ? w.name : 'helper').setColor(hex(w ? COL.blue : COL.dim));
  }

  // Draw helper auto-progress rings + buffer fill + manual cooldowns each frame.
  drawLine() {
    this.stations.forEach(st => {
      st.cdg.clear();
      if (st.cd <= 0) return;
      const p = st.cd / st.cdMax;                         // 1 just-tapped → 0 ready
      st.cdg.fillStyle(0x2A211B, 0.32).fillRoundedRect(-st.w/2, -st.h/2, st.w, st.h * p, 12);
    });
    this.slots.forEach(sl => {
      sl.ring.clear();
      const it = this.lineItems[sl.i];
      if (!it) return;
      sl.ring.lineStyle(3, COL.blue, 0.9);
      sl.ring.beginPath();
      sl.ring.arc(0, 0, sl.r + 3, -Math.PI/2, -Math.PI/2 + Phaser.Math.PI2 * Phaser.Math.Clamp(it.prog,0,1));
      sl.ring.strokePath();
    });
    // Prep trays: a vertical pip-stack (newest on top), centered in the gap.
    this.bufviews.forEach(bv => {
      const cap = this.stall.bufCap, cnt = this.stall.buf[bv.k];
      bv.g.clear();
      const dh = 6, gap = 3, pw = 12, totalH = cap*dh + (cap-1)*gap, y0 = totalH/2 - dh;
      for (let j = 0; j < cap; j++) {
        bv.g.fillStyle(j < cnt ? this.cfg.accent : COL.dim, j < cnt ? 1 : 0.3);
        bv.g.fillRoundedRect(-pw/2, y0 - j*(dh+gap), pw, dh, 2);   // stack upward as it fills
      }
    });
  }

  // Storage station — shows current stock; tap to restock. Red when empty.
  refreshStorage() {
    const ing = this.cfg.ingredient, stock = G.pantry[ing], s = this.storage;
    let col = COL.brown; if (stock === 0) col = COL.red; else if (stock <= 3) col = COL.amber;
    s.stk.setText(INGREDIENTS[ing].emoji + stock).setColor(hex(col));
    s.bg.clear();
    s.bg.fillStyle(COL.tan, stock === 0 ? 0.10 : 0.18).fillRoundedRect(-s.w/2, -s.h/2, s.w, s.h, 12);
    s.bg.lineStyle(2.5, stock === 0 ? COL.red : COL.brown, stock === 0 ? 1 : 0.6).strokeRoundedRect(-s.w/2, -s.h/2, s.w, s.h, 12);
  }

  // Per-frame: pulse a red ring around Storage while it's empty, as an ongoing
  // "you're out — restock!" cue. Quiet otherwise.
  drawStorageAlert(time) {
    const s = this.storage; s.alert.clear();
    if (G.pantry[this.cfg.ingredient] > 0) return;
    const puls = 0.5 + 0.5 * Math.sin(time / 220);
    s.alert.lineStyle(3 + 2*puls, COL.red, 0.4 + 0.5*puls);
    s.alert.strokeRoundedRect(-s.w/2 - 4 - 2*puls, -s.h/2 - 4 - 2*puls, s.w + 8 + 4*puls, s.h + 8 + 4*puls, 14);
  }

  // ---------------- Recipe tabs (switch recipe / buy equipment) ----------------
  // Shown only when a stall can hold more than one recipe (e.g. dumplings, once
  // the pan is bought). The second tab doubles as the equipment-purchase button.
  buildRecipeTabs() {
    const u = STALLS[this.id].unlock;
    this.recipeKeys = u ? [STALLS[this.id].recipe, u.recipe] : [STALLS[this.id].recipe];
    this.recipeTabs = [];
    if (this.recipeKeys.length < 2) return;            // nothing to switch between — no tabs
    const n = this.recipeKeys.length, tw = 156, gap = 10, y = TABS_Y;
    const startX = W/2 - ((n-1)*(tw+gap))/2;
    this.recipeKeys.forEach((key, i) => {
      const x = startX + i*(tw+gap);
      const bg  = this.add.graphics().setDepth(9);
      const txt = this.add.text(x, y, '', { fontFamily:FONT, fontSize:'12.5px', fontStyle:'800', align:'center' }).setOrigin(0.5).setDepth(10);
      this.recipeTabs.push({ key, x, y, w:tw, h:38, bg, txt });
    });
  }

  refreshRecipeTabs() {
    if (!this.recipeTabs) return;
    for (const tab of this.recipeTabs) {
      const r = RECIPES[tab.key];
      const unlocked = this.stall.unlocked.includes(tab.key);
      const active = this.stall.active === tab.key;
      const u = STALLS[this.id].unlock;
      tab.bg.clear();
      const x = tab.x - tab.w/2, y = tab.y - tab.h/2;
      if (!unlocked) {                                  // the locked recipe = buy-equipment button
        const afford = G.coins >= u.cost;
        tab.bg.fillStyle(afford ? COL.amber : COL.btnOff, afford ? 0.18 : 0.12).fillRoundedRect(x, y, tab.w, tab.h, 12);
        tab.bg.lineStyle(2.5, afford ? COL.amber : COL.dim, 1).strokeRoundedRect(x, y, tab.w, tab.h, 12);
        tab.txt.setText(u.equip + ' 🔒\nunlock ' + r.name + ' · ' + u.cost + '💰').setColor(hex(afford ? COL.brown : COL.dim));
      } else {
        const col = this.cfg.accent;
        tab.bg.fillStyle(col, active ? 0.22 : 0.08).fillRoundedRect(x, y, tab.w, tab.h, 12);
        tab.bg.lineStyle(active ? 3.5 : 2, col, active ? 1 : 0.6).strokeRoundedRect(x, y, tab.w, tab.h, 12);
        tab.txt.setText((active ? '▶ ' : '') + r.emoji + ' ' + r.name + '\n' + r.value + '💰 each').setColor(hex(COL.brown));
      }
    }
  }

  // Switch the stall to a different unlocked recipe. Shared steps keep their
  // training; only steps unique to the new recipe still need learning.
  setActiveRecipe(key) {
    if (this.stall.active === key || !this.stall.unlocked.includes(key)) return;
    this.stall.active = key;
    this.recipe = recipeOf(this.id);
    this.lineItems = this.stall.autos.map(() => null);   // steps changed — reset in-progress items
    this.buildLine();                                    // rebuild workstations for the new steps
    this.refreshAll();
  }

  tryBuyEquipment(key) {
    const u = STALLS[this.id].unlock;
    if (!u || u.recipe !== key) return;
    if (G.coins < u.cost) { this.flashHint('Need ' + u.cost + ' 💰 for the ' + u.equip); return; }
    G.coins -= u.cost;
    G.taughtPan = true;                                 // the unlock has been used — stop nudging it
    this.stall.unlocked.push(key);
    // the genuinely new step (not shared with the current recipe)
    const newStep = RECIPES[key].steps.find(sid => !this.recipe.steps.includes(sid)) || RECIPES[key].steps[RECIPES[key].steps.length-1];
    this.setActiveRecipe(key);                          // switch to the new recipe straight away
    this.flashHint(u.equip + ' bought! Your apprentice must learn the new ' + STEPS[newStep].emoji + ' ' + STEPS[newStep].label + ' step 👆', 2600);
  }

  // ---------------- Pickup tray ----------------
  buildTray() {
    const gap = 30, startX = W/2 - (TRAY_MAX-1)*gap/2;
    this.trayPlates = [];
    for (let i = 0; i < TRAY_MAX; i++) {
      const x = startX + i*gap;
      const plate = this.add.circle(x, TRAY_Y, 11, COL.btnOff).setStrokeStyle(2, this.cfg.accent).setDepth(8).setAlpha(0.35);
      const dish  = this.add.text(x, TRAY_Y, '', { fontSize:'17px' }).setOrigin(0.5).setDepth(9);
      this.trayPlates.push({ x, plate, dish });
    }
  }

  refreshTray() {
    this.trayPlates.forEach((p, i) => {
      const filled = i < this.tray.length;
      p.dish.setText(filled ? this.recipe.emoji : '');
      p.plate.setAlpha(filled ? 1 : 0.35);
    });
  }

  // Refresh the trainee slot + every workstation.
  refreshWorkforce() {
    const tw = this.stall.trainee;
    if (tw) {
      const ready = wTrained(tw, this.id);
      this.traineeDot.setFillStyle(COL.tan);
      this.traineeFace.setText(tw.emoji);
      this.traineeTag.setText('🎓 apprentice');
      this.traineeLbl.setText(tw.name + '  ·  ' + Math.floor(wMastery(tw, this.id)) + '%' + (ready ? '  ✓ tap to deploy' : '')).setColor(hex(ready ? COL.green : COL.brown));
    } else {
      this.traineeDot.setFillStyle(COL.btnOff);
      this.traineeFace.setText('＋');
      this.traineeTag.setText('empty');
      this.traineeLbl.setText('Hire apprentice  ·  ' + HIRE_COST + '💰').setColor(hex(G.coins >= HIRE_COST ? COL.brown : COL.dim));
    }
    this.drawTraineeXp();
    this.stations.forEach((_, i) => this.refreshStation(i));
    this.slots.forEach((_, i) => this.refreshSlot(i));
  }

  // ---------------- HUD / hint ----------------
  refreshHud() {
    this.coinLabel.setText('💰 ' + Math.floor(G.coins));
    this.statLabel.setText('Served ' + this.stall.served + '   🐾' + workersAt(this.id));
  }

  buildHintPill() {
    this.hintBg = this.add.graphics().setDepth(70);
    this.hintTxt = this.add.text(W/2, HINT_Y, '', { fontFamily:FONT, fontSize:'13px', color:hex(COL.brown), fontStyle:'700', align:'center', wordWrap:{ width: 320 } }).setOrigin(0.5).setDepth(71);
  }

  setHint(msg) {
    this.hintTxt.setText(msg || '');
    this.hintBg.clear();
    if (msg) {
      const w = this.hintTxt.width + 24, h = this.hintTxt.height + 14;
      this.hintBg.fillStyle(COL.card, 0.97).fillRoundedRect(W/2-w/2, HINT_Y-h/2, w, h, 11);
      this.hintBg.lineStyle(2, COL.amber, 1).strokeRoundedRect(W/2-w/2, HINT_Y-h/2, w, h, 11);
    }
  }

  flashHint(msg, ms = 1500) {
    this.setHint(msg);
    this.time.delayedCall(ms, () => { if (this.hintTxt.text === msg) this.updateStandingHint(); });
  }

  // The standing instruction shown when nothing transient is up. While a tutorial
  // quest is active it doubles as the quest tracker (goal + reward).
  updateStandingHint() {
    const q = currentQuest();
    if (q) {
      const p = q.prog && q.prog();
      this.setHint('📋 ' + q.text + ' ' + q.emoji + (p ? ' (' + p.n + '/' + p.of + ')' : '') + '   ·   +' + q.reward + '💰');
      return;
    }
    const first = STEPS[this.recipe.steps[0]];
    const u = STALLS[this.id].unlock;
    const panBuyable = u && !this.stall.unlocked.includes(u.recipe);
    const w = this.stall.trainee;
    const staffed = this.stall.autos.filter(Boolean).length, n = this.recipe.steps.length;
    if (!G.firstCookDone)
      this.setHint('👆 Tap ' + first.emoji + ' ' + first.label + ', then the rest, to make a ' + this.recipe.emoji + ' by hand');
    else if (!w && placedAt(this.id) === 0 && G.coins < HIRE_COST)
      this.setHint('Sell a few by hand, then hire an apprentice 🐾 (' + HIRE_COST + '💰) to train');
    else if (w && wTrained(w, this.id))
      this.setHint('🎓 ' + w.name + ' has mastered this recipe — tap a helper slot to deploy them 🤖');
    else if (w)
      this.setHint('Tap any step to raise ' + w.name + '’s mastery — reach 100% to deploy them 🐾');
    else if (isAutomated(this.id) && panBuyable && G.coins >= u.cost)
      this.setHint('Buy the ' + u.equip + ' to unlock ' + RECIPES[u.recipe].name + ' ' + RECIPES[u.recipe].emoji + '!');
    else if (isAutomated(this.id))
      this.setHint('🤖 The whole line is automated! Tap by hand for extra, or ← Market');
    else if (staffed > 0)
      this.setHint('Line ' + staffed + '/' + n + ' automated — tap the rest by hand, or train helpers for them 🤖');
    else
      this.setHint('Hire an apprentice 🐾 — master the recipe by hand-crafting, then deploy them');
  }

  refreshAll() {
    this.refreshHud();
    this.refreshStorage();
    this.refreshTray();
    this.refreshWorkforce();
    this.refreshRecipeTabs();
    this.updateStandingHint();
  }

  // ---------------- Production line: buffered, per-step ----------------
  // Step k draws from its input (pantry for step 0, else the buffer after step k-1)
  // and pushes to its output (the buffer after step k, or the tray for the last step).
  inputAvail(k)  { return k === 0 ? G.pantry[this.cfg.ingredient] > 0 : this.stall.buf[k-1] > 0; }
  outputRoom(k)  { return k === this.recipe.steps.length - 1 ? this.tray.length < TRAY_MAX : this.stall.buf[k] < this.stall.bufCap; }
  canPerform(k)  { return this.inputAvail(k) && this.outputRoom(k); }
  consumeInput(k){ if (k === 0) { G.pantry[this.cfg.ingredient] -= 1; this.refreshStorage(); } else this.stall.buf[k-1] -= 1; }
  // Push step k's output; returns false only if the tray was full at the last step.
  pushOutput(k, fromX, fromY) {
    if (k === this.recipe.steps.length - 1) return this.addDishToTray(fromX, fromY);
    this.stall.buf[k] += 1; return true;
  }

  // First step the player can perform by hand right now (un-automated, input+room).
  firstTappableStep() {
    for (let k = 0; k < this.recipe.steps.length; k++)
      if (!this.stall.autos[k] && this.canPerform(k)) return k;
    return -1;
  }
  // First open slot a mastered worker can take (any step of the active recipe), or -1.
  deployStep(w) {
    if (!wTrained(w, this.id)) return -1;
    for (let k = 0; k < this.recipe.steps.length; k++) if (!this.stall.autos[k]) return k;
    return -1;
  }

  // Player taps a manual workstation: perform one cycle + raise the apprentice's mastery.
  // Each button then cools down (a bit longer than the step's natural time) so it
  // can't be spammed; other stations stay independent, so you juggle the line.
  performManual(k) {
    // Tutorial gate: after the first 3 dishes, the hire quest forces you to take
    // on an apprentice before crafting again (so your first taps actually train them).
    const q = currentQuest();
    if (q && q.emoji === '🐾' && !this.stall.trainee) { this.flashHint('Hire an apprentice first 🐾 — tap the card below'); return; }
    const st = this.stations[k];
    if (st.cd > 0) return;                                // still cooling down
    if (!this.inputAvail(k)) { this.flashHint(k === 0 ? 'Out of ' + INGREDIENTS[this.cfg.ingredient].emoji + ' — tap 📦 Storage to restock' : 'Nothing in the prep tray — do ' + STEPS[this.recipe.steps[k-1]].label + ' first 👈'); return; }
    if (!this.outputRoom(k)) { this.flashHint(STEPS[this.recipe.steps[k]].label + ' prep tray is full — serve or craft downstream 👉'); return; }
    this.consumeInput(k);
    this.pushOutput(k, st.x, st.y);
    st.cd = st.cdMax;                                     // start this button's own cooldown
    this.gainMastery(rollDice(MASTER_DICE_TAP));          // the slot apprentice learns from your work (2d6)
    if (k === this.recipe.steps.length - 1) G.stats.handMade += 1;   // a hand-finished dish (for the quest)
    if (!G.firstCookDone) { G.firstCookDone = true; this.flashHint('Nice — your first ' + this.recipe.emoji + '! Finish 3, then hire an apprentice 🐾', 2600); }
    this.refreshWorkforce(); this.refreshHud();
  }

  // The apprentice in the trainee slot masters the active recipe whenever ANY station
  // is worked — by the player OR by a deployed helper — so helpers train each other.
  // Floats the rolled amount so the RNG is visible.
  gainMastery(amount) {
    const w = this.stall.trainee;
    if (!w) return;
    const key = this.stall.active, before = wMastery(w, this.id);
    if (before >= MASTER_MAX) return;
    w.mastery[key] = Math.min(MASTER_MAX, before + amount);
    this.floatText(TRAINEE.x + 110, TRAINEE.y - 30, '+' + amount, COL.amber);   // show the roll
    if (w.mastery[key] >= MASTER_MAX) {
      this.floatText(TRAINEE.x, TRAINEE.y - 38, '⭐ Mastered!', COL.green);
      this.flashHint('🎓 ' + w.name + ' mastered ' + this.recipe.name + ' — tap a slot to deploy them', 2400);
    }
  }

  // Add one finished dish to the shared tray (returns false if it's full).
  addDishToTray(fromX, fromY) {
    if (this.tray.length >= TRAY_MAX) return false;
    this.tray.push(true);
    const plate = this.trayPlates[this.tray.length - 1];
    const fly = this.add.text(fromX, fromY, this.recipe.emoji, { fontSize:'22px' }).setOrigin(0.5).setDepth(30);
    this.tweens.add({ targets: fly, x: plate.x, y: TRAY_Y, duration: 260, ease:'Quad.Out', onComplete: () => { fly.destroy(); this.refreshTray(); } });
    return true;
  }

  // Auto workstations advance on a timer (speed-scaled) and move items through the
  // buffers. A station only runs if its worker has mastered its step. Processed
  // high→low so a freed buffer slot isn't double-filled in one frame.
  tickAutoStations(delta) {
    const steps = this.recipe.steps;
    const ready = k => wTrained(this.stall.autos[k], this.id);
    for (let k = steps.length - 1; k >= 0; k--) {
      if (!ready(k)) continue;
      const st = this.stations[k];
      let it = this.lineItems[k];
      if (it && it.prog >= 1) {                            // finished — push output if there's room
        if (this.outputRoom(k)) {
          this.pushOutput(k, st.x, st.y); this.lineItems[k] = it = null;
          const aw = this.stall.autos[k]; aw.served += 1;                       // lifetime tally
          aw.recServed[this.stall.active] = (aw.recServed[this.stall.active] || 0) + 1;   // per-recipe (drives leveling)
          this.gainMastery(rollDice(MASTER_DICE_AUTO));                         // slot apprentice learns by watching (1d6)
        }
      }
      if (!it) {                                           // idle — start a new item if possible
        if (this.inputAvail(k) && this.outputRoom(k)) { this.consumeInput(k); this.lineItems[k] = it = { prog: 0 }; }
      }
      // a helper works this station on their own per-station cooldown (>= 2x manual)
      const cyc = wStationCd(this.stall.autos[k], this.id, steps[k]);
      if (it && it.prog < 1) it.prog = Math.min(1, it.prog + delta / cyc);
    }
    this.drawLine();
  }

  // ---------------- Customers ----------------
  spawnCustomer() {
    if (this.customers.length >= QUEUE_MAX) return;
    const idx = this.customers.length;
    const cont = this.add.container(DOOR.x, DOOR.y).setDepth(20);
    cont.add(this.add.circle(0, 0, 21, COL.card).setStrokeStyle(3, COL.dim));
    cont.add(this.add.text(0, 0, '🙂', { fontSize:'21px' }).setOrigin(0.5));
    // order bubble tucked to the upper-right of the guest's head
    cont.add(this.add.circle(22, -16, 13, COL.cream).setStrokeStyle(2, COL.dim));
    const bubble = this.add.text(22, -16, this.recipe.emoji, { fontSize:'15px' }).setOrigin(0.5);
    const patBar = this.add.graphics();
    cont.add([bubble, patBar]);
    const cu = { cont, bubble, patBar, patience: PATIENCE_MS, state:'walking' };
    this.customers.push(cu);
    this.tweens.add({ targets: cont, x: queueX(idx), y: QUEUE_Y[idx], duration: 700, ease:'Sine.InOut', onComplete: () => { if (cu.state === 'walking') cu.state = 'waiting'; } });
  }

  layoutQueue() {
    this.customers.forEach((cu, i) => {
      if (cu.state === 'leaving') return;
      const j = Math.min(i, QUEUE_Y.length-1);
      this.tweens.add({ targets: cu.cont, x: queueX(j), y: QUEUE_Y[j], duration: 250, ease:'Sine.Out' });
    });
  }

  drawPatience(cu) {
    const bw = 40, bh = 6, bx = -bw/2, by = 26;   // just under the guest
    const p = cu.patience / PATIENCE_MS;
    let c = COL.green; if (p < 0.5) c = COL.tan; if (p < 0.25) c = COL.red;
    cu.patBar.clear();
    cu.patBar.fillStyle(COL.cream, 1).fillRoundedRect(bx, by, bw, bh, 3);
    cu.patBar.fillStyle(c, 1).fillRoundedRect(bx, by, bw*Phaser.Math.Clamp(p,0,1), bh, 3);
  }

  serveFront() {
    const cu = this.customers.find(c => c.state === 'waiting');
    if (!cu) return;
    this.tray.pop(); this.refreshTray();
    cu.state = 'leaving';
    cu.patBar.clear();
    cu.bubble.setText('💛');
    const val = this.recipe.value;
    // a dish flies from the tray to the guest, then pays out
    const src = this.trayPlates[this.tray.length] || this.trayPlates[0];
    const fly = this.add.text(src.x, TRAY_Y, this.recipe.emoji, { fontSize:'20px' }).setOrigin(0.5).setDepth(35);
    this.tweens.add({ targets: fly, x: cu.cont.x, y: cu.cont.y, duration: 260, ease:'Quad.Out', onComplete: () => {
      fly.destroy();
      G.coins += val; this.stall.served += 1; this.stall.revenue += val;
      this.floatText(cu.cont.x, cu.cont.y - 30, '+' + val + ' 💰', COL.green);
      this.refreshHud();
    }});
    this.tweens.add({ targets: cu.cont, x: DOOR.x, y: DOOR.y + 40, alpha: 0, duration: 800, delay: 120, ease:'Sine.In', onComplete: () => {
      cu.cont.destroy();
      this.customers = this.customers.filter(c => c !== cu);
      this.layoutQueue();
    }});
  }

  tickCustomers(delta) {
    // Seat any roamers who've wandered into this stall (queued globally by tickArrivals).
    while ((G.pending[this.id] || 0) > 0 && this.customers.length < QUEUE_MAX) {
      G.pending[this.id] -= 1;
      this.spawnCustomer();
    }
    // serve as many fronts as we have tray dishes
    while (this.tray.length > 0 && this.customers.some(c => c.state === 'waiting')) this.serveFront();
    for (const cu of [...this.customers]) {
      if (cu.state !== 'waiting') continue;
      cu.patience -= delta;
      if (cu.patience <= 0) {
        cu.state = 'leaving'; cu.bubble.setText('💨'); cu.patBar.clear();
        this.tweens.add({ targets: cu.cont, x: DOOR.x, y: DOOR.y + 40, alpha: 0, duration: 700, ease:'Sine.In', onComplete: () => {
          cu.cont.destroy(); this.customers = this.customers.filter(c => c !== cu); this.layoutQueue();
        }});
      } else this.drawPatience(cu);
    }
  }

  floatText(x, y, str, color) {
    const t = this.add.text(x, y, str, { fontFamily:FONT, fontSize:'19px', color:hex(color), fontStyle:'700' }).setOrigin(0.5).setDepth(45);
    this.tweens.add({ targets:t, y:y-42, alpha:0, duration:800, ease:'Quad.Out', onComplete:()=>t.destroy() });
  }

  // ---------------- Input ----------------
  handleTap(px, py) {
    if (this.restockModal) { this.restockModalTap(px, py); return; }   // modal swallows all other taps
    if (this.board)        { this.boardTap(px, py); return; }
    if (hitBtn(px, py, this.backBtn)) { this.scene.start('market'); return; }
    if (this.boardBtn && hitBtn(px, py, this.boardBtn)) { this.openBoard(); return; }
    if (inBox(px, py, this.storage, this.storage.w/2, this.storage.h/2)) { this.doRestock(); return; }
    // trainee card: hire an apprentice, or (once ready) deploy them to a station
    if (inBox(px, py, this.traineeBox, this.traineeBox.halfW, this.traineeBox.halfH)) { this.tapTrainee(); return; }
    // recipe tabs: select an unlocked recipe, or buy the equipment that unlocks it
    for (const tab of this.recipeTabs) {
      if (!inBox(px, py, tab, tab.w/2, tab.h/2)) continue;
      if (this.stall.unlocked.includes(tab.key)) {
        this.setActiveRecipe(tab.key);
        this.flashHint('Now making ' + RECIPES[tab.key].emoji + ' ' + RECIPES[tab.key].name);
      } else {
        this.tryBuyEquipment(tab.key);
      }
      return;
    }
    // a helper slot (beneath a button): deploy a ready apprentice, or show the worker's profile
    for (const sl of this.slots) {
      if (Math.abs(px - sl.x) > 24 || Math.abs(py - sl.y) > 24) continue;
      this.tapSlot(sl.i);
      return;
    }
    // a manual button: the player performs that step by hand (always available)
    for (const st of this.stations) {
      if (!inBox(px, py, st, st.w/2, st.h/2)) continue;
      this.performManual(st.i);
      return;
    }
  }

  // Helper slot beneath step i: deploy a mastered apprentice here, or show the worker's profile.
  tapSlot(i) {
    const w = this.stall.autos[i];
    if (w) {
      const sid = this.recipe.steps[i], cd = (wStationCd(w, this.id, sid)/1000).toFixed(1), rk = this.stall.active;
      const lvl = isStarterRecipe(this.id, rk) ? '' : '  ·  Lv ' + wRecipeLevel(w, rk);
      this.flashHint('🤖 ' + w.emoji + ' ' + w.name + lvl + '  ·  ' + STEPS[sid].label + ' every ' + cd + 's  ·  made ' + w.served);
      return;
    }
    const tw = this.stall.trainee;
    if (tw && wTrained(tw, this.id)) this.deployTo(i, tw);
    else this.flashHint('Master this recipe (100%) with an apprentice in the slot, then deploy here 🐾');
    this.refreshHud(); this.refreshWorkforce(); this.updateStandingHint();
  }

  // Tapping Storage opens a confirmation before the big spend.
  doRestock() {
    if (this.restockModal) return;
    if (G.coins < RESTOCK_COST) { this.flashHint('Need ' + RESTOCK_COST + ' 💰 for a full restock'); return; }
    this.openRestockConfirm();
  }

  // Apply the purchase (called from the confirmation's Confirm button).
  confirmRestock() {
    if (G.coins < RESTOCK_COST) { this.flashHint('Need ' + RESTOCK_COST + ' 💰 for a full restock'); return; }
    const amt = restockAmount();
    G.coins -= RESTOCK_COST;
    G.pantry[this.cfg.ingredient] += amt;
    G.stats.restocks += 1;
    this.refreshHud(); this.refreshStorage();
    // a big, deliberate resupply — give it a moment
    this.floatText(this.storage.x, this.storage.y - 44, '📦 +' + amt, COL.green);
    this.flashHint('📦 Supplies restocked! +' + amt + ' ' + INGREDIENTS[this.cfg.ingredient].emoji, 2200);
  }

  // ---------------- Restock confirmation modal ----------------
  openRestockConfirm() {
    const ing = this.cfg.ingredient, cx = W/2, cy = 420, pw = 300, ph = 196;
    const cont = this.add.container(0, 0).setDepth(95);
    cont.add(this.add.rectangle(W/2, H/2, W, H, 0x2A211B, 0.55));          // backdrop swallows outside taps
    const panel = this.add.graphics();
    panel.fillStyle(COL.card, 1).fillRoundedRect(cx-pw/2, cy-ph/2, pw, ph, 18);
    panel.lineStyle(3, this.cfg.accent, 1).strokeRoundedRect(cx-pw/2, cy-ph/2, pw, ph, 18);
    cont.add(panel);
    cont.add(this.add.text(cx, cy-66, '📦 Restock supplies', { fontFamily:FONT, fontSize:'18px', color:hex(COL.brown), fontStyle:'800' }).setOrigin(0.5));
    cont.add(this.add.text(cx, cy-34, 'Buy ' + restockAmount() + ' ' + INGREDIENTS[ing].emoji + ' for ' + RESTOCK_COST + ' 💰', { fontFamily:FONT, fontSize:'15px', color:hex(COL.brown), fontStyle:'700' }).setOrigin(0.5));
    cont.add(this.add.text(cx, cy-8, 'Balance ' + Math.floor(G.coins) + ' 💰  →  ' + (Math.floor(G.coins) - RESTOCK_COST) + ' 💰', { fontFamily:FONT, fontSize:'12px', color:hex(COL.dim), fontStyle:'700' }).setOrigin(0.5));
    // buttons
    const by = cy + 48, bw = 124, bh = 44, gap = 12;
    const confirmX = cx - bw/2 - gap/2, cancelX = cx + bw/2 + gap/2;
    cont.add(this.add.rectangle(confirmX, by, bw, bh, COL.btn).setStrokeStyle(2, COL.brown));
    cont.add(this.add.text(confirmX, by, 'Restock  ' + RESTOCK_COST + '💰', { fontFamily:FONT, fontSize:'14px', color:'#FFFFFF', fontStyle:'800' }).setOrigin(0.5));
    cont.add(this.add.rectangle(cancelX, by, bw, bh, COL.btnOff).setStrokeStyle(2, COL.brown));
    cont.add(this.add.text(cancelX, by, 'Cancel', { fontFamily:FONT, fontSize:'14px', color:hex(COL.brown), fontStyle:'800' }).setOrigin(0.5));
    this.restockModal = { cont, by, bh, bw, confirmX, cancelX };
  }

  closeRestockConfirm() {
    if (!this.restockModal) return;
    this.restockModal.cont.destroy();
    this.restockModal = null;
  }

  restockModalTap(px, py) {
    const m = this.restockModal;
    const on = (bx) => Math.abs(px - bx) <= m.bw/2 && Math.abs(py - m.by) <= m.bh/2;
    if (on(m.confirmX)) { this.closeRestockConfirm(); this.confirmRestock(); return; }
    this.closeRestockConfirm();   // Cancel button, or tap anywhere outside
  }

  // ---------------- Market Board (HQ): market-wide upgrades ----------------
  openBoard() {
    const keys = Object.keys(MARKET_UPGRADES);
    const cx = W/2, rowH = 76, top = 150, pw = 320, ph = 70 + keys.length*rowH + 30;
    const cont = this.add.container(0, 0).setDepth(95);
    cont.add(this.add.rectangle(W/2, H/2, W, H, 0x2A211B, 0.55));
    const panel = this.add.graphics();
    panel.fillStyle(COL.card, 1).fillRoundedRect(cx-pw/2, top, pw, ph, 18);
    panel.lineStyle(3, COL.amber, 1).strokeRoundedRect(cx-pw/2, top, pw, ph, 18);
    cont.add(panel);
    cont.add(this.add.text(cx, top+26, '📋 Market Board', { fontFamily:FONT, fontSize:'19px', color:hex(COL.brown), fontStyle:'800' }).setOrigin(0.5));
    cont.add(this.add.text(cx, top+48, 'market-wide upgrades — buff every stall', { fontFamily:FONT, fontSize:'11px', color:hex(COL.dim), fontStyle:'700' }).setOrigin(0.5));
    const rows = [];
    keys.forEach((key, i) => {
      const u = MARKET_UPGRADES[key], ry = top + 70 + i*rowH + rowH/2;
      const lv = upLevel(key), maxed = upMaxed(key), cost = upCost(key), afford = G.coins >= cost;
      const rowBg = this.add.graphics();
      rowBg.fillStyle(COL.cream, 0.9).fillRoundedRect(cx-pw/2+14, ry-rowH/2+6, pw-28, rowH-12, 12);
      cont.add(rowBg);
      cont.add(this.add.text(cx-pw/2+30, ry-14, u.emoji + ' ' + u.name + '  Lv ' + lv + '/' + u.max, { fontFamily:FONT, fontSize:'14px', color:hex(COL.brown), fontStyle:'800' }).setOrigin(0,0.5));
      cont.add(this.add.text(cx-pw/2+30, ry+8, u.desc, { fontFamily:FONT, fontSize:'10px', color:hex(COL.dim), fontStyle:'700' }).setOrigin(0,0.5));
      // buy button on the right
      const bw=78, bh=40, bx=cx+pw/2-30-bw/2;
      const fill = maxed ? COL.btnOff : (afford ? COL.btn : COL.btnOff);
      cont.add(this.add.rectangle(bx, ry, bw, bh, fill).setStrokeStyle(2, COL.brown));
      cont.add(this.add.text(bx, ry, maxed ? 'MAX' : (cost+'💰'), { fontFamily:FONT, fontSize:'13px', color:'#FFFFFF', fontStyle:'800' }).setOrigin(0.5));
      rows.push({ key, bx, ry, bw, bh, maxed });
    });
    const cy2 = top+ph-22;
    cont.add(this.add.text(cx, cy2, 'tap outside to close', { fontFamily:FONT, fontSize:'11px', color:hex(COL.dim), fontStyle:'700' }).setOrigin(0.5));
    this.board = { cont, rows };
  }

  closeBoard() { if (this.board) { this.board.cont.destroy(); this.board = null; } }

  boardTap(px, py) {
    for (const r of this.board.rows) {
      if (r.maxed) continue;
      if (Math.abs(px - r.bx) <= r.bw/2 && Math.abs(py - r.ry) <= r.bh/2) { this.buyUpgrade(r.key); return; }
    }
    this.closeBoard();   // tap outside any buy button closes
  }

  buyUpgrade(key) {
    const cost = upCost(key);
    if (upMaxed(key)) return;
    if (G.coins < cost) { this.flashHint('Need ' + cost + ' 💰 for ' + MARKET_UPGRADES[key].name); return; }
    G.coins -= cost;
    G.upgrades[key] = upLevel(key) + 1;
    this.refreshHud();
    this.closeBoard(); this.openBoard();   // reopen to show new level/cost
    this.flashHint(MARKET_UPGRADES[key].emoji + ' ' + MARKET_UPGRADES[key].name + ' → Lv ' + upLevel(key), 1800);
  }

  // Trainee slot: hire an apprentice when empty; once they've mastered the recipe,
  // tap the ready apprentice to deploy them (free) onto the first open line station.
  tapTrainee() {
    const tw = this.stall.trainee;
    if (!tw) {
      if (G.coins < HIRE_COST) { this.flashHint('Need ' + HIRE_COST + ' 💰 to hire an apprentice'); return; }
      G.coins -= HIRE_COST;
      const w = makeWorker();
      this.stall.trainee = w;
      this.flashHint('Hired ' + w.emoji + ' ' + w.name + '! Craft by hand to train them 🐾');
    } else {
      const k = this.deployStep(tw);                      // first open station whose step they've mastered
      if (k >= 0) this.deployTo(k, tw);
      else this.flashHint(tw.name + ' is still learning — hand-craft a step to mastery');
    }
    this.refreshHud(); this.refreshWorkforce(); this.updateStandingHint();
  }

  // Move the apprentice onto line station `i`. Returns false if invalid.
  deployTo(i, w) {
    if (i < 0) return false;
    this.stall.autos[i] = w;
    this.stall.trainee = null;
    this.lineItems[i] = null;
    this.flashHint(w.emoji + ' ' + w.name + ' took the ' + STEPS[this.recipe.steps[i]].label + ' station 🤖');
    return true;
  }

  // During the "hire your apprentice" tutorial step (when manual crafting is
  // blocked), freeze the whole game until you actually hire — no wages, customers,
  // or auto-work — so nothing slips by while the player is told to hire.
  tutorialFrozen() {
    const q = currentQuest();
    return !!(q && q.emoji === '🐾' && !this.stall.trainee);
  }

  update(time, delta) {
    this.checkQuest();               // let hiring complete the quest (unfreezes everything)
    if (!this.tutorialFrozen()) {
      tickWages(delta);
      tickPassive(delta, this.id);   // other automated stalls keep earning while you're here
      tickArrivals(delta);           // roamers wander into stalls (this one + others) over time
      this.stations.forEach(st => { if (st.cd > 0) st.cd = Math.max(0, st.cd - delta); });   // manual button cooldowns
      this.tickAutoStations(delta);  // staffed workstations advance + move items through buffers
      this.tickCustomers(delta);
    }
    this.checkAutomationMilestone(time);
    this.drawStorageAlert(time);
    this.drawSpotlight();
    this.drawHighlight(time);
    this.refreshHud();
  }

  checkQuest() {
    const q = tryCompleteQuest();
    if (!q) return;
    this.floatText(W/2, 150, '✅ +' + q.reward + ' 💰', COL.green);
    this.flashHint('✅ Quest done: ' + q.text + '  ·  +' + q.reward + '💰', 2600);
    this.refreshHud();
  }

  // Celebrate the first time a stall starts running itself, and point the way out.
  checkAutomationMilestone(time) {
    const now = isAutomated(this.id);
    if (now && !this.wasAutomated) {
      this.floatText(W/2, LINE_Y + 70, '🎉 Line automated!', COL.green);
      this.flashHint('🎉 A helper is cooking hands-free! Keep crafting by hand, or ← Market for another stall', 2800);
      this.guideBackUntil = time + 5000;
      G.taughtAutomate = true;       // teaching highlights stop nagging from here on
    }
    this.wasAutomated = now;
  }
}
function queueX(i) { return W/2 + (QUEUE_DX[i] || 0); }

new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game',
  width: W, height: H,
  backgroundColor: hex(COL.cream),
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [Market, Stall],
});
</script>
</body>
</html>
